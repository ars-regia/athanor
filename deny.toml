# cargo-deny policy (ADR-0075 item 2).
#
# One policy for the root workspace lockfile. `just check-deny` applies its licences,
# bans and sources in the pull request gate; scripts/ci/security-audit.sh applies its
# advisories, on pull requests, pushes and a weekly schedule. The
# packages built from their own vendored lockfile (athanor-backup's release tarball,
# greenboot-rs) are not covered yet. The licence
# allow-list is the set of identifiers the current dependency graph contains, derived
# from `cargo metadata`; an entry nothing uses is a warning, so it cannot go stale
# unnoticed.

[graph]
all-features = true
no-default-features = false

[advisories]
# No blanket ignores. Every ignore added here needs a reason and a review date:
#   { id = "RUSTSEC-YYYY-NNNN", reason = "why it cannot be fixed now" }  # review: YYYY-MM-DD
ignore = []
unmaintained = "workspace"
yanked = "deny"

[licenses]
# The project is GPL-3.0-or-later (decision A2-3). Every identifier below is compatible
# with distributing the combined work under GPL-3.0 terms; GPL-2.0-only and
# LGPL-2.0-only are not, and stay out.
allow = [
  "GPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "0BSD",
  "BSD-1-Clause",
  "LGPL-2.1-or-later",
  "MPL-2.0",
  "Unlicense",
]
confidence-threshold = 0.9
exceptions = [
  # GPL-3.0-only is compatible with the GPL-3.0-or-later combined work. Only the greeter
  # links greetd_ipc, so the greeter is GPL-3.0-only too (OWN_LICENCE_EXCEPTIONS in
  # scripts/verify.py); a GPL-3.0-only crate anywhere else is rejected.
  { allow = ["GPL-3.0-only"], crate = "greetd_ipc" },
  { allow = ["GPL-3.0-only"], crate = "athanor-greeter-ui" },
  # The IJG licence covers the bundled libjpeg-derived code.
  { allow = ["IJG"], crate = "jpeg-encoder" },
]

[bans]
multiple-versions = "warn"
# Workspace crates reference each other by path without a version and are not marked
# `publish = false`, which cargo-deny reads as a wildcard on a public crate. Flip to
# "deny" once every member inherits `publish = false` (ENG-07).
wildcards = "warn"
highlight = "all"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependency is in use today. A new one is added here with its exact URL.
allow-git = []
