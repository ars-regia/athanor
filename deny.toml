# cargo-deny policy for the root workspace (Cargo.lock). `just check-deny` runs
# licenses, bans and sources in the pull request gate; advisories run in the scheduled
# rust-security-audit.yml, because they depend on a database that changes without a commit.
#
# Own code is GPL-3.0-or-later (ADR-0038). A dependency is allowed when its licence lets
# the combined work be distributed under GPL-3.0 terms.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Every entry names the advisory it excuses and why; an entry that no longer matches a
# crate of the lockfile is removed (cargo-deny reports it as unmatched).
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained and is a proc-macro that only glycin-common (athanor-preview-render) uses at build time; there is no vulnerability, only a maintenance notice, and glycin has no release without it yet" },
]

[licenses]
# Only the identifiers the lockfile contains. cargo-deny picks the alternative of an OR
# expression that is allowed, so "MPL-2.0 OR LGPL-2.1-or-later" is satisfied by MPL-2.0.
# Not allowed on purpose: GPL-2.0-only and LGPL-2.0-only (cannot be combined with
# GPL-3.0), and every licence with a network or advertising clause.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "GPL-3.0-or-later", # our own crates
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    # greetd_ipc is GPL-3.0-only and only the greeter links it; the greeter binary is
    # therefore GPL-3.0-only too (verify.py licence, OWN_LICENCE_EXCEPTIONS). A GPL-3.0-only
    # crate anywhere else is rejected.
    { crate = "greetd_ipc", allow = ["GPL-3.0-only"] },
    { crate = "athanor-greeter-ui", allow = ["GPL-3.0-only"] },
    # jpeg-encoder is "(MIT OR Apache-2.0) AND IJG": the IJG terms are a BSD-style notice
    # clause, compatible with GPL-3.0. Reached through glycin-image-rs by athanor-preview-render.
    { crate = "jpeg-encoder", allow = ["IJG"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
