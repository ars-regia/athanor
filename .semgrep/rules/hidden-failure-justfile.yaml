# The recipes of the Justfile are shell too, and no verify.py check reads them: the patterns of
# hidden-failure.yaml, applied to every Justfile of the tree.
rules:
  - id: hidden-failure-justfile
    languages: [generic]
    severity: ERROR
    message: >-
      This recipe line hides a failure (AGENTS.md, "No hidden failures"): send the output to a
      log, or report the error on stderr and handle it.
    paths:
      include:
        - Justfile
        - '*.just'
    patterns:
      - pattern-regex: '2>[>|]?\s*["'']?/dev/null["'']?|&>>?\s*["'']?/dev/null["'']?|>&\s*["'']?/dev/null["'']?|>\|?\s*["'']?/dev/null["'']?\s+2>&1|2>&-|\|\|\s*(?:(?:(?:/usr)?/bin/true|true|:|exit\s+0|return\s+0)(?![\w-])|\{\s*(?:(?:/usr)?/bin/true|true|:|exit\s+0|return\s+0)\s*;?\s*\}|\(\s*(?:(?:/usr)?/bin/true|true|:|exit\s+0|return\s+0)\s*;?\s*\))|\|\|(?!\s*[{(])[^;|&\n]*(?:;|&&)\s*(?:(?:/usr)?/bin/true|true|:|exit\s+0|return\s+0)(?![\w-])|\|\|\s*[{(][^;|&\n]*;\s*(?:true|:)\s*;?\s*[})]|2>&1\s*\|\|\s*(?:break|continue)\b'
      - pattern-not-regex: '(?m)(?:^|\s)#.*$'
      - pattern-not-regex: 'kill\s+-0\s+\S+\s+2>\s*["'']?/dev/null["'']?'
