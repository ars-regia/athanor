# Configuration of zizmor, the workflow linter of `just check` (scripts/ci/zizmor.sh,
# doc_pipeline.md PL28). An exemption of one line stays beside it as `# zizmor: ignore[...]`,
# with its reason; this file holds only what applies to every workflow.
rules:
  # The `uses: $/...` form it asks for is rejected by actionlint (1.7.9 in CI, 1.7.12 checked),
  # which would then lose its checks of every local action and reusable workflow call.
  # Revisit when actionlint accepts the form.
  self-repository:
    disable: true
