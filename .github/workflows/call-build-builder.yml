name: Reusable Build Builder Workflow

on:
  workflow_call:
    outputs:
      content_hash:
        description: "Content hash of the base builder image"
        value: ${{ jobs.build-builder.outputs.content_hash }}
      image:
        description: "The builder image by its digest, verified signed by a trusted run of this workflow"
        value: ${{ jobs.build-builder.outputs.image }}

env:
  # REGISTRY_HOST repository variable, default ghcr.io (as in forge-ghcr-cleanup.yml).
  REGISTRY: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
  SCCACHE_CACHE_SIZE: 5G

jobs:
  # No lint job of its own: the Orchestrator, its only caller, runs call-lint.yml once and
  # calls this workflow only after it passed (docs/architecture/doc_pipeline.md, PL44).
  build-builder:
    name: 🏗️ Build Base Builder
    outputs:
      content_hash: ${{ steps.check_idempotency.outputs.content_hash }}
      image: ${{ steps.check_idempotency.outputs.image || steps.publish.outputs.image }}
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: forge
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: ❄️ Install Nix (Bedrock Cache)
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Check Idempotency (Content Hash)
        id: check_idempotency
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | podman login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin
          # On the runner itself, not inside the builder image: the check decides whether
          # that image has to exist, so it cannot depend on it (first run, renamed image).
          # The script needs bash, coreutils, skopeo and jq, all on the runner, and the
          # flake's cosign: a hit is a digest a trusted run of this workflow signed (#1205).
          nix shell --inputs-from .. nixpkgs#cosign -c bash scripts/check_idempotency.sh --package builder --registry "${REGISTRY}" --owner "${GITHUB_REPOSITORY_OWNER}" --image-name athanor-builder > idemp.out
          source ./idemp.out
          if [ "$CACHE_HIT" = "true" ]; then
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
          fi
          echo "content_hash=$CONTENT_HASH" >> "$GITHUB_OUTPUT"

      - name: Build, publish and sign the builder (forge/scripts/publish_builder.sh)
        id: publish
        if: steps.check_idempotency.outputs.cache_hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTENT_HASH: ${{ steps.check_idempotency.outputs.content_hash }}
        run: |
          set -euo pipefail
          # Signed keyless with this job's id-token, as call-dag-compile.yml signs the package images.
          nix shell --inputs-from .. nixpkgs#cosign -c bash scripts/publish_builder.sh \
            "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/athanor-builder" "$CONTENT_HASH" > "$RUNNER_TEMP/builder.ref"
          echo "image=$(< "$RUNNER_TEMP/builder.ref")" >> "$GITHUB_OUTPUT"

      - name: Point the builder's latest tag at this verified digest (default branch only)
        env:
          IMAGE: ${{ steps.check_idempotency.outputs.image || steps.publish.outputs.image }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: nix shell --inputs-from .. nixpkgs#cosign -c bash scripts/promote_builder_latest.sh "$IMAGE" "$GITHUB_REF" "$DEFAULT_BRANCH"

      - name: 🧹 Cleanup Workspace Permissions
        if: always()
        run: podman unshare chown -R "$USER:$USER" ${{ github.workspace }} || true

      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
