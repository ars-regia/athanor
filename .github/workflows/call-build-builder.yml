name: Reusable Build Builder Workflow

on:
  workflow_call:
    outputs:
      content_hash:
        description: "Content hash of the base builder image"
        value: ${{ jobs.build-builder.outputs.content_hash }}

env:
  # REGISTRY_HOST repository variable, default ghcr.io (as in forge-ghcr-cleanup.yml).
  REGISTRY: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
  FEDORA_VERSION: 43
  SCCACHE_CACHE_SIZE: 5G

jobs:
  # No lint job of its own: the Orchestrator, its only caller, runs call-lint.yml once and
  # calls this workflow only after it passed (docs/architecture/doc_pipeline.md, PL44).
  build-builder:
    name: 🏗️ Build Base Builder
    outputs:
      content_hash: ${{ steps.check_idempotency.outputs.content_hash }}
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: forge
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ❄️ Install Nix (Bedrock Cache)
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Check Idempotency (Content Hash)
        id: check_idempotency
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login "${REGISTRY}" -u ${{ github.actor }} --password-stdin
          # On the runner itself, not inside the builder image: the check decides whether
          # that image has to exist, so it cannot depend on it (first run, renamed image).
          # The script only needs bash, coreutils and skopeo, all on the runner.
          bash scripts/check_idempotency.sh --package builder --registry "${REGISTRY}" --owner ${{ github.repository_owner }} --image-name athanor-builder > idemp.out
          source ./idemp.out
          if [ "$CACHE_HIT" = "true" ]; then
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
          fi
          echo "content_hash=$CONTENT_HASH" >> "$GITHUB_OUTPUT"

      - name: Build and Publish Builder (Pure Nix)
        if: steps.check_idempotency.outputs.cache_hit != 'true'
        run: |
          set -euo pipefail
          echo "Building OCI image purely via Nix Flake..."
          nix build --extra-experimental-features "nix-command flakes" ../#builderImage
          # The name the flake gives the image, whatever registry it was written for.
          loaded=$(podman load -i result | sed -n 's/^Loaded image[^:]*: //p')
          [[ -n $loaded ]] || { echo "podman load reported no image name" >&2; exit 1; }
          
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login "${REGISTRY}" -u ${{ github.actor }} --password-stdin
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/athanor-builder" | tr '[:upper:]' '[:lower:]')
          podman tag "$loaded" "$IMAGE_LOWER:${{ steps.check_idempotency.outputs.content_hash }}"
          bash scripts/retry.sh podman push "$IMAGE_LOWER:${{ steps.check_idempotency.outputs.content_hash }}"
          echo "Waiting 15 seconds for GHCR eventual consistency..."
          sleep 15

      - name: Point athanor-builder:latest at this builder (default branch only)
        env:
          CONTENT_HASH: ${{ steps.check_idempotency.outputs.content_hash }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/promote_builder_latest.sh "${REGISTRY}/${{ github.repository_owner }}/athanor-builder" "$CONTENT_HASH" "$GITHUB_REF" "$DEFAULT_BRANCH"

      - name: 🧹 Cleanup Workspace Permissions
        if: always()
        run: podman unshare chown -R "$USER:$USER" ${{ github.workspace }} || true

      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
