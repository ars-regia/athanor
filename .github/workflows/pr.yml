name: Pull Request

# The pull request workflow (docs/architecture/doc_pipeline.md section 3, ADR-0075). Every pull
# request and every merge group runs it whole: no path filter decides whether it runs (PL3).
#
# changes: scripts/ci/changes.py writes changes.json, the areas the change touches; it is the
#   `changes` artifact, and the job output carries the same JSON for the `if:` of the jobs.
# check-*: the parts of `just check`, the gate a contributor runs locally, one job and one recipe
#   each so they run in parallel: check-static (lint, every verify.py check with
#   scripts/ci/known-red.txt, kernel profile, Calmo), check-system and check-other (the Python
#   test directories), check-rust (`cargo test` over the root workspace in the shell rig's build
#   stage, and cargo-deny); tools pinned by digest.
# kernel:  the kernel check (call-kernel.yml) when changes.json selects the kernel.
# specs:   Spec Build Check (spec-build-check.yml) when changes.json selects the specs.
# shell:   the visual tests of the shell rig (shell-surfaces.yml) when changes.json selects shell.
# gate:    the one required check. It needs every other job, always runs, and is red when a job
#   it needs failed or was cancelled, or when an area the change selects did not run
#   (scripts/ci/gate.py). A skipped build is a pass.
#
# kernel-build.yml no longer runs on pull requests to iso-v0: the kernel is built once, in the
# `kernel` job, and `gate` is the required check (doc_ci.md CP4); spec-build-check.yml runs only
# as the `specs` job, and bot-merge.yml follows this workflow for the spec bot.

on:
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The base the change is measured against: the target branch of the pull request, or the
  # base of the merge group.
  BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changes: ${{ steps.changes.outputs.json }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Change detection (scripts/ci/changes.py)
        id: changes
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 -B scripts/ci/changes.py "$BASE" "$RUNNER_TEMP/out/changes.json"
          echo "json=$(< "$RUNNER_TEMP/out/changes.json")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: changes
          path: ${{ runner.temp }}/out/changes.json
          if-no-files-found: error

  check-static:
    runs-on: ubuntu-24.04
    # Measured at about 2 minutes: lint, verify.py, kernel profile, Calmo, forge/test/iso.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pinned tools (scripts/ci/install-tools.sh)
        run: |
          set -euo pipefail
          bash scripts/ci/install-tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: just check-static
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"
          just check-static "$BASE"

  check-system:
    runs-on: ubuntu-24.04
    # Measured at about 3 minutes (system/tests, 157 s).
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pinned tools (scripts/ci/install-tools.sh)
        run: |
          set -euo pipefail
          bash scripts/ci/install-tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: just check-unit system
        run: |
          set -euo pipefail
          just check-unit system

  check-other:
    runs-on: ubuntu-24.04
    # Measured at about 4 minutes: every other Python test directory.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pinned tools (scripts/ci/install-tools.sh)
        run: |
          set -euo pipefail
          bash scripts/ci/install-tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: just check-unit other
        run: |
          set -euo pipefail
          just check-unit other

  check-rust:
    runs-on: ubuntu-24.04
    # The longest part, about 11 minutes: the rig image pull and its build stage (267 s), a cold
    # workspace build and test (about 290 s), preview-render, the toolkit rustdoc and the gallery
    # (about 120 s) and cargo-deny, with no cache on the pull request path.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pinned tools (scripts/ci/install-tools.sh)
        run: |
          set -euo pipefail
          bash scripts/ci/install-tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: just check-rust and check-deny
        run: |
          set -euo pipefail
          just check-rust
          just check-deny

  kernel:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.changes).kernel }}
    # actions and pull-requests: the inputs job of call-kernel.yml asks for them, because it
    # mirrors kernel-build.yml's, whose promotion step reads the API on a push (ADR-0110).
    # GitHub validates a called workflow's permissions when the run starts.
    permissions:
      contents: read
      packages: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/call-kernel.yml

  specs:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.changes).specs }}
    # What Spec Build Check's jobs ask for: GitHub validates a called workflow's permissions
    # when the run starts, even for jobs that will be skipped.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/spec-build-check.yml

  shell:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.changes).shell }}
    permissions:
      contents: read
    uses: ./.github/workflows/shell-surfaces.yml

  gate:
    needs: [changes, check-static, check-system, check-other, check-rust, kernel, specs, shell]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verdict (scripts/ci/gate.py)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          printf '%s\n' "$NEEDS" > "$RUNNER_TEMP/out/needs.json"
          python3 -B scripts/ci/gate.py "$RUNNER_TEMP/out/needs.json" | tee -a "$GITHUB_STEP_SUMMARY"
