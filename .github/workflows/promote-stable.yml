name: Promote a system image run to stable

# Decision D1 of docs/architecture/doc_update_trust.md: users follow :stable, :latest is the
# newest, untested build of the release branch. The logic is system/promote-auto.sh, which chooses the
# run, and system/promote.sh, which refuses any digest without a signature machines verify or
# without passing acceptance evidence: a cosign attestation on that digest, made keyless by
# iso-acceptance.yml on the release branch, matching the run, the digest and the commit, or
# whose build run is not a successful Orchestrator run of the release branch. No
# artifact or file this job downloads is trusted, and no signing key is involved here.
#   - On schedule: the newest accepted Orchestrator run of the release branch older than the
#     dwell time (repository variable PROMOTE_DWELL_HOURS, default 24), when it is newer than
#     :stable.
#   - By hand with a run id: that run, without the dwell time (the maintainer's override).
#   - By hand with a security reason: no dwell time, and the advisory ids (CVE, GHSA, RUSTSEC,
#     FEDORA) are kept in the promotion record (the out-of-band path for a critical fix).
# Both dwell-skipping paths wait for a reviewer of the stable-override environment, and
# system/require-review.sh then requires that environment to demand review and this run to
# carry an approval from a person with write access other than the one who dispatched it:
# write access alone dispatches an override but does not approve it. Maintainer settings,
# doc_update_trust.md D1.
# Disabling this workflow stops automatic promotion; :stable then moves only by hand.
# It promotes only from the release branch (repository variable RELEASE_BRANCH, default
# iso-v0), so the scripts that decide are the reviewed ones. A run on any other branch, the
# schedule included when the default branch is not the release branch, fails with an error
# rather than skipping quietly.

on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the Orchestrator run whose three system images become stable; empty for the newest accepted run"
        required: false
        type: string
        default: ""
      security_reason:
        description: "Out-of-band security fix: the advisory ids that skip the dwell time, comma-separated (CVE-, GHSA-, RUSTSEC-, FEDORA-). Empty for a normal promotion"
        required: false
        type: string
        default: ""

concurrency:
  group: promote-stable
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/call-lint.yml

  override:
    name: Approve the dwell-time override
    if: inputs.run_id != '' || inputs.security_reason != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: stable-override
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require a reviewed environment (system/require-review.sh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash system/require-review.sh stable-override

  promote:
    name: Point stable at the run
    needs: [lint, override]
    # The override job is skipped exactly when both inputs are empty: then the dwell time holds.
    # A failed, cancelled or rejected override skips this job; !cancelled(), not always(), so a
    # cancelled workflow does not promote either.
    if: >-
      !cancelled() && needs.lint.result == 'success'
      && (needs.override.result == 'success'
          || (needs.override.result == 'skipped' && inputs.run_id == '' && inputs.security_reason == ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Require the release branch
        env:
          RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'iso-v0' }}
        run: |
          [[ $GITHUB_REF == "refs/heads/${RELEASE_BRANCH}" ]] \
            || { echo "::error::promotion runs only on ${RELEASE_BRANCH} (RELEASE_BRANCH), not ${GITHUB_REF}: set RELEASE_BRANCH or the default branch so the schedule runs there"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Log in to the registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
        run: echo "${GITHUB_TOKEN}" | skopeo login "${REGISTRY_HOST}" -u "${GITHUB_ACTOR}" --password-stdin
      - name: Promote (system/promote-auto.sh)
        env:
          RUN_ID: ${{ inputs.run_id }}
          SECURITY_REASON: ${{ inputs.security_reason }}
          PROMOTE_DWELL_HOURS: ${{ vars.PROMOTE_DWELL_HOURS || '24' }}
          PROMOTE_TRUSTED_REFS: ${{ vars.RELEASE_BRANCH || 'iso-v0' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          bash system/promote-auto.sh promotion/promotion-record.json | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Keep the promotion record
        if: hashFiles('promotion/promotion-record.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-${{ github.run_id }}
          path: promotion/promotion-record.json
          if-no-files-found: error
          retention-days: 400
