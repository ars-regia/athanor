name: Promote a system image run to stable

# Moves :stable of the system images of one build run on the evidence of that run, by digest
# (doc_update_delivery.md UD3-UD5; doc_pipeline.md PL60; ADR-0103 D23; ADR-0106). The plan job
# checks the evidence and the dwell, signs the evidence bundle keylessly, copies it off GitHub
# and verifies the copy; the promote job runs only after the release approval and checks
# everything again before it moves a tag. No signing key is involved. The logic is in
# system/fetch-evidence.sh, scripts/ci/promotion-plan.sh, system/promote.sh (both on
# scripts/ci/promotion-record.sh) and system/evidence-bundle.sh.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the build run whose system images become stable"
        required: true
        type: string
      hardware_override:
        description: "Promote athanor-system-nvidia without hardware evidence (ADR-0106, until 0.9); recorded in promotion.json"
        required: true
        type: choice
        options: [none, athanor-system-nvidia]
        default: none

concurrency:
  group: promote-stable
  cancel-in-progress: false

permissions:
  contents: read

# GitHub's bash shell runs with -eo pipefail: without it a step takes tee's exit status and a
# refused promotion shows green.
defaults:
  run:
    shell: bash

env:
  RUN_ID: ${{ inputs.run_id }}
  # Empty for `none`, so the scripts get no flag at all.
  OVERRIDE: ${{ inputs.hardware_override != 'none' && inputs.hardware_override || '' }}
  REGISTRY: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}/${{ github.repository_owner }}
  # The copy off GitHub, one per promotion run (Task 9); both jobs of a run name the same one.
  EVIDENCE_REF: ${{ vars.EVIDENCE_REGISTRY }}/athanor-evidence:${{ inputs.run_id }}-${{ github.run_id }}

jobs:
  lint:
    uses: ./.github/workflows/call-lint.yml

  plan:
    name: Plan the promotion
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      actions: read
      id-token: write
    steps:
      - name: Release only from iso-v0 (PL54, PL60)
        run: '[[ $GITHUB_REF == refs/heads/iso-v0 ]] || { echo "::error::promote-stable.yml runs only on refs/heads/iso-v0, not $GITHUB_REF"; exit 1; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Log in to the registries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
          EVIDENCE_REGISTRY: ${{ vars.EVIDENCE_REGISTRY }}
          EVIDENCE_REGISTRY_USER: ${{ vars.EVIDENCE_REGISTRY_USER }}
          EVIDENCE_REGISTRY_TOKEN: ${{ secrets.EVIDENCE_REGISTRY_TOKEN }}
        run: bash system/promote-login.sh
      - name: 📥 Fetch the run's evidence (system/fetch-evidence.sh)
        # The job token only where gh runs: no action and no nix fetch of this job sees it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash system/fetch-evidence.sh "${RUN_ID}" artifacts
      - name: 🧮 Plan the promotion (scripts/ci/promotion-plan.sh)
        run: bash scripts/ci/promotion-plan.sh ${OVERRIDE:+--hardware-override "$OVERRIDE"} "${RUN_ID}"
      - name: 🔏 Bundle and sign the evidence (keyless)
        run: nix shell --inputs-from . nixpkgs#cosign -c bash system/evidence-bundle.sh create artifacts bundle
      - name: 📎 Keep the bundle on GitHub
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-${{ inputs.run_id }}
          path: bundle/
          if-no-files-found: error
          # A re-run of a failed plan replaces it; a new plan asks for a new approval anyway.
          overwrite: true
      - name: 📤 Copy the bundle off GitHub (D23)
        run: bash system/evidence-bundle.sh publish bundle "${EVIDENCE_REF}"
      - name: 🔎 Verify the copy against its signature
        run: nix shell --inputs-from . nixpkgs#cosign -c bash system/evidence-bundle.sh verify "${EVIDENCE_REF}" artifacts
      - name: 📋 What the release approval covers (PL60)
        run: bash system/evidence-bundle.sh summary artifacts >> "${GITHUB_STEP_SUMMARY}"

  promote:
    name: Point stable at the run
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Release only from iso-v0 (PL54, PL60)
        run: '[[ $GITHUB_REF == refs/heads/iso-v0 ]] || { echo "::error::promote-stable.yml runs only on refs/heads/iso-v0, not $GITHUB_REF"; exit 1; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Log in to the registries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
          EVIDENCE_REGISTRY: ${{ vars.EVIDENCE_REGISTRY }}
          EVIDENCE_REGISTRY_USER: ${{ vars.EVIDENCE_REGISTRY_USER }}
          EVIDENCE_REGISTRY_TOKEN: ${{ secrets.EVIDENCE_REGISTRY_TOKEN }}
        run: bash system/promote-login.sh
      - name: 📥 Fetch the run's evidence again (system/fetch-evidence.sh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash system/fetch-evidence.sh "${RUN_ID}" artifacts
      - name: 📎 The approved plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: promotion-${{ inputs.run_id }}
          path: approved
      - name: 🔎 Verify the copy off GitHub against the approved plan
        run: |
          cp approved/promotion.json artifacts/promotion.json
          nix shell --inputs-from . nixpkgs#cosign -c bash system/evidence-bundle.sh verify "${EVIDENCE_REF}" artifacts
      - name: ⭐ Check again and promote (system/promote.sh)
        run: bash system/promote.sh ${OVERRIDE:+--hardware-override "$OVERRIDE"} "${RUN_ID}" | tee -a "${GITHUB_STEP_SUMMARY}"
