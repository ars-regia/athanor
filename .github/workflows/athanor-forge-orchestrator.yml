# Force trigger to wake up GitHub Actions
name: Athanor Forge Orchestrator

on:
  push:
    # iso-v0 as well: GitHub registers a workflow on a non-default branch only through a
    # push matching its trigger; without it workflow_dispatch answers 404 on that branch.
    branches: [main, iso-v0]
    paths:
      - "forge/**"
      # The ISO acceptance test lives under forge/ but builds nothing: it installs an
      # already published ISO. Rebuilding the whole DAG when one of its files changes
      # costs an hour and produces the same images.
      - "!forge/test/**"
      # The kernel directory belongs to Kernel Build, which dispatches this workflow when a
      # kernel is published or its modules are missing (docs/architecture/doc_build_ordering.md,
      # O1). No DAG node hashes anything under it.
      - "!forge/specs/azoth/**"
      # Workspace crates under system/ feed the DAG packages; the Containerfile,
      # scripts and disk configuration under it feed the system image.
      - "system/**"
      - "Cargo.toml"
      # Inputs of the builder image (build-builder hashes both).
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/athanor-forge-orchestrator.yml"
      - ".github/workflows/call-*.yml"
      # The module chain this workflow calls.
      - ".github/workflows/nvidia-kmod.yml"
      - ".github/workflows/nvidia-build.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: "commit whose Kernel Build dispatched this run; empty for a manual run"
        type: string
        default: ""
  schedule:
    - cron: "0 4 * * *"

env:
  # REGISTRY_HOST repository variable, default ghcr.io (as in forge-ghcr-cleanup.yml).
  REGISTRY: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
  FEDORA_VERSION: 43

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write
  # NVIDIA kmod, called below, attests its modules and reads the run list for its
  # retention: a called workflow cannot exceed the permissions of its caller.
  attestations: write
  actions: read

# A newer run waits instead of cancelling one that may be pushing or signing images; GitHub
# keeps only the newest waiting run of the group (docs/architecture/doc_build_ordering.md, O6).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/call-lint.yml

  orchestrator-brain:
    name: 🧠 DAG Orchestrator Brain
    needs: [lint]
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    # Lookups run 8 at a time and the first failure ends the run. One lookup that retry.sh
    # keeps retrying takes up to ~4 minutes of waits plus the attempts themselves (~2.5 more
    # at skopeo's own timeouts); the rest of the job is a checkout and a few seconds of hashing.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: forge
    outputs:
      dag_level_0: ${{ steps.brain.outputs.dag_level_0 }}
      dag_level_1: ${{ steps.brain.outputs.dag_level_1 }}
      dag_level_2: ${{ steps.brain.outputs.dag_level_2 }}
      dag_flatpaks: ${{ steps.brain.outputs.dag_flatpaks }}
      dirty_count: ${{ steps.brain.outputs.dirty_count }}
      has_changes: ${{ steps.brain.outputs.has_changes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute Dependency DAG & Topological Matrix
        id: brain
        env:
          REGISTRY_HOST: ${{ env.REGISTRY }}
        run: ./scripts/dynamic-matrix.sh

      - name: Hashes of this run (read by the system image build)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dag-hashes
          path: forge/dag-state/hashes.json
          if-no-files-found: error

      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi

  build-builder:
    needs: [lint]
    uses: ./.github/workflows/call-build-builder.yml

  kernel-artifacts:
    # The kernel and module artifacts of the pins and whether this run owns their cycle
    # (docs/architecture/doc_build_ordering.md, O3, O4): system/kernel-artifacts.sh decides,
    # this job only routes on its answer.
    # needs: [lint] so a red lint (which runs the system/tests suite that exercises this very
    # script) cannot still resolve, sign and publish through nvidia-kmod below: before this,
    # only the image path was gated on lint (transitively, through build-builder). Downstream
    # of a skipped kernel-artifacts, nvidia-kmod's implicit success() on its needs skips it
    # too, and kernel-artifacts-final and system-image already check .result == 'success'
    # explicitly, so nothing past this job can run with lint red.
    needs: [lint]
    runs-on: ubuntu-24.04
    # resolve makes about 11 registry/Rekor calls (skopeo/cosign, twice for the kernel plus
    # a digest/signed/predicates probe per module branch), each wrapped in retry.sh: 5
    # attempts, delay doubling from 15 s, so a call that fails every attempt sleeps
    # 15+30+60+120 = 225 s (~3.75 min) before its own error surfaces. Two or three of the 11
    # calls hitting a flaky-but-transient registry and retrying to exhaustion (2-3 x ~3.75
    # min = 7.5-11.25 min) already threatened the previous 15-minute budget; 25 minutes
    # gives that headroom. A persistent, real error still fails fast, inside the first
    # attempt of whichever call finds it, so this only changes the diagnosis of a flaky run,
    # never the outcome of a broken one (review finding 7).
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # The same knob kernel-build.yml sets, not the REGISTRY above (that one is for the
      # forge package images this workflow builds, unrelated to the kernel path): a
      # repository variable override must reach every resolve of the chain identically,
      # or this job would see kernel-missing forever (doc_build_ordering.md, O9).
      KERNEL_REGISTRY: ${{ vars.KERNEL_REGISTRY }}
    outputs:
      state: ${{ steps.artifacts.outputs.state }}
      cycle: ${{ steps.artifacts.outputs.cycle }}
      kernel_digest: ${{ steps.artifacts.outputs.kernel_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Resolve the kernel artifacts and the cycle (system/kernel-artifacts.sh)
        id: artifacts
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          bash system/kernel-artifacts.sh resolve
          bash system/kernel-artifacts.sh cycle --event "$EVENT" --before "$BEFORE" --after "$AFTER" --sha "$SHA" --head "$GITHUB_SHA"
          grep -E '^(state|cycle|kernel_digest)=' kernel-artifacts/kernel-artifacts.env >> "$GITHUB_OUTPUT"

  nvidia-kmod:
    # Only when the modules of the pins are missing; its approval comes before the image's.
    needs: [kernel-artifacts]
    if: ${{ needs.kernel-artifacts.outputs.cycle == 'build' && needs.kernel-artifacts.outputs.state == 'modules-missing' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    uses: ./.github/workflows/nvidia-kmod.yml
    with:
      kernel_digest: ${{ needs.kernel-artifacts.outputs.kernel_digest }}
    # A called workflow sees the signing environment's secrets only when the caller
    # inherits them; without it the sign job reads an empty MODULE_SIGNING_KEY.
    secrets: inherit

  kernel-artifacts-final:
    # The single source of the digests the images are built from: resolved again after
    # NVIDIA kmod and required to be ready. A job cannot run twice, hence a second job.
    needs: [kernel-artifacts, nvidia-kmod]
    if: ${{ !cancelled() && needs.kernel-artifacts.result == 'success' && needs.kernel-artifacts.outputs.cycle == 'build' && (needs.nvidia-kmod.result == 'success' || needs.nvidia-kmod.result == 'skipped') }}
    runs-on: ubuntu-24.04
    # require-ready runs the same resolve() as the kernel-artifacts job above, at the same
    # registry/Rekor cost: see the arithmetic on that job's timeout-minutes.
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # Same knob as the kernel-artifacts job above: require-ready resolves again.
      KERNEL_REGISTRY: ${{ vars.KERNEL_REGISTRY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Require ready (system/kernel-artifacts.sh)
        run: bash system/kernel-artifacts.sh require-ready
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-artifacts
          path: kernel-artifacts/kernel-artifacts.env
          if-no-files-found: error

  dag-compile:
    needs: [orchestrator-brain, build-builder]
    uses: ./.github/workflows/call-dag-compile.yml
    with:
      dag_level_0: ${{ needs.orchestrator-brain.outputs.dag_level_0 }}
      dag_level_1: ${{ needs.orchestrator-brain.outputs.dag_level_1 }}
      dag_level_2: ${{ needs.orchestrator-brain.outputs.dag_level_2 }}
      dag_flatpaks: ${{ needs.orchestrator-brain.outputs.dag_flatpaks }}
      builder_hash: ${{ needs.build-builder.outputs.content_hash }}

  system-image:
    # The images build on every run (push, dispatch, schedule), whatever the package matrix
    # holds: system/Containerfile installs from the live Fedora repositories with unpinned
    # dnf5, so the nightly rebuild is how Fedora errata reach the image. has_changes only
    # shapes the package matrix, so neither it nor the kernel state gates
    # this job.
    needs: [orchestrator-brain, dag-compile, build-builder, kernel-artifacts, kernel-artifacts-final]
    if: ${{ !cancelled() && needs.orchestrator-brain.result == 'success' && needs.kernel-artifacts-final.result == 'success' && needs.build-builder.result == 'success' && (needs.dag-compile.result == 'success' || needs.dag-compile.result == 'skipped') }}
    uses: ./.github/workflows/call-system-image.yml
    with:
      builder_content_hash: ${{ needs.build-builder.outputs.content_hash }}
    secrets: inherit
