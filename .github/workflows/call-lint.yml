name: Reusable Workflow Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: 🔎 Lint workflows (actionlint + scripts/verify.py)
    runs-on: ubuntu-24.04
    # The ISO acceptance suite drives a fake guest over a socket in real time and takes
    # about a minute on its own, which left no room under the previous five.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install actionlint 1.7.9 (checksum-verified, kept off PATH)
        run: |
          set -euo pipefail
          curl -sSL --retry 3 -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.9/actionlint_1.7.9_linux_amd64.tar.gz
          echo "233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      - name: actionlint
        run: /tmp/actionlint -no-color -shellcheck= -pyflakes=
      # Ubuntu ships no ksvalidator, so the tool comes from PyPI into a throwaway
      # virtualenv, pinned like actionlint above rather than floating on latest.
      - name: Install pykickstart 3.78 (ksvalidator)
        run: |
          set -euo pipefail
          python3 -m venv /tmp/pykickstart
          /tmp/pykickstart/bin/pip install --quiet pykickstart==3.78
          echo /tmp/pykickstart/bin >> "$GITHUB_PATH"
      - name: Structural checks (scripts/verify.py workflows, kickstart, boundary)
        run: python3 scripts/verify.py workflows kickstart boundary
      - name: Kernel profile manifest and checker (kernel_profile.py check, unit tests)
        run: |
          set -euo pipefail
          python3 -B forge/specs/athanor-kernel-profile/kernel_profile.py check
          python3 -B -m unittest discover -s forge/specs/athanor-kernel-profile/tests -v
      - name: NVIDIA lock and build gate (unit tests)
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s system/nvidia/tests -v
      - name: Build ordering scripts (unit tests against an offline registry)
        run: python3 -B -m unittest discover -s system/tests -v
      - name: Session services (unit tests)
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s forge/specs/athanor-system-services/tests -v
      - name: Greeter session script (unit tests)
        run: python3 -B -m unittest discover -s forge/specs/athanor-system-config/tests -v
      # Run directly rather than through unittest discovery: this suite holds no
      # TestCase, so `unittest discover` collects nothing from it and would report a
      # green step having run no check at all. Its own main() runs the cases in order
      # against one temporary directory and exits non-zero on the first that fails.
      # The cases that need a unix socket, or unprivileged user namespaces for the
      # kernel-argument probe, say so and skip where the runner has neither.
      - name: ISO acceptance verdict and console (unit tests)
        run: |
          set -euo pipefail
          python3 -B forge/test/iso/test_verdict.py

      - name: Repository scripts (unit tests)
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/tests -v

      - name: Calmo design tokens (unit tests, contrast gate)
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s system/athanor-style/calmo/tests -v
          python3 -B system/athanor-style/calmo/contrast.py
          python3 -B system/athanor-style/calmo/generate.py --check

      - name: Forge scripts (unit tests)
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s forge/scripts/tests -v
          python3 -B -m unittest discover -s forge/test/shell/tests -v
