# Scheduled maintenance (doc_pipeline.md section 3.1). Today it holds the daily settings
# drift check of PL52, the daily check of the evidence copies off GitHub (#401) and the
# daily check that :stable was promoted (#405); the other
# maintenance jobs move here with PB12.
name: Maintenance

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  # A deleted or altered evidence copy off GitHub (#401, ADR-0106 item 4, secrets.md SEC16): every
  # promotion that ran in the environment release must keep its copy in EVIDENCE_REGISTRY, and the
  # copy must verify against the plan on its GitHub Release. The job holds no environment, no
  # write permission and no secret: the registry is read anonymously and the token only reads.
  evidence-copies:
    name: Evidence copies are intact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Pinned tools (scripts/ci/install-tools.sh)
        run: |
          set -euo pipefail
          bash scripts/ci/install-tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Verify the copy of every promotion off GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_REGISTRY: ${{ vars.EVIDENCE_REGISTRY }}
        run: python3 system/check_evidence_copies.py

  settings-drift:
    name: Settings drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # A token of the settings App, for this repository only (PL5, PL52). It inherits the
      # App's permissions, which are read-only; the action cannot request the Variables
      # permission by name, so narrowing the token here would drop it.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SETTINGS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SETTINGS_APP_PRIVATE_KEY }}

      - name: Compare .github/settings with the live repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/github-settings/ghsettings.py --repo "${GITHUB_REPOSITORY}" diff

  # A :stable that no promotion moved (#405, PL54, ADR-0111 item 5): :stable must be the digest of
  # the newest promotion record that ran in the environment release, :stable-previous that record's
  # previous_stable, and every :stable-<day> the last record of its day (doc_ci.md CI29).
  # The job holds no environment, no package write and no secret: it reads.
  stable-promotions:
    name: Stable was promoted
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Pinned tools (scripts/ci/install-tools.sh)
        run: |
          set -euo pipefail
          bash scripts/ci/install-tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Compare :stable with the promotion records
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
          EVIDENCE_REGISTRY: ${{ vars.EVIDENCE_REGISTRY }}
        run: python3 scripts/ci/stable_promotions.py
