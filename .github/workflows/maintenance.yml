# Scheduled maintenance (doc_pipeline.md section 3.1). Today it holds the daily settings
# drift check of PL52, the daily check of the evidence copies off GitHub (#401), the
# daily check that :stable was promoted (#405) and the daily rescan of the Rust advisories
# and, on Mondays, the weekly CodeQL scan of Rust, Python and the workflows (PL28, PB8) and the
# weekly cargo-mutants run (PL28, scripts/ci/mutants.sh); the other
# maintenance jobs move here with PB12. The Monday cron fires a run of its own, in which only
# CodeQL and the mutants run; the daily jobs skip it. A failed or cancelled scheduled job opens
# or updates its ci-alert issue (PL51).
name: Maintenance

on:
  schedule:
    - cron: "23 5 * * *"
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  # A deleted or altered evidence copy off GitHub (#401, ADR-0106 item 4, secrets.md SEC16): every
  # promotion that ran in the environment release must keep its copy in EVIDENCE_REGISTRY, and the
  # copy must verify against the plan on its GitHub Release. The job holds no environment, no
  # write permission and no secret: the registry is read anonymously and the token only reads.
  evidence-copies:
    if: ${{ github.event.schedule != '23 6 * * 1' }}
    name: Evidence copies are intact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Pinned tools (scripts/ci/install-tools.sh)
        run: |
          set -euo pipefail
          bash scripts/ci/install-tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Verify the copy of every promotion off GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_REGISTRY: ${{ vars.EVIDENCE_REGISTRY }}
        run: python3 system/check_evidence_copies.py

  settings-drift:
    if: ${{ github.event.schedule != '23 6 * * 1' }}
    name: Settings drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # A token of the settings App, for this repository only (PL5, PL52). It inherits the
      # App's permissions, which are read-only; the action cannot request the Variables
      # permission by name, so narrowing the token here would drop it.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SETTINGS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SETTINGS_APP_PRIVATE_KEY }}

      - name: Compare .github/settings with the live repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/github-settings/ghsettings.py --repo "${GITHUB_REPOSITORY}" diff

  # A :stable that no promotion moved (#405, PL54, ADR-0111 item 5): :stable must be the digest of
  # the newest promotion record that ran in the environment release, :stable-previous that record's
  # previous_stable, and every :stable-<day> the last record of its day (doc_ci.md CI29).
  # The job holds no environment, no package write and no secret: it reads.
  stable-promotions:
    if: ${{ github.event.schedule != '23 6 * * 1' }}
    name: Stable was promoted
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Pinned tools (scripts/ci/install-tools.sh)
        run: |
          set -euo pipefail
          bash scripts/ci/install-tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Compare :stable with the promotion records
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
          EVIDENCE_REGISTRY: ${{ vars.EVIDENCE_REGISTRY }}
        run: python3 scripts/ci/stable_promotions.py

  # The advisory database changes without a commit: an advisory or a yanked crate published
  # against a lockfile nobody touched turns every Rust pull request red at once. The daily run
  # finds it before they do; on 2026-11-09 a weekly run failed and no one was told.
  rust-advisories:
    if: ${{ github.event.schedule != '23 6 * * 1' }}
    permissions:
      contents: read
    uses: ./.github/workflows/rust-security-audit.yml

  # CodeQL over the three languages the repository ships (PL28, PB8). No build: Rust, Python and the
  # workflows are analysed from source (build-mode none). The repository is public, so the job needs
  # no `actions: read`. Results go to the code scanning alerts, not to a log.
  codeql:
    if: ${{ github.event.schedule == '23 6 * * 1' || github.event_name == 'workflow_dispatch' }}
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  # Mutation testing (PL28): cargo-mutants changes the code of one crate at a time and reports the
  # mutants no test catches. It runs in the build stage of the shell rig, like check-rust, and takes
  # hours, so it is not part of `just check`; athanor-sal is split into shards that run side by side.
  # scripts/ci/mutants.sh treats cargo-mutants' exit statuses 2 (missed) and 3 (timeouts) as a
  # finished run: the report is the result, and the job fails only when the run itself failed.
  mutants:
    if: ${{ github.event.schedule == '23 6 * * 1' || github.event_name == 'workflow_dispatch' }}
    name: Mutants (${{ matrix.crate }} ${{ matrix.shard || '0/1' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        crate:
          - athanor-auth
          - athanor-bus-api
          - athanor-edid
          - athanor-i18n
          - athanor-idle
          - athanor-layout
          - athanor-portal
          - athanor-services
          - athanor-sessiond
          - athanor-trust-state
          - athanor-unit
        include:
          - { crate: athanor-sal, shard: "0/8" }
          - { crate: athanor-sal, shard: "1/8" }
          - { crate: athanor-sal, shard: "2/8" }
          - { crate: athanor-sal, shard: "3/8" }
          - { crate: athanor-sal, shard: "4/8" }
          - { crate: athanor-sal, shard: "5/8" }
          - { crate: athanor-sal, shard: "6/8" }
          - { crate: athanor-sal, shard: "7/8" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Pinned tools (scripts/ci/install-tools.sh)
        env:
          ATHANOR_INSTALL_MUTANTS: "1"
        run: |
          set -euo pipefail
          bash scripts/ci/install-tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Mutate the crate
        env:
          MUTANTS_CRATE: ${{ matrix.crate }}
          MUTANTS_IN_RIG: "1"
          MUTANTS_OUT: ${{ runner.temp }}/mutants
          MUTANTS_EXTRA: --shard ${{ matrix.shard || '0/1' }}
        run: bash scripts/ci/mutants.sh "$MUTANTS_CRATE"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutants-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/mutants/summary.txt
            ${{ runner.temp }}/mutants/mutants.out/*.txt
            ${{ runner.temp }}/mutants/mutants.out/outcomes.json
          if-no-files-found: ignore
          retention-days: 30

  alert:
    # PL51: a failed or cancelled scheduled job opens or updates its ci-alert issue, and a
    # success closes it. A job of its own on a GitHub runner, after the others whatever their
    # result.
    needs: [evidence-copies, settings-drift, stable-promotions, rust-advisories, codeql]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/alert
        with:
          needs: ${{ toJSON(needs) }}

  # The same alert for the mutants jobs, in a job of its own: they run for hours, and the alert above
  # must not wait for them. ci_alert.py keys each issue by workflow and job name, so the two jobs
  # never open or close each other's issues.
  alert-mutants:
    needs: [mutants]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/alert
        with:
          needs: ${{ toJSON(needs) }}
