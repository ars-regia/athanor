# Weekly fuzzing of the parsers that read untrusted input (doc_ci.md CI30). The targets are
# in fuzz/, their entry points in system/athanor-fuzz-entries, whose test replays the
# committed corpus in every pull request. A crash here is a finding: the artifact holds the
# input, which belongs in fuzz/corpus/<target>/ together with the fix.
name: Fuzz

on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        required: false
        default: "240"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz targets
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run every target
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '240' }}
          FUZZ_OUT: ${{ runner.temp }}/fuzz
        run: bash scripts/ci/fuzz.sh

      - name: Keep the crashing inputs and the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuzz
          path: |
            ${{ runner.temp }}/fuzz/artifacts
            ${{ runner.temp }}/fuzz/logs
          if-no-files-found: ignore
