name: Athanor Nix Vanguard (Phase 3)

on:
  push:
    branches: ["main", "iso-v0"]
  pull_request:
    branches: ["main", "iso-v0"]

jobs:
  nix-build:
    name: Zero-Trust Hermetic Build
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Validate Hermetic Environment (devShell)
        run: nix develop --command echo "✅ DevShell pura inizializzata con successo."

      - name: Compile Proof-of-Concept (just-hermetic)
        run: nix build .#just-hermetic
        
      - name: Verify Binary Determinism
        run: |
          echo "Binary built successfully at:"
          ls -la result/bin/just
          file result/bin/just



