name: Rust Security & FFI Audit

# pr.yml calls this workflow as its `rust_audit` job when scripts/ci/changes.py selects it
# (Rust sources, Cargo files, deny.toml, the builder); its verdict reaches the required `gate`.
on:
  workflow_call:
  # A merge into iso-v0 that touches the same paths: two pull requests green on their own can
  # merge into a red iso-v0. The filter repeats the rust_audit area of scripts/ci/changes.py
  # (scripts/ci/tests/test_pr_workflow.py).
  push:
    branches: [iso-v0]
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/rust-toolchain"
      - "**/rust-toolchain.toml"
      - "**/clippy.toml"
      - "**/.clippy.toml"
      - ".cargo/**"
      - "deny.toml"
      - "forge/builder/**"
      - "flake.nix"
      - "flake.lock"
      - "forge/scripts/retry.sh"
      - "scripts/ci/security-audit.sh"
      - "scripts/ci/audited-lockfiles.txt"
      - ".github/workflows/rust-security-audit.yml"
  # The advisory database changes without a commit: maintenance.yml calls this workflow every
  # day, and its alert job opens a ci-alert issue when the run fails (PL51).

# Called from pr.yml the group is the caller's "Pull Request-<ref>", apart from "pr-<number>".
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-audit:
    name: Clippy and dependency policy
    # The builder runs under podman, not as the job container: the JavaScript actions
    # (checkout, cache, upload) need the runner's libstdc++, which the Nix image lacks.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REGISTRY: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}/${{ github.repository_owner }}
      BUILDER_TAG: ${{ vars.BUILDER_STABLE_TAG || 'latest' }}
      CARGO_NET_RETRY: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-security-audit
          # Saved by a push to iso-v0 alone: every pull request, queue and daily run reads the
          # default branch's entry, and the entries of their own refs filled the 10 GB (#1177).
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/iso-v0' }}

      - name: Install Nix (the flake's cosign verifies the builder)
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      - name: Run the audit in the builder image
        env:
          # Reads the rules of a rebase/* base branch, whose signatures system/tier-digests.sh
          # trusts only when a ruleset protects it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The digest BUILDER_TAG names, run only when a trusted run of call-build-builder.yml
          # signed it (#1205), and pulled and run by that digest, never by the tag.
          image=$(nix shell --inputs-from . nixpkgs#cosign -c \
            bash forge/scripts/resolve_builder_image.sh "${REGISTRY,,}" "$BUILDER_TAG")
          # Only the download caches: the runner's ~/.cargo/bin holds rustup proxies that
          # cargo would run instead of the builder's own clippy.
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"
          bash forge/scripts/retry.sh podman pull "$image"
          podman run --rm --security-opt label=disable -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -v "$HOME/.cargo/registry:/cargo/registry" -v "$HOME/.cargo/git:/cargo/git" \
            -e CARGO_HOME=/cargo -e CARGO_NET_RETRY "$image" \
            bash scripts/ci/security-audit.sh

      - name: Upload the audit logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-audit-logs
          path: audit-out
          if-no-files-found: error
