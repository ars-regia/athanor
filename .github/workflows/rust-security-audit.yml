name: Rust Security & FFI Audit

on:
  push:
    branches: [iso-v0]
  pull_request:
    branches: [iso-v0]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-audit:
    name: Clippy and dependency policy
    runs-on: ubuntu-24.04
    container:
      image: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}/${{ github.repository_owner }}/athanor-builder:${{ vars.BUILDER_STABLE_TAG || 'latest' }}
    timeout-minutes: 30
    env:
      CARGO_NET_RETRY: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: rust-security-audit

      - name: Run the audit
        env:
          AUDIT_OUT: ${{ github.workspace }}/audit-out
        run: scripts/ci/security-audit.sh

      - name: Upload the audit logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-audit-logs
          path: audit-out
          if-no-files-found: error
