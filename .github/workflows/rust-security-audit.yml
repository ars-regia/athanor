name: Rust Security & FFI Audit

# pr.yml calls this workflow as its `rust_audit` job when scripts/ci/changes.py selects it
# (Rust sources, Cargo files, deny.toml, the builder); its verdict reaches the required `gate`.
on:
  workflow_call:
  # A merge into iso-v0 that touches the same paths: two pull requests green on their own can
  # merge into a red iso-v0. The filter repeats the rust_audit area of scripts/ci/changes.py
  # (scripts/ci/tests/test_pr_workflow.py).
  push:
    branches: [iso-v0]
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/rust-toolchain"
      - "**/rust-toolchain.toml"
      - "**/clippy.toml"
      - "**/.clippy.toml"
      - ".cargo/**"
      - "deny.toml"
      - "forge/builder/**"
      - "flake.nix"
      - "flake.lock"
      - "forge/scripts/retry.sh"
      - "scripts/ci/security-audit.sh"
      - ".github/workflows/rust-security-audit.yml"
  # The advisory database changes without a commit: maintenance.yml calls this workflow every
  # day, and its alert job opens a ci-alert issue when the run fails (PL51).

# Called from pr.yml the group is the caller's "Pull Request-<ref>", apart from "pr-<number>".
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-audit:
    name: Clippy and dependency policy
    # The builder runs under podman, not as the job container: the JavaScript actions
    # (checkout, cache, upload) need the runner's libstdc++, which the Nix image lacks.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILDER_IMAGE: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}/${{ github.repository_owner }}/athanor-builder:${{ vars.BUILDER_STABLE_TAG || 'latest' }}
      CARGO_NET_RETRY: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-security-audit

      - name: Run the audit in the builder image
        run: |
          # Only the download caches: the runner's ~/.cargo/bin holds rustup proxies that
          # cargo would run instead of the builder's own clippy.
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"
          bash forge/scripts/retry.sh podman pull "${BUILDER_IMAGE,,}"
          podman run --rm --security-opt label=disable -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -v "$HOME/.cargo/registry:/cargo/registry" -v "$HOME/.cargo/git:/cargo/git" \
            -e CARGO_HOME=/cargo -e CARGO_NET_RETRY "${BUILDER_IMAGE,,}" \
            bash scripts/ci/security-audit.sh

      - name: Upload the audit logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-audit-logs
          path: audit-out
          if-no-files-found: error
