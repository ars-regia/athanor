name: Call System Image (Reusable Workflow)

on:
  workflow_call:
    inputs:
      builder_content_hash:
        description: "Content hash of the builder container image"
        required: true
        type: string
    secrets:
      RPM_GPG_KEY:
        description: "Armored secret key that signs the tier repositories, in the sign-repo job only; supplied by the signing environment"
        required: false
      RPM_GPG_PASSPHRASE:
        description: "Passphrase of RPM_GPG_KEY, if it has one; supplied by the signing environment"
        required: false
      SECUREBOOT_SIGNING_KEY:
        description: "Secure Boot private key (PEM) that signs the vmlinuz GRUB boots through shim, in the sign-kernel job only; supplied by the signing environment"
        required: false
      COSIGN_PRIVATE_KEY:
        description: "Private key that signs the system images for the update service (system/keys); supplied by the signing environment"
        required: false
      COSIGN_PASSWORD:
        description: "Passphrase of COSIGN_PRIVATE_KEY; supplied by the signing environment"
        required: false

jobs:
  lint:
    uses: ./.github/workflows/call-lint.yml

  build-repo:
    name: 📦 Aggregate the tier repositories (unsigned)
    # The package side of the channel: it pulls the per-package images into forge/repo-cache
    # and hands the tree, unsigned, to sign-repo. No signing key reaches this job (D43,
    # decision A2-33).
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Kernel artifacts verified by the Orchestrator
        # fetch_repo_rpms.sh pulls azoth by the digest in this file (doc_build_ordering.md, O4).
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kernel-artifacts
          path: kernel-artifacts
      - name: ❄️ Install Nix (Bedrock Cache)
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: 🔑 Login to the registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: 📦 Aggregate the tier repositories (forge/scripts/tier_repos.sh fetch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILDER_CONTENT_HASH: ${{ inputs.builder_content_hash }}
        run: bash forge/scripts/tier_repos.sh fetch
      - name: 📎 Hand the unsigned repositories to the signing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tier-repositories
          path: forge/repo-cache/
          if-no-files-found: error
          retention-days: 1
      - name: 🧹 Cleanup Workspace Permissions
        if: always()
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          podman run -i --rm --security-opt label=disable --security-opt seccomp=unconfined -v "${GITHUB_WORKSPACE}:/workspace:rw" -w /workspace docker.io/library/ubuntu:latest rm -rf /workspace/var-tmp || true
          sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" || podman unshare chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" || true

      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi

  sign-repo:
    name: 🔏 Sign and publish the tier repositories
    # The only job that receives RPM_GPG_KEY (D43, decision A2-33). It runs no package code:
    # it takes the tree build-repo aggregated, forge/scripts/tier_repos.sh signs every RPM and
    # each repodata/repomd.xml in the builder image with the network off, then publishes the
    # tier images and, from main, the GitHub Pages channel. Same branch guard as sign-kernel:
    # the signing environment deploys only from the branches that publish.
    if: github.ref == 'refs/heads/iso-v0' || github.ref == 'refs/heads/main'
    needs: [build-repo]
    runs-on: ubuntu-24.04
    environment: signing
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 📎 Unsigned repositories from build-repo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tier-repositories
          path: forge/repo-cache
      - name: 🔑 Login to the registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: 🌐 Copy the tier repositories for GitHub Pages
        # A release step: the channel is published from main only. kernel-build.yml moves
        # its :latest tags from the default branch instead (re-audit decision 11).
        if: github.ref == 'refs/heads/main'
        run: bash forge/scripts/tier_repos.sh pages-tree
      - name: 🔏 Sign the packages and the repository metadata (forge/scripts/tier_repos.sh sign)
        env:
          BUILDER_CONTENT_HASH: ${{ inputs.builder_content_hash }}
          RPM_GPG_KEY: ${{ secrets.RPM_GPG_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: bash forge/scripts/tier_repos.sh sign
      - name: 📦 Publish the tier repository images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILDER_CONTENT_HASH: ${{ inputs.builder_content_hash }}
        run: bash forge/scripts/tier_repos.sh publish
      - name: 🌐 Deploy the DNF channel to GitHub Pages
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILDER_CONTENT_HASH: ${{ inputs.builder_content_hash }}
        run: bash forge/scripts/tier_repos.sh deploy-pages

  sign-kernel:
    name: 🔏 Secure Boot signature of the kernel
    # The only job that receives SECUREBOOT_SIGNING_KEY (D43). It builds nothing and runs
    # no third-party action beside the key: checkout, cosign from its pinned release, registry
    # login and system/sign-kernel.sh. The job takes no kernel from the artifacts of the run,
    # which another job could have written: sign-kernel.sh resolves azoth itself, in the
    # registry of vars.KERNEL_REGISTRY (empty: ghcr.io/<owner>), and accepts only a digest that
    # cosign verifies as signed by kernel-build.yml on a trusted branch and attested as built
    # from this checkout. It signs that vmlinuz in the locked forge/specs/azoth/sign image with
    # the network off and verifies it against the committed certificate. The image build
    # receives only the result.
    #
    # The Orchestrator can be dispatched from any branch, so the project key is used only on
    # the branches that publish (the default kernel-artifacts.sh KERNEL_TRUSTED_REFS): from any
    # other ref this job, and with it the image build and sign-system-images, is skipped. The
    # condition is not the whole guard: the signing environment must also carry deployment
    # branch rules for these branches and required reviewers, a repository setting the
    # maintainer owns.
    if: github.ref == 'refs/heads/iso-v0' || github.ref == 'refs/heads/main'
    needs: [lint]
    runs-on: ubuntu-24.04
    environment: signing
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cosign (pinned release, checksum-verified)
        run: |
          set -euo pipefail
          bash forge/scripts/install-cosign.sh "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP/cosign" >> "$GITHUB_PATH"
      - name: 🔑 Login to the registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          KERNEL_REGISTRY: ${{ vars.KERNEL_REGISTRY }}
        run: |
          set -euo pipefail
          registry=$(bash system/kernel-artifacts.sh registry)
          echo "${GITHUB_TOKEN}" | podman login "${registry%%/*}" -u "${GITHUB_ACTOR}" --password-stdin
      - name: 🔏 Sign the kernel, then verify it against the certificate (system/sign-kernel.sh)
        env:
          # The locked sign image builds as the NVIDIA sign job builds its own (nvidia-kmod.yml).
          BUILDAH_ISOLATION: chroot
          KERNEL_REGISTRY: ${{ vars.KERNEL_REGISTRY }}
          SECUREBOOT_SIGNING_KEY: ${{ secrets.SECUREBOOT_SIGNING_KEY }}
        run: bash system/sign-kernel.sh --out signed-kernel
      - name: 📎 Hand the signed kernel to the image build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-kernel
          path: signed-kernel/
          if-no-files-found: error

  dag-system-image:
    name: 💿 System Image & Disk Build
    # No signing key reaches this job (D43): the kernel arrives signed from sign-kernel, and
    # the image build checks it against the committed certificate.
    needs: [sign-repo, sign-kernel]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: ⚙️ Prepare environment
        run: |
          set -euo pipefail
          echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_ENV}"
          echo "DEFAULT_TAG=latest" >> "${GITHUB_ENV}"
      - name: 📥 Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Kernel artifacts verified by the Orchestrator
        # build-image.sh builds from the kernel and module digests in this file (O4).
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kernel-artifacts
          path: kernel-artifacts
      - name: Kernel signed by the sign-kernel job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: signed-kernel
          path: signed-kernel
      - name: ❄️ Install Nix (Bedrock Cache & Security Tools)
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: 🧹 Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
      - name: 🔑 Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: 🐳 Build OS Images
        # The Containerfile pulls its base and the tier repository images and installs
        # Fedora packages with dnf5, so the build needs the network; the build context
        # is the repository root, where its COPY sources live. build-image.sh builds the
        # default, NVIDIA and NVIDIA-legacy images in turn, all three from the same signed
        # kernel. Nothing is pushed until all three have built.
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          for gpu in none nvidia nvidia-legacy; do
            bash system/build-image.sh --gpu "$gpu" --signed-kernel signed-kernel --registry "${IMAGE_REGISTRY}" --tag "${RUN_ID}" --tag "${DEFAULT_TAG}" --serial "${RUN_NUMBER}"
          done
          df -h

      - name: 📤 Push OS Images
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for gpu in none nvidia nvidia-legacy; do
            bash system/build-image.sh --gpu "$gpu" --registry "${IMAGE_REGISTRY}" --tag "${RUN_ID}" --tag "${DEFAULT_TAG}" --push-only
          done

      - name: 🧾 Record the pushed digests for the signing job
        env:
          RUN_ID: ${{ github.run_id }}
        run: bash system/image-digests.sh --registry "${IMAGE_REGISTRY}" --tag "${RUN_ID}" --out artifacts/image-digests.txt

      - name: 📎 Hand the digests to the signing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digests
          path: artifacts/image-digests.txt
          if-no-files-found: error

      - name: 🔐 Sign & Attest OS Image (Zero-Trust Keyless Sigstore)
        # One signature and one SBOM attestation per image digest: the :latest tag
        # resolves to the same digest as :<run_id>, so cosign verify accepts both.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          nix run nixpkgs#cosign -- login ghcr.io -u "${GITHUB_ACTOR}" -p "${GITHUB_TOKEN}"
          for name in athanor-system athanor-system-nvidia athanor-system-nvidia-legacy; do
            image="${IMAGE_REGISTRY}/${name}:${RUN_ID}"
            # The SBOM comes from the mounted root filesystem of the local image, not from
            # syft's image source: with about 120 layers and 270k files that source needs
            # more than 20 GiB and took the runner down (sbom_rootfs.sh).
            nix shell nixpkgs#syft -c bash forge/scripts/sbom_rootfs.sh "${image}" "${name}-sbom.spdx.json"
            nix shell nixpkgs#cosign -c bash forge/scripts/sign_attest.sh "${image}" "${name}-sbom.spdx.json"
          done

      - name: 🧹 Free the NVIDIA images before the ISO
        # The ISO embeds only the default image; the two variants are published and signed.
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for name in athanor-system-nvidia athanor-system-nvidia-legacy; do
            podman rmi "${IMAGE_REGISTRY}/${name}:${RUN_ID}" "${IMAGE_REGISTRY}/${name}:${DEFAULT_TAG}"
          done
          df -h

      - name: 💿 Build ISO (osbuild)
        # Not osbuild/bootc-image-builder-action: the builder needs our own installer
        # package list mounted over its definitions (build_iso.sh explains why) and the
        # action passes no volumes of its own.
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          bash forge/scripts/build_iso.sh "${IMAGE_REGISTRY}/athanor-system:${RUN_ID}" ./output
          ls -laR ./output

      - name: 📀 Publish the ISO
        # As an OCI image, the way kernel-build.yml publishes the kernel artifacts: the
        # ISO carries the whole system image and is far past the 2 GB an Actions
        # artifact takes. :latest only from main, again as the kernel does.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          iso=$(find ./output -name '*.iso' -type f | head -n 1)
          [[ -n $iso ]] || { echo "the ISO build produced no .iso under ./output" >&2; exit 1; }
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          image="${IMAGE_REGISTRY}/athanor-iso"
          # podman, not buildah: this job builds and pushes the system image with it, so
          # it is certainly on the runner. A Containerfile on stdin keeps the context to
          # the ISO alone.
          podman build --format docker -t "${image}:${RUN_ID}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -f - "$(dirname "$iso")" <<CONTAINERFILE
          FROM scratch
          LABEL org.opencontainers.image.title="Athanor installer ISO"
          LABEL org.opencontainers.image.version="${RUN_ID}"
          COPY $(basename "$iso") /athanor-${RUN_ID}.iso
          CONTAINERFILE
          bash forge/scripts/retry.sh podman push "${image}:${RUN_ID}"
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            podman tag "${image}:${RUN_ID}" "${image}:latest"
            bash forge/scripts/retry.sh podman push "${image}:latest"
          fi
          {
            echo "### Installer ISO"
            echo
            echo "\`${image}:${RUN_ID}\`, $(du -h "$iso" | cut -f1)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi

  sign-system-images:
    name: 🔏 Key-based signature of the system images
    # The only job that receives COSIGN_*. It builds nothing and runs no third-party tool
    # beside the key: checkout, registry login, system/sign-images.sh (doc_update_trust.md UT2).
    needs: [dag-system-image]
    runs-on: ubuntu-24.04
    environment: signing
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 📎 Digests recorded by the build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: image-digests
          path: artifacts
      - name: 🔑 Login to the registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: echo "${GITHUB_TOKEN}" | skopeo login "$(cut -d/ -f1 artifacts/image-digests.txt | head -n 1)" -u "${GITHUB_ACTOR}" --password-stdin
      - name: 🔏 Sign, then verify as a machine will (system/sign-images.sh)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: bash system/sign-images.sh artifacts/image-digests.txt | tee -a "${GITHUB_STEP_SUMMARY}"
