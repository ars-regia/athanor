name: Call System Image (Reusable Workflow)

on:
  workflow_call:
    inputs:
      builder_content_hash:
        description: "Content hash of the builder container image"
        required: true
        type: string

# The key-based signature of the images is not here: a called workflow's job reads the secrets
# of its environment only when its caller inherits every secret (actions/runner#4453), so it is
# sign-system-images of athanor-forge-orchestrator.yml, after this workflow (D43).

jobs:
  # No lint job of its own: the Orchestrator, its only caller, runs call-lint.yml once and
  # calls this workflow only after it passed (docs/architecture/doc_pipeline.md, PL44).
  build-repo:
    # The tier repositories are consumed as OCI images only (ADR-0076, decision 2).
    name: 📦 Aggregate the tier repositories
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Kernel artifacts verified by the Orchestrator
        # fetch_repo_rpms.sh pulls azoth by the digest in this file (doc_build_ordering.md, O4).
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kernel-artifacts
          path: kernel-artifacts
      - name: Package hashes verified by the Orchestrator
        # fetch_repo_rpms.sh pulls every package image by its hash tag from this file.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dag-hashes
          path: forge/dag-state
      - name: ❄️ Install Nix (Bedrock Cache)
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: 📦 Aggregate the tier repositories and publish their images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          BUILDER_CONTENT_HASH: ${{ inputs.builder_content_hash }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          podman run -i --rm  --security-opt label=disable --security-opt seccomp=unconfined --privileged \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace/forge \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e GITHUB_ACTOR="${GITHUB_ACTOR}" \
            -e GITHUB_REPOSITORY_OWNER="${GITHUB_REPOSITORY_OWNER}" \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/athanor-builder:${BUILDER_CONTENT_HASH}" \
            bash <<'EOF'
            set -e
            export BUILDAH_ISOLATION=chroot
            export XDG_DATA_HOME=/var/tmp
            export XDG_CONFIG_HOME=/var/tmp
            export XDG_CACHE_HOME=/var/tmp
            export _CONTAINERS_USERNS_CONFIGURED=done

            # Container storage on the workspace mount, i.e. the runner's disk, addressed
            # by path: no bind mount, which the builder could not perform anyway.
            mkdir -p /workspace/var-tmp/containers
            {
              echo '[storage]'
              echo 'driver = "vfs"'
              echo 'runroot = "/workspace/var-tmp/containers/runroot"'
              echo 'graphroot = "/workspace/var-tmp/containers/storage"'
              echo '[storage.options.vfs]'
              echo 'ignore_chown_errors = "true"'
            } > /var/tmp/storage.conf
            export CONTAINERS_STORAGE_CONF=/var/tmp/storage.conf

            echo "${GITHUB_TOKEN}" | buildah login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            bash scripts/fetch_repo_rpms.sh "${GITHUB_REPOSITORY_OWNER}"

            # publish_tier TIER: one of tier0..tier3, or "" for the rolling aggregate. The
            # image is pushed only when the RPM content differs from the published one.
            publish_tier() {
              local tier=$1 dir img_name image new_hash old_hash ctr
              if [ -n "$tier" ]; then
                dir="repo-cache/repo-${tier}"
                img_name="athanor-forge-${tier}-repo:latest"
              else
                dir="repo-cache/repo"
                img_name="athanor-forge-rolling-repo:latest"
              fi
              image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${img_name}"
              new_hash=$(find "$dir" -name '*.rpm' -type f | sort | xargs -r sha256sum | sha256sum | awk '{print $1}')
              old_hash=$(skopeo inspect --config "docker://$image" 2>/dev/null | jq -r '.config.Labels["tier.content.sha256"] // ""')
              if [ -n "$old_hash" ] && [ "$new_hash" = "$old_hash" ]; then
                echo "Tier '${tier:-rolling}' ($img_name): RPM content unchanged, not pushed"
                return 0
              fi
              (
                cd "$dir"
                createrepo_c .
                ctr=$(buildah from scratch)
                buildah copy "$ctr" . /
                buildah config --label tier.content.sha256="$new_hash" "$ctr"
                buildah commit --omit-timestamp "$ctr" "$image"
                buildah push "$image"
                buildah rm "$ctr"
                buildah rmi "$image"
              )
            }
            pids=()
            for tier in tier0 tier1 tier2 tier3 ""; do
              publish_tier "$tier" &
              pids+=($!)
            done
            for pid in "${pids[@]}"; do wait "$pid"; done
          EOF

      - name: 🧹 Cleanup Workspace Permissions
        if: always()
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          podman run -i --rm --security-opt label=disable --security-opt seccomp=unconfined -v "${GITHUB_WORKSPACE}:/workspace:rw" -w /workspace docker.io/library/ubuntu:latest rm -rf /workspace/var-tmp || true
          sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" || podman unshare chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" || true

      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi

  dag-system-image:
    name: 💿 System Image & Disk Build
    needs: [build-repo]
    runs-on: ubuntu-24.04
    # No key and no environment (D43): the vmlinuz arrives signed for Secure Boot, by the
    # azoth-boot digest in the kernel artifacts, and the images are signed with the update key
    # by sign-system-images of the Orchestrator, from the digests this job records.
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: ⚙️ Prepare environment
        run: |
          set -euo pipefail
          echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_ENV}"
      - name: 📥 Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Kernel artifacts verified by the Orchestrator
        # build-image.sh builds from the kernel and module digests in this file (O4).
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kernel-artifacts
          path: kernel-artifacts
      - name: ❄️ Install Nix (Bedrock Cache & Security Tools)
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: 🧹 Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
      - name: 🔑 Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: 🧱 Build the system stage
        # The Containerfile pulls its base and the tier repository images and installs
        # Fedora packages with dnf5, so the build needs the network; the build context
        # is the repository root, where its COPY sources live. The system stage the three
        # images share is built once per run, and its image ID is the base of all three
        # (doc_update_delivery.md, UD40). The rechunk of UD32 is a step of its own after
        # this one, writing the ID of the rechunked image to the same file.
        env:
          ATHANOR_BRIDGE_REGISTRY: ${{ vars.ATHANOR_BRIDGE_REGISTRY }}
        run: bash system/build-image.sh --system --registry "${IMAGE_REGISTRY}" --iidfile artifacts/system-image.iid

      - name: 🔖 Check our RPMs against their specs
        # The tier repositories were rebuilt from this checkout earlier in this run; a stale
        # per-package image once shipped athanor-recovery 1.0.0-5 while its spec said 6.
        run: bash system/check-image-rpms.sh "$(<artifacts/system-image.iid)"

      - name: 🐳 Build OS Images
        # build-image.sh builds the default, NVIDIA and NVIDIA-legacy images in turn FROM the
        # system image, all three with the same signed vmlinuz (S8). Nothing is pushed until
        # all three have built.
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          for gpu in none nvidia nvidia-legacy; do
            bash system/build-image.sh --gpu "$gpu" --system-image "$(<artifacts/system-image.iid)" --registry "${IMAGE_REGISTRY}" \
              --tag "${RUN_ID}" --serial "${RUN_NUMBER}"
          done
          df -h

      - name: 🧩 Check that the images share the system layers
        # The acceptance of UD40: each image starts with every layer of the system image.
        # Read from local storage before the push, so a failure publishes no tag.
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          bash system/shared-layers.sh --system "$(<artifacts/system-image.iid)" --registry "${IMAGE_REGISTRY}" --tag "${RUN_ID}" \
            | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: 📤 Push OS Images
        # By run id only: :latest moves in tag-system-images of the Orchestrator, after the
        # key-based signature of these digests verified (doc_update_delivery.md, UD24, UD25).
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for gpu in none nvidia nvidia-legacy; do
            bash system/build-image.sh --gpu "$gpu" --registry "${IMAGE_REGISTRY}" --tag "${RUN_ID}" --push-only
          done

      - name: 🧾 Record the pushed digests for the signing job
        env:
          RUN_ID: ${{ github.run_id }}
        run: bash system/image-digests.sh --registry "${IMAGE_REGISTRY}" --tag "${RUN_ID}" --out artifacts/image-digests.txt

      - name: 📎 Hand the digests to the signing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digests
          path: artifacts/image-digests.txt
          if-no-files-found: error

      - name: 🔐 Sign & Attest OS Image (Zero-Trust Keyless Sigstore)
        # One signature and one SBOM attestation per image digest: the :latest tag, moved
        # later to the same digest as :<run_id>, carries them, so cosign verify accepts both.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          nix run nixpkgs#cosign -- login ghcr.io -u "${GITHUB_ACTOR}" -p "${GITHUB_TOKEN}"
          for name in athanor-system athanor-system-nvidia athanor-system-nvidia-legacy; do
            image="${IMAGE_REGISTRY}/${name}:${RUN_ID}"
            # The SBOM comes from the mounted root filesystem of the local image, not from
            # syft's image source: with about 120 layers and 270k files that source needs
            # more than 20 GiB and took the runner down (sbom_rootfs.sh).
            nix shell nixpkgs#syft -c bash forge/scripts/sbom_rootfs.sh "${image}" "${name}-sbom.spdx.json"
            nix shell nixpkgs#cosign -c bash forge/scripts/sign_attest.sh "${image}" "${name}-sbom.spdx.json"
          done

      - name: 🧹 Free the NVIDIA images before the ISO
        # The ISO embeds only the default image; the two variants are published and signed.
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for name in athanor-system-nvidia athanor-system-nvidia-legacy; do
            podman rmi "${IMAGE_REGISTRY}/${name}:${RUN_ID}"
          done
          df -h

      - name: 💿 Build ISO (osbuild)
        # Not osbuild/bootc-image-builder-action: the builder needs our own installer
        # package list mounted over its definitions (build_iso.sh explains why) and the
        # action passes no volumes of its own.
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          bash forge/scripts/build_iso.sh "${IMAGE_REGISTRY}/athanor-system:${RUN_ID}" ./output
          ls -laR ./output

      - name: 📀 Publish the ISO
        # As an OCI image, the way kernel-build.yml publishes the kernel artifacts: the
        # ISO carries the whole system image and is far past the 2 GB an Actions
        # artifact takes. By run id only: tag-system-images of the Orchestrator moves :latest,
        # on main, after the image this ISO installs verified (doc_update_delivery.md, UD25).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          iso=$(find ./output -name '*.iso' -type f | head -n 1)
          [[ -n $iso ]] || { echo "the ISO build produced no .iso under ./output" >&2; exit 1; }
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          image="${IMAGE_REGISTRY}/athanor-iso"
          # podman, not buildah: this job builds and pushes the system image with it, so
          # it is certainly on the runner. A Containerfile on stdin keeps the context to
          # the ISO alone.
          podman build --format docker -t "${image}:${RUN_ID}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -f - "$(dirname "$iso")" <<CONTAINERFILE
          FROM scratch
          LABEL org.opencontainers.image.title="Athanor installer ISO"
          LABEL org.opencontainers.image.version="${RUN_ID}"
          COPY $(basename "$iso") /athanor-${RUN_ID}.iso
          CONTAINERFILE
          bash forge/scripts/retry.sh podman push "${image}:${RUN_ID}"
          {
            echo "### Installer ISO"
            echo
            echo "\`${image}:${RUN_ID}\`, $(du -h "$iso" | cut -f1)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
