name: cosmic-comp rebase drill

# Tries Athanor's cosmic-comp patch set (forge/specs/cosmic-comp/SOURCES) on the newest
# upstream tag and reports which patches apply. The logic is in
# scripts/cosmic-comp-rebase/rebase.py; this file checks out, calls it and uploads its
# output. The run is red when a patch no longer applies, which is what it is for, and
# when the drill cannot run: a crate that cannot be downloaded (exit 2), a git command that
# fails for its own reasons (exit 3 for `git ls-remote`, 4 for `git clone`, 5 for `git apply`)
# or a spec, manifest or crate that fails validation (exit 1 with a message, before any report).
# It changes nothing in the repository: the bump itself is cosmic-comp-bump.yml.
# `schedule` only works from the default branch; by hand on any branch.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Apply the patch set on the newest upstream tag
        run: python3 scripts/cosmic-comp-rebase/rebase.py "$RUNNER_TEMP/rebase"

      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cosmic-comp-rebase
          path: ${{ runner.temp }}/rebase
          if-no-files-found: ignore

  alert:
    # PL51: a failed or cancelled job of a scheduled run opens or updates its ci-alert issue, and a
    # success closes it. A job of its own on a GitHub runner, after every other job whatever
    # their result, so a lost runner or a timeout is seen as well.
    needs: [rebase]
    if: ${{ always() && !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/alert
        with:
          needs: ${{ toJSON(needs) }}
