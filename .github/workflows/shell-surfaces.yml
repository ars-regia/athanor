name: Shell surfaces

# The visual tests of the shell rig. On a pull request pr.yml calls this workflow when
# scripts/ci/changes.py selects `shell` (the paths of the push filter below, except a root
# Cargo.toml or Cargo.lock that only adds workspace members, which a path filter cannot read),
# and its verdict reaches the required `gate`; the crates' unit tests run in `just check`.
on:
  push:
    branches: [iso-v0]
    paths:
      - "system/athanor-style/**"
      - "forge/specs/athanor-greeter-ui/**"
      - "system/athanor-layout/**"
      - "forge/specs/athanor-layout-chooser/**"
      - "system/athanor-sulphur-client/**"
      - "system/athanor-sal/**"
      - "forge/specs/athanor-sulphur/**"
      - "system/athanor-i18n/**"
      - "forge/specs/athanor-shelld/**"
      - "forge/specs/athanor-bar/**"
      - "forge/specs/athanor-dock/**"
      - "forge/specs/athanor-osd/**"
      - "system/athanor-search/**"
      - "system/athanor-preview/**"
      - "system/athanor-preview-render/**"
      - "forge/specs/athanor-launcher/**"
      - "system/athanor-apps/**"
      - "system/athanor-controls/**"
      - "system/athanor-services/**"
      - "forge/specs/athanor-control-center/**"
      - "system/athanor-unit/**"
      - "system/athanor-trust-state/**"
      - "forge/test/shell/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/shell-surfaces.yml"
  workflow_call:
  workflow_dispatch:

# A merge into iso-v0 cancels the push run of the merge before it: the newer head holds both
# changes. Called from pr.yml the group is the caller's "Pull Request-<ref>", apart from
# "pr-<number>".
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/call-lint.yml

  css-parse:
    name: GTK parse gate over the generated stylesheets
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Nested sandbox probe
        run: bash forge/test/shell/rig.sh probe-sandbox
      - name: GTK parse gate
        run: bash forge/test/shell/rig.sh css-parse

  greeter:
    name: Greeter build, link order, layer-surface guard, accessibility and surface cases
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rig image
        run: bash forge/test/shell/rig.sh build-image
      - name: Build the greeter and check the DT_NEEDED order
        run: bash forge/test/shell/rig.sh build-greeter
      - name: Layer-surface guard
        run: bash forge/test/shell/rig.sh layer-guard greeter
      - name: Accessibility tree of the greeter
        run: bash forge/test/shell/rig.sh atspi greeter
      - name: Accessibility tree of the greeter in Italian
        run: bash forge/test/shell/rig.sh atspi greeter it
      - name: Greeter surface cases (12) against the goldens
        run: bash forge/test/shell/rig.sh surface greeter
      - name: Orca's speech on the greeter against its transcript
        run: bash forge/test/shell/rig.sh orca greeter
      - name: Orca's speech on the greeter in Italian against its transcript
        run: bash forge/test/shell/rig.sh orca greeter it
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shell-rig-greeter
          path: |
            .scratch/shell-rig/*.log
            .scratch/shell-rig/orca-*.txt
            .scratch/shell-rig/greeter-*.png

  layout:
    name: Layout library and chooser; layout cases on the bar and the dock; chooser cases; end-to-end press
    needs: [lint, build-bar]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rig image
        run: bash forge/test/shell/rig.sh build-image
      - name: Build and test the layout crates
        run: bash forge/test/shell/rig.sh build-layout
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shell-rig-bin
          path: .scratch/shell-rig/bin
      - name: Verify the binaries of the build job
        run: bash forge/test/shell/rig.sh verify-bin athanor-bar
      - name: Build and test the dock and check the DT_NEEDED order
        run: bash forge/test/shell/rig.sh build-dock
      - name: Layout cases (21) against the goldens
        run: bash forge/test/shell/rig.sh surface layout
      - name: Accessibility tree of the chooser
        run: bash forge/test/shell/rig.sh atspi chooser
      - name: Accessibility tree of the chooser in Italian
        run: bash forge/test/shell/rig.sh atspi chooser it
      - name: Chooser surface cases (12) against the goldens
        run: bash forge/test/shell/rig.sh surface chooser
      - name: Orca's speech on the chooser against its transcript
        run: bash forge/test/shell/rig.sh orca chooser
      - name: Orca's speech on the chooser in Italian against its transcript
        run: bash forge/test/shell/rig.sh orca chooser it
      - name: A preset picked in the chooser applies without a restart
        run: bash forge/test/shell/rig.sh chooser-e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shell-rig-layout
          path: |
            .scratch/shell-rig/*.log
            .scratch/shell-rig/orca-*.txt
            .scratch/shell-rig/layout-*.png
            .scratch/shell-rig/chooser-*.png

  compositor:
    name: Compositor client against cosmic-comp and against a compositor without COSMIC
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rig image
        run: bash forge/test/shell/rig.sh build-image
      - name: The rig runs the cosmic-comp the session ships
        run: bash forge/test/shell/rig.sh cosmic-comp-version
      - name: Build and test the compositor client
        run: bash forge/test/shell/rig.sh build-compositor-client
      - name: The client against cosmic-comp and sway
        run: bash forge/test/shell/rig.sh compositor-e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shell-rig-compositor
          path: |
            .scratch/shell-rig/*.log
            .scratch/shell-rig/compositor-e2e.png

  no-gtk:
    name: The shared crates of the shell without GTK
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rig image
        run: bash forge/test/shell/rig.sh build-image
      - name: No GTK crate in their tree; clippy and tests without the gtk feature
        run: bash forge/test/shell/rig.sh no-gtk
      - name: The toolkit's GPU tests on llvmpipe
        run: bash forge/test/shell/rig.sh toolkit-gpu

  toolkit-clipboard:
    name: The toolkit's text field against wl-clipboard
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rig image
        run: bash forge/test/shell/rig.sh build-image
      - name: Build and test the toolkit
        run: bash forge/test/shell/rig.sh build-toolkit
      - name: Copy, cut, paste and the primary selection under cosmic-comp
        run: bash forge/test/shell/rig.sh toolkit-clipboard
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shell-rig-toolkit-clipboard
          path: .scratch/shell-rig/*.log

  toolkit-surfaces:
    name: The toolkit's gallery and chooser against the goldens under athanor-sulphur; layer surfaces and popups under sway
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rig image
        run: bash forge/test/shell/rig.sh build-image
      - name: Build and test athanor-sulphur
        run: bash forge/test/shell/rig.sh build-compositor
      - name: Build and test the toolkit
        run: bash forge/test/shell/rig.sh build-toolkit
      - name: Gallery surface cases (24) against the goldens
        run: bash forge/test/shell/rig.sh surface toolkit-gallery
      - name: Chooser surface cases (6) against the goldens
        run: bash forge/test/shell/rig.sh surface toolkit-chooser
      - name: Orca's speech on the gallery against its transcript
        run: bash forge/test/shell/rig.sh orca gallery
      - name: Orca's speech on the gallery in Italian against its transcript
        run: bash forge/test/shell/rig.sh orca gallery it
      - name: One layer surface per output as outputs come and go
        run: bash forge/test/shell/rig.sh toolkit-layer
      - name: A full-size background picture on each output
        run: bash forge/test/shell/rig.sh toolkit-picture
      - name: Tooltip and menu popups of a layer surface
        run: bash forge/test/shell/rig.sh toolkit-popup
      - name: A layer surface's motion on its frame callbacks
        run: bash forge/test/shell/rig.sh toolkit-motion
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shell-rig-toolkit-surfaces
          path: |
            .scratch/shell-rig/*.log
            .scratch/shell-rig/orca-*.txt
            .scratch/shell-rig/toolkit-gallery-*.png
            .scratch/shell-rig/toolkit-chooser-*.png

  shelld:
    name: Shell daemon, notifications and the tray watcher
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rig image
        run: bash forge/test/shell/rig.sh build-image
      - name: Build and test the daemon
        run: bash forge/test/shell/rig.sh build-shelld
      - name: The daemon on a session bus
        run: bash forge/test/shell/rig.sh shelld-e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shell-rig-shelld
          path: .scratch/shell-rig/shelld-e2e.log

  bar:
    name: Bar, build and end to end
    needs: [lint, build-bar]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shell-rig-bin
          path: .scratch/shell-rig/bin
      - name: Verify the binaries of the build job
        run: bash forge/test/shell/rig.sh verify-bin athanor-bar athanor-shelld
      - name: Layer-surface guard
        run: bash forge/test/shell/rig.sh layer-guard bar
      - name: Accessibility tree of the bar
        run: bash forge/test/shell/rig.sh atspi bar
      - name: Accessibility tree of the bar in Italian
        run: bash forge/test/shell/rig.sh atspi bar it
      - name: Accessibility tree of the bar with every system module
        run: bash forge/test/shell/rig.sh atspi bar-modules
      - name: Orca's speech on the bar against its transcript
        run: bash forge/test/shell/rig.sh orca bar
      - name: Orca's speech on the bar in Italian against its transcript
        run: bash forge/test/shell/rig.sh orca bar it
      - name: Live layout, mandatory keys, running windows, the power menu and memory
        run: bash forge/test/shell/rig.sh bar-e2e
      - name: The network, Bluetooth, audio and battery modules against their fixtures
        run: bash forge/test/shell/rig.sh bar-modules-e2e
      - name: Notification popups and list against a fake daemon
        run: bash forge/test/shell/rig.sh notifications-e2e
      - name: Shield end to end
        run: bash forge/test/shell/rig.sh shield-e2e
      - name: Tray host and menus against athanor-shelld
        run: bash forge/test/shell/rig.sh tray-e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shell-rig-bar
          path: |
            .scratch/shell-rig/*.log
            .scratch/shell-rig/orca-*.txt
            .scratch/shell-rig/bar-e2e.png
            .scratch/shell-rig/bar-modules-e2e.png
            .scratch/shell-rig/notifications-e2e.png
            .scratch/shell-rig/shield-e2e.png
            .scratch/shell-rig/tray-e2e.png

  build-bar:
    name: Build and test the bar and athanor-shelld once for the scene jobs
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rig image
        run: bash forge/test/shell/rig.sh build-image
      - name: Build and test the bar and check the DT_NEEDED order
        run: bash forge/test/shell/rig.sh build-bar
      - name: Build and test the daemon
        run: bash forge/test/shell/rig.sh build-shelld
      - name: Seal the binaries
        run: bash forge/test/shell/rig.sh seal-bin athanor-bar athanor-shelld
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shell-rig-bin
          path: |
            .scratch/shell-rig/bin/athanor-bar
            .scratch/shell-rig/bin/athanor-shelld
            .scratch/shell-rig/bin/SEALED
          if-no-files-found: error
          retention-days: 1

  bar-scenes:
    name: Bar scene ${{ matrix.scene }} (12 cases) against the goldens
    needs: build-bar
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scene:
          [
            bar,
            bar-power,
            bar-input,
            bar-calendar,
            bar-accessibility,
            bar-tiling,
            bar-popups,
            bar-notifications,
            bar-tray,
            bar-network,
            bar-bluetooth,
            bar-audio,
            bar-battery,
            bar-shield,
          ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shell-rig-bin
          path: .scratch/shell-rig/bin
      - name: Verify the binaries of the build job
        run: bash forge/test/shell/rig.sh verify-bin athanor-bar athanor-shelld
      - name: Cases against the goldens
        run: bash forge/test/shell/rig.sh surface "${{ matrix.scene }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shell-rig-${{ matrix.scene }}
          path: |
            .scratch/shell-rig/*.log
            .scratch/shell-rig/${{ matrix.scene }}-*.png

  dock:
    name: Dock, build and end to end
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rig image
        run: bash forge/test/shell/rig.sh build-image
      - name: Build and test the dock and check the DT_NEEDED order
        run: bash forge/test/shell/rig.sh build-dock
      - name: Layer-surface guard
        run: bash forge/test/shell/rig.sh layer-guard dock
      - name: Accessibility tree of the dock
        run: bash forge/test/shell/rig.sh atspi dock
      - name: Accessibility tree of the dock in Italian
        run: bash forge/test/shell/rig.sh atspi dock it
      - name: Build and test athanor-sulphur
        run: bash forge/test/shell/rig.sh build-compositor
      - name: Orca's speech on the dock under athanor-sulphur against its transcript
        env:
          RIG_COMPOSITOR: athanor
        run: bash forge/test/shell/rig.sh orca dock
      - name: Orca's speech on the dock in Italian under athanor-sulphur against its transcript
        env:
          RIG_COMPOSITOR: athanor
        run: bash forge/test/shell/rig.sh orca dock it
      - name: Openers, running windows, pinning, the knob and presets live, and memory
        run: bash forge/test/shell/rig.sh dock-e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shell-rig-dock
          path: |
            .scratch/shell-rig/*.log
            .scratch/shell-rig/orca-*.txt
            .scratch/shell-rig/dock-e2e.png

  dock-scene:
    name: Dock scene (12 cases) against the goldens
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rig image
        run: bash forge/test/shell/rig.sh build-image
      - name: Build the dock
        run: bash forge/test/shell/rig.sh build-dock
      - name: Cases against the goldens
        run: bash forge/test/shell/rig.sh surface dock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shell-rig-dock-scene
          path: |
            .scratch/shell-rig/*.log
            .scratch/shell-rig/dock-*.png

  control-center:
    name: Control center build, tests on a display and link order
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rig image
        run: bash forge/test/shell/rig.sh build-image
      - name: Build the control center, with athanor-services and athanor-controls, and check the DT_NEEDED order
        run: bash forge/test/shell/rig.sh build-control-center
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shell-rig-control-center
          path: .scratch/shell-rig/*.log

  launcher:
    name: Launcher build, layer-surface guard, end to end, accessibility and surface cases
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rig image
        run: bash forge/test/shell/rig.sh build-image
      - name: Build the launcher and its decoder, with the qalc test required
        run: bash forge/test/shell/rig.sh build-launcher
      - name: Layer-surface guard
        run: bash forge/test/shell/rig.sh layer-guard launcher
      - name: End to end (calculator, toggle, show time, memory, frozen provider, hostile names, no localsearch)
        run: bash forge/test/shell/rig.sh launcher-e2e
      - name: Accessibility tree of the launcher
        run: bash forge/test/shell/rig.sh atspi launcher
      - name: Launcher surface cases (12) against the goldens
        run: bash forge/test/shell/rig.sh surface launcher
      - name: Window preview against its golden
        run: bash forge/test/shell/rig.sh launcher-window-preview
      - name: Build and test athanor-sulphur
        run: bash forge/test/shell/rig.sh build-compositor
      - name: Orca's speech on the launcher under athanor-sulphur against its transcript
        env:
          RIG_COMPOSITOR: athanor
        run: bash forge/test/shell/rig.sh orca launcher
      - name: Orca's speech on the launcher in Italian under athanor-sulphur against its transcript
        env:
          RIG_COMPOSITOR: athanor
        run: bash forge/test/shell/rig.sh orca launcher it
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shell-rig-launcher
          path: |
            .scratch/shell-rig/*.log
            .scratch/shell-rig/orca-*.txt
            .scratch/shell-rig/launcher-*.png
