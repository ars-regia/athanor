name: 🧹 Forge GHCR Cleanup

# The weekly janitor of the container packages (forge/scripts/clean_ghcr.sh). The kernel
# packages azoth* are excluded: their only pruner is forge/specs/azoth/retention.sh
# (docs/architecture/doc_build_ordering.md, O6). It runs only by hand until clean_ghcr.sh keeps
# the tier digests that the forge-tier<N>.digest labels of a kept system image name
# (doc_build_system.md, PLAT-N01): any run, by hand too, would delete them (#1275).

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write  # FORGE_PAT has delete:packages scope

jobs:
  cleanup-janitor:
    # On the runner, not in the builder image: clean_ghcr.sh needs only bash, gh, jq and skopeo,
    # all on ubuntu-24.04, and the job holds FORGE_PAT, which no image should see that the job
    # has not verified (#1205).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Log in to the registry (the janitor reads the signature indexes)
        env:
          GH_TOKEN: ${{ secrets.FORGE_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
        run: echo "${GH_TOKEN}" | skopeo login "${REGISTRY_HOST}" -u "${GITHUB_ACTOR}" --password-stdin

      - name: Prune the container packages (clean_ghcr.sh)
        env:
          GH_TOKEN: ${{ secrets.FORGE_PAT }}
          OWNER: ${{ github.repository_owner }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
        run: bash forge/scripts/clean_ghcr.sh "$OWNER"
