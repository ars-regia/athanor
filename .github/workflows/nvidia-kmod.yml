name: NVIDIA kmod

# The NVIDIA kernel modules, signed and published (forge/specs/azoth/nvidia.sh,
# docs/architecture/doc_kernel_build.md, section 10; docs/architecture/doc_build_ordering.md,
# O1, O2, O5, O6). artifacts: system/kernel-artifacts.sh resolves the kernel of the pins by
# digest and the module tags bound to it; unless the modules are missing (both branches
# already published, signed and attested, or the kernel of the pins not published) the run
# ends there with a notice, asking for no approval. build: nvidia-build.yml, the two branches
# (open, legacy) against azoth-devel by digest. prepare: key-less, the MOK-signed negative
# sample. sign: on a GitHub runner in the `signing-kernel` environment, the one sign-only job of
# a kernel cycle (D43): a key-less step derives the kernel from the registry, verified with
# cosign, and allow-lists the modules of the build job; then the step with the keys runs only
# the signer image pinned by digest (forge/specs/azoth/signer/run.sh), signing the .ko files
# with the module key and vmlinuz with the Secure Boot key; no build, no third-party action.
# boot: in QEMU,
# every case of the matrix: the signed nvidia.ko of each branch must pass the signature check
# against the certificate compiled into the kernel (ENODEV: no GPU), while an unsigned copy and
# a copy signed by an enrolled Secure Boot-profile MOK must be rejected (EKEYREJECTED).
# publish: nvidia-publish.sh, azoth-nvidia:<nvr>-k<12 hex of the kernel digest>-<branch>-<version>
# with SBOM, signature and attestation, and azoth-boot:<nvr>-k<12 hex> (the signed vmlinuz,
# verified again with sbverify first), never overwriting a published tag; then the retention
# and the verification. publish alone holds the azoth-nvidia-publish concurrency group with
# cancel-in-progress false, so a queued publish never interleaves a push and its signature
# with another run's. sign and boot stay out of the group: neither of them pushes anything,
# and sharing the group with them would let a competing run's sign seize it and cancel this
# run's already-queued boot or publish, leaving modules built and unpublished. The
# Orchestrator calls this workflow when the modules or the signed vmlinuz are missing
# (state modules-missing); it also runs by hand. The
# gate on PRs is the kmod job of Kernel Build.

on:
  workflow_call:
    inputs:
      kernel_digest:
        description: "digest of azoth:<nvr> that the caller resolved; the run fails if the registry holds another"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      kernel_digest:
        description: "digest of azoth:<nvr>; empty: the one system/kernel-artifacts.sh resolves"
        type: string
        default: ""

permissions:
  contents: read

env:
  # The same knob kernel-build.yml sets (system/kernel-artifacts.sh reads it under this
  # exact name): every resolve below must agree with what kernel-build.yml published to,
  # or a repository variable override would make this workflow see kernel-missing forever
  # (doc_build_ordering.md, O9).
  KERNEL_REGISTRY: ${{ vars.KERNEL_REGISTRY }}

jobs:
  artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      state: ${{ steps.artifacts.outputs.state }}
      kernel_digest: ${{ steps.artifacts.outputs.kernel_digest }}
      devel_digest: ${{ steps.artifacts.outputs.devel_digest }}
      registry: ${{ steps.artifacts.outputs.registry }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Resolve the kernel artifacts (system/kernel-artifacts.sh)
        id: artifacts
        env:
          KERNEL_DIGEST: ${{ inputs.kernel_digest }}
        run: |
          set -euo pipefail
          bash system/kernel-artifacts.sh resolve --expect-kernel-digest "$KERNEL_DIGEST"
          grep -E '^(state|kernel_digest|devel_digest|registry)=' kernel-artifacts/kernel-artifacts.env >> "$GITHUB_OUTPUT"

      - name: Nothing to build
        if: ${{ steps.artifacts.outputs.state != 'modules-missing' }}
        env:
          STATE: ${{ steps.artifacts.outputs.state }}
        run: |
          echo "::notice title=NVIDIA kmod::state ${STATE}: the modules and the signed vmlinuz of the pins are published, or their kernel is not; no build and no approval"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nvidia-kernel-artifacts
          path: kernel-artifacts/kernel-artifacts.env
          if-no-files-found: error

  build:
    needs: artifacts
    if: ${{ needs.artifacts.outputs.state == 'modules-missing' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/nvidia-build.yml
    with:
      devel-digest: ${{ needs.artifacts.outputs.devel_digest }}
      registry: ${{ needs.artifacts.outputs.registry }}

  prepare:
    # The negative sample of the boot job, outside the signing environment.
    needs: [artifacts, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nvidia-open-unsigned
          path: out

      - name: The MOK-signed negative sample (signer/run.sh prepare)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KERNEL_DIGEST: ${{ needs.artifacts.outputs.kernel_digest }}
        run: bash forge/specs/azoth/signer/run.sh prepare

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nvidia-mok-signed
          path: mok/
          if-no-files-found: error

  sign:
    # Signs only what it derives itself: the kernel from the registry, verified by cosign in the
    # key-less step below, and the modules of the build job once they pass the allow-list.
    needs: [artifacts, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment: signing-kernel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: nvidia-*-unsigned
          path: out
          merge-multiple: true

      - name: Derive and verify what is signed, without a key (signer/run.sh inputs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KERNEL_DIGEST: ${{ needs.artifacts.outputs.kernel_digest }}
        run: bash forge/specs/azoth/signer/run.sh inputs

      - name: Sign the modules and vmlinuz (signer/run.sh sign)
        # The public certificates are in the repository: the module one is compiled into the
        # kernel (kernel-local), the Secure Boot one is what shim checks through MokList.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}
          SECUREBOOT_SIGNING_KEY: ${{ secrets.SECUREBOOT_SIGNING_KEY }}
        run: bash forge/specs/azoth/signer/run.sh sign

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nvidia-signed
          path: out/
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: azoth-kernel-signed
          path: kernel-signed/
          if-no-files-found: error

  boot:
    needs: [prepare, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nvidia-signed
          path: signed

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        # The negative check: the same nvidia.ko before signing.
        with:
          name: nvidia-open-unsigned
          path: unsigned

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        # The negative check of key separation: nvidia.ko signed by an enrolled MOK.
        with:
          name: nvidia-mok-signed
          path: mok

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nvidia-kernel-artifacts
          path: kernel-artifacts

      - name: Kernel-core from the published image, by digest
        run: |
          set -euo pipefail
          registry=$(bash system/kernel-artifacts.sh get registry)
          kernel=$(bash system/kernel-artifacts.sh get kernel_digest)
          nvr=$(bash system/kernel-artifacts.sh get nvr)
          ctr=$(podman create "${registry}/azoth@${kernel}" /kernel-core)
          mkdir -p out && podman cp "${ctr}:/." out/ && podman rm "$ctr" > /dev/null
          echo "nvr=${nvr}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/kvm

      - name: Build the boot-matrix image
        env:
          BUILDAH_ISOLATION: chroot
        run: podman build -t localhost/azoth-boot -f forge/specs/azoth/boot/Containerfile forge/specs/azoth

      - name: Run boot.sh with the signed modules
        # Every case: the trust in the module signing key is compiled into the kernel, so
        # SeaBIOS proves it holds without firmware, and the UEFI cases prove that a MOK
        # enrolled in MokList does not extend it.
        run: |
          set -euo pipefail
          mkdir -p boot-out
          ko="lib/modules/${nvr}.x86_64/extra/nvidia/nvidia.ko"
          podman run --rm --device /dev/kvm -v "$GITHUB_WORKSPACE:/forge" -w /forge localhost/azoth-boot \
            bash forge/specs/azoth/boot.sh --rpms /forge/out --out /forge/boot-out \
              --mok mok/test-mok.pem \
              --insmod "signed/open/${ko}:ENODEV" \
              --insmod "signed/legacy/${ko}:ENODEV" \
              --insmod "unsigned/open/${ko}:EKEYREJECTED" \
              --insmod "mok/open/${ko}:EKEYREJECTED"

      - name: Summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -f boot-out/summary.md ]]; then cat boot-out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && hashFiles('boot-out/**') != '' }}
        with:
          name: nvidia-boot-logs
          path: boot-out/
          if-no-files-found: error

  publish:
    needs: [sign, boot]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: azoth-nvidia-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nvidia-signed
          path: out

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: azoth-kernel-signed
          path: kernel-signed

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nvidia-kernel-artifacts
          path: resolved

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26

      - name: Resolve again inside the publication group
        # A run that published the same tags while this one waited for the group leaves them
        # in place: nvidia-publish.sh skips every branch the file lists with a digest (O2).
        run: |
          set -euo pipefail
          expected=$(KERNEL_ARTIFACTS_DIR=resolved bash system/kernel-artifacts.sh get kernel_digest)
          bash system/kernel-artifacts.sh resolve --expect-kernel-digest "$expected"

      - name: Verify the signed vmlinuz (signer/run.sh verify)
        run: bash forge/specs/azoth/signer/run.sh verify

      - name: Publish (nvidia-publish.sh)
        env:
          BUILDAH_ISOLATION: chroot
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          host=$(bash system/kernel-artifacts.sh get registry)
          host=${host%%/*}
          export SYFT_REGISTRY_AUTH_AUTHORITY="$host"
          echo "${GH_TOKEN}" | buildah login -u "${GITHUB_ACTOR}" --password-stdin "$host"
          echo "${GH_TOKEN}" | cosign login "$host" -u "${GITHUB_ACTOR}" --password-stdin
          bash forge/specs/azoth/nvidia-publish.sh out kernel-signed
          cat nvidia-publish/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Retention (retention.sh)
        run: bash forge/specs/azoth/retention.sh

      - name: Verify (gate K4)
        # The resolver verifies the three tags again after the retention: signature by this
        # workflow, and an attestation naming the pins (the certificate for azoth-boot) and the
        # kernel digest.
        run: bash system/kernel-artifacts.sh require-ready

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nvidia-attestations
          path: nvidia-publish/
          if-no-files-found: error
