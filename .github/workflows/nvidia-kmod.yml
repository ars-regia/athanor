name: NVIDIA kmod

# The NVIDIA kernel modules and the signed vmlinuz, verified and published
# (forge/specs/azoth/nvidia.sh, docs/architecture/doc_kernel_build.md, section 10;
# docs/architecture/doc_build_ordering.md, O1, O2, O5, O6). The last part of the kmod cycle,
# which runs in three steps because a called workflow's job reads the secrets of its environment
# only when its caller inherits every secret (actions/runner#4453, D43):
# call-nvidia-kmod-prepare.yml (artifacts, build, prepare, key-less), then the sign job of the
# workflow the event started, `nvidia-kmod-sign` of the Orchestrator (on a GitHub runner in the `signing-kernel` environment, the one
# sign-only job of a kernel cycle: a key-less step derives the kernel from the registry,
# verified with cosign, and allow-lists the modules of the build job; then the step with the
# keys runs only the signer image pinned by digest, forge/specs/azoth/signer/run.sh, signing the
# .ko files with the module key and vmlinuz with the Secure Boot key; no build, no third-party
# action), then this workflow, called only once the sign job has succeeded. Every part reads
# the artifacts of the others from the run, which all of them share.
# boot: in QEMU, every case of the matrix: the signed nvidia.ko of each branch must pass the
# signature check against the certificate compiled into the kernel (ENODEV: no GPU), while an
# unsigned copy and a copy signed by an enrolled Secure Boot-profile MOK must be rejected
# (EKEYREJECTED).
# publish: nvidia-publish.sh, azoth-nvidia:<nvr>-k<12 hex of the kernel digest>-<branch>-<version>
# with SBOM, signature and attestation, and azoth-boot:<nvr>-k<12 hex> (the signed vmlinuz,
# verified again with sbverify first), never overwriting a published tag; then the retention
# and the verification. The keyless signatures name this file, whoever calls it:
# system/kernel-artifacts.sh trusts the modules and azoth-boot signed by nvidia-kmod.yml only,
# so publish stays here. publish alone holds the azoth-nvidia-publish concurrency group with
# cancel-in-progress false, so a queued publish never interleaves a push and its signature
# with another run's. The sign job and boot stay out of the group: neither pushes
# anything, and sharing the group with them would let a competing run's sign seize it and
# cancel this run's already-queued boot or publish, leaving modules built and unpublished. The
# Orchestrator runs the cycle when the modules or the signed vmlinuz are missing (state
# modules-missing); a manual cycle dispatches the Orchestrator. The gate on PRs is the kmod job
# of Kernel Build.

on:
  workflow_call:

permissions:
  contents: read

env:
  # The same knob kernel-build.yml sets (system/kernel-artifacts.sh reads it under this
  # exact name): every resolve below must agree with what kernel-build.yml published to,
  # or a repository variable override would make this workflow see kernel-missing forever
  # (doc_build_ordering.md, O9).
  KERNEL_REGISTRY: ${{ vars.KERNEL_REGISTRY }}

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nvidia-signed
          path: signed

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        # The negative check: the same nvidia.ko before signing.
        with:
          name: nvidia-open-unsigned
          path: unsigned

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        # The negative check of key separation: nvidia.ko signed by an enrolled MOK.
        with:
          name: nvidia-mok-signed
          path: mok

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nvidia-kernel-artifacts
          path: kernel-artifacts

      - name: Kernel-core from the published image, by digest
        run: |
          set -euo pipefail
          registry=$(bash system/kernel-artifacts.sh get registry)
          kernel=$(bash system/kernel-artifacts.sh get kernel_digest)
          nvr=$(bash system/kernel-artifacts.sh get nvr)
          ctr=$(podman create "${registry}/azoth@${kernel}" /kernel-core)
          mkdir -p out && podman cp "${ctr}:/." out/ && podman rm "$ctr" > /dev/null
          echo "nvr=${nvr}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/kvm

      - name: Build the boot-matrix image
        env:
          BUILDAH_ISOLATION: chroot
        run: podman build -t localhost/azoth-boot -f forge/specs/azoth/boot/Containerfile forge/specs/azoth

      - name: Run boot.sh with the signed modules
        # Every case: the trust in the module signing key is compiled into the kernel, so
        # SeaBIOS proves it holds without firmware, and the UEFI cases prove that a MOK
        # enrolled in MokList does not extend it.
        run: |
          set -euo pipefail
          mkdir -p boot-out
          ko="lib/modules/${nvr}.x86_64/extra/nvidia/nvidia.ko"
          podman run --rm --device /dev/kvm -v "$GITHUB_WORKSPACE:/forge" -w /forge localhost/azoth-boot \
            bash forge/specs/azoth/boot.sh --rpms /forge/out --out /forge/boot-out \
              --mok mok/test-mok.pem \
              --insmod "signed/open/${ko}:ENODEV" \
              --insmod "signed/legacy/${ko}:ENODEV" \
              --insmod "unsigned/open/${ko}:EKEYREJECTED" \
              --insmod "mok/open/${ko}:EKEYREJECTED"

      - name: Summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -f boot-out/summary.md ]]; then cat boot-out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && hashFiles('boot-out/**') != '' }}
        with:
          name: nvidia-boot-logs
          path: boot-out/
          if-no-files-found: error

  publish:
    needs: [boot]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: azoth-nvidia-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nvidia-signed
          path: out

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: azoth-kernel-signed
          path: kernel-signed

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nvidia-kernel-artifacts
          path: resolved

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26

      - name: Resolve again inside the publication group
        # A run that published the same tags while this one waited for the group leaves them
        # in place: nvidia-publish.sh skips every branch the file lists with a digest (O2).
        run: |
          set -euo pipefail
          expected=$(KERNEL_ARTIFACTS_DIR=resolved bash system/kernel-artifacts.sh get kernel_digest)
          bash system/kernel-artifacts.sh resolve --expect-kernel-digest "$expected"

      - name: Verify the signed vmlinuz (signer/run.sh verify)
        run: bash forge/specs/azoth/signer/run.sh verify

      - name: Publish (nvidia-publish.sh)
        env:
          BUILDAH_ISOLATION: chroot
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          host=$(bash system/kernel-artifacts.sh get registry)
          host=${host%%/*}
          export SYFT_REGISTRY_AUTH_AUTHORITY="$host"
          echo "${GH_TOKEN}" | buildah login -u "${GITHUB_ACTOR}" --password-stdin "$host"
          echo "${GH_TOKEN}" | cosign login "$host" -u "${GITHUB_ACTOR}" --password-stdin
          bash forge/specs/azoth/nvidia-publish.sh out kernel-signed
          cat nvidia-publish/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Retention (retention.sh)
        run: bash forge/specs/azoth/retention.sh

      - name: Verify (gate K4)
        # The resolver verifies the three tags again after the retention: signature by this
        # workflow, and an attestation naming the pins (the certificate for azoth-boot) and the
        # kernel digest.
        run: bash system/kernel-artifacts.sh require-ready

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nvidia-attestations
          path: nvidia-publish/
          if-no-files-found: error
