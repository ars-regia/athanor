name: 🛡️ Rust Security & Buffer Overflow Fuzzing

on:
  push:
    branches: [ main ]
    paths:
      - 'forge/specs/*-rs/**'
      - 'forge/specs/athanor-backup/**'
      - 'tests/fuzz/**'
      - '.github/workflows/fuzzing.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'forge/specs/*-rs/**'
      - 'forge/specs/athanor-backup/**'
      - 'tests/fuzz/**'
      - '.github/workflows/fuzzing.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'Tempo di fuzzing per ciascun target (in secondi)'
        required: false
        default: '60'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: 🎯 Fuzz Unified Suite (${{ matrix.sanitizer_name }})
    runs-on: ubuntu-24.04
    container:
      image: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}/${{ github.repository_owner }}/athanor-builder:${{ vars.BUILDER_STABLE_TAG || 'latest' }}
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/sccache
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        sanitizer: [address, memory]
        include:
          - sanitizer: address
            sanitizer_name: AddressSanitizer
          - sanitizer: memory
            sanitizer_name: MemorySanitizer

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ❄️ Install Nix (Bedrock Cache)
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: ⚙️ Set Default Rust Toolchain & Install cargo-fuzz
        run: |
          set -euo pipefail
          nix profile install nixpkgs#cargo-fuzz nixpkgs#sccache


      - name: ⚡ Restore sccache Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/sccache
          key: sccache-fuzz-${{ matrix.sanitizer }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-fuzz-${{ matrix.sanitizer }}-

      - name: ⚡ Extreme Rust Cache (LLVM & Dependencies)
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "cargo-fuzz-${{ matrix.sanitizer }}"
          cache-on-failure: "true"
          workspaces: "tests/fuzz -> target"
      - name: 🔍 Run Cargo Fuzz (${{ matrix.sanitizer_name }})
        run: |
          set -euo pipefail
          FUZZ_TIME="${{ github.event.inputs.fuzz_seconds }}"
          if [ -z "$FUZZ_TIME" ]; then
            FUZZ_TIME="60"
          fi
          
          cd tests/fuzz

          TARGETS=$(cargo fuzz list --fuzz-dir . 2>/dev/null || find fuzz_targets -maxdepth 1 -name '*.rs' -exec basename {} .rs \; 2>/dev/null)

          if [ -z "$TARGETS" ]; then
            echo "❌ ERROR: Nessun target di fuzzing valido in tests/fuzz"
            exit 1
          fi

          echo "🎯 Target di Fuzzing individuati: $TARGETS"
          
          FAILED=0
          for target in $TARGETS; do
            echo "🔥 Running cargo fuzz su target '$target' per ${FUZZ_TIME}s con ${{ matrix.sanitizer_name }}..."
            cargo fuzz run --fuzz-dir . -s ${{ matrix.sanitizer }} "$target" -- -max_total_time="$FUZZ_TIME" || FAILED=$((FAILED+1))
          done
          exit $FAILED

      - name: 🚨 Upload Fuzzing Crash Artifacts (ZSTD Compressed)
        if: failure() || always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.sanitizer }}
          path: |
            tests/fuzz/artifacts/
            tests/fuzz/corpus/
          if-no-files-found: ignore
          compression-level: 1

