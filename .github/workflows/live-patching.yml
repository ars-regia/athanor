name: Athanor OS Kernel Live Patching

on:
  push:
    branches: [ "main" ]
    paths:
      - 'kernel/patches/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-livepatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}/${{ github.repository_owner }}/athanor-builder:${{ vars.BUILDER_STABLE_TAG || 'latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4


      - name: Build Live Patch
        run: |
          set -euo pipefail
          echo "Building kpatch..."
          mkdir -p forge/build/livepatch
          for patch in kernel/patches/*.patch; do
            if [ -f "$patch" ]; then
              kpatch-build -t vmlinux -v "$patch" -o forge/build/livepatch/
            fi
          done

      - name: Package Live Patch
        run: |
          set -euo pipefail
          echo "Packaging live patch into RPM..."
          if [ -f "forge/specs/athanor-livepatch/athanor-livepatch.spec" ]; then
            rpmbuild -ba forge/specs/athanor-livepatch/athanor-livepatch.spec
          fi
          


      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: athanor-livepatch
          path: forge/build/livepatch/
          compression-level: 1



