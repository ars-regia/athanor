name: Kernel Bump

# The kernel bump bot (forge/specs/azoth/bump.py, spec section 8). Two groups, one pull
# request each, because they are verified differently (doc_build_ordering.md, O7 and O8):
# kernel: on a GitHub runner, `bump.py apply --group kernel` compares the pins with Bodhi,
# the CachyOS releases, the NVIDIA tags and the Fedora registry, moves the FROM lines of the
# kernel's Containerfiles and regenerates the NVIDIA lock of a pin it moves; when nothing
# changed it stops here. prep: on the self-hosted runner, inside the builder, regenerates the
# hash manifests for the new pins and runs `build.sh --stage prep` (signatures, patches,
# config gate): the outcome goes into the PR, green or red. pr: opens the PR (label
# kernel-bump) and, only when prep is green and no NVIDIA lock moved, enables its
# auto-merge, which waits for the checks the branch protection requires: `gate` of pr.yml (the
# kernel check runs there once, doc_ci.md CP4) and "Spec gate" until the specs half of CP4.
# system: `bump.py apply --group system` moves the FROM lines of system/Containerfile (the
# quay.io base-atomic base) and regenerates an NVIDIA lock whose packages the repository
# republished, then opens its PR (label system-bump): System Image Check builds the images
# against the published kernel and, when they are green and the PR has only the bot's shape,
# merges it once the required checks pass (forge/scripts/bot_merge.py). One open PR per group:
# an open kernel-bump PR holds the kernel group only, an
# open system-bump PR the system group only, which then just verifies the NVIDIA locks
# (bump.py verify) and fails when one must be regenerated, instead of skipping. Every run,
# whatever happened before, the system job mirrors the RPMs of both NVIDIA locks to
# $KERNEL_REGISTRY/athanor-nvidia-rpms (system/nvidia/mirror.sh, doc_system_image.md S7), so an
# image build outlives the vendor repositories; the kernel job mirrors a lock it regenerated.
# The two groups may pin fedora:43 at different digests until both PRs merge. A rare
# overlap is accepted: an NVIDIA pin move in an open kernel PR and a republished lock of the
# old version in the system group edit the same lock, and the second PR to merge conflicts
# on it, visibly. `schedule` only works from
# the default branch; by hand on any branch; and on a push of this file: a change to the
# bot exercises it right away, and that is how GitHub registers the workflow outside the
# default branch, where workflow_dispatch alone does not make it runnable.

on:
  # Group kernel weekly on Monday, group system every day (ADR-0109): a kernel bump costs
  # the hour-long kernel build twice, a base image bump does not touch the kernel.
  schedule:
    - cron: "17 5 * * 1"
    - cron: "17 5 * * 0,2-6"
  workflow_dispatch:
  push:
    branches: [main, iso-v0]
    paths:
      - .github/workflows/kernel-bump.yml

concurrency:
  group: kernel-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  kernel:
    if: ${{ github.event.schedule != '17 5 * * 0,2-6' }}
    runs-on: ubuntu-24.04
    # Regenerating an NVIDIA lock downloads about 325 MB of RPMs, and mirroring them as much.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KERNEL_REGISTRY: ${{ vars.KERNEL_REGISTRY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: One open kernel bump PR at a time
        id: open
        run: |
          set -euo pipefail
          open=$(gh pr list --label kernel-bump --state open --json number --jq 'map("#\(.number)") | join(", ")')
          [[ -z $open ]] || echo "kernel bump PR ${open} is open: the kernel group waits until it is closed" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "open=${open}" >> "$GITHUB_OUTPUT"

      - name: Run bump.py apply --group kernel
        id: bump
        if: ${{ steps.open.outputs.open == '' }}
        run: |
          set -euo pipefail
          python3 forge/specs/azoth/bump.py apply --group kernel > body.md
          changed=false
          [[ -z $(git status --porcelain -- forge/specs/azoth system/nvidia/locks) ]] || changed=true
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          { echo "## kernel bump: $([[ $changed == true ]] && echo "new pins" || echo "pins unchanged")"; echo; cat body.md; } >> "$GITHUB_STEP_SUMMARY"
          git status --short -- forge/specs/azoth system/nvidia/locks

      - if: ${{ steps.bump.outputs.changed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bump-pins
          path: |
            body.md
            forge/specs/azoth/pins.env
            forge/specs/azoth/KERNEL.md
            forge/specs/azoth/builder/Containerfile
            forge/specs/azoth/boot/Containerfile
            forge/specs/azoth/nvidia/Containerfile
            system/nvidia/locks/open.lock
            system/nvidia/locks/legacy.lock
          if-no-files-found: error

      - if: ${{ steps.bump.outputs.changed == 'true' }}
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.1

      - name: Mirror the RPMs of the NVIDIA locks
        if: ${{ steps.bump.outputs.changed == 'true' }}
        run: bash system/nvidia/mirror-locks.sh

  prep:
    needs: kernel
    if: ${{ needs.kernel.outputs.changed == 'true' }}
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bump-pins

      - name: Toolchain lock for the new pins
        # Each lock resolved again only when its inputs moved: base, package list, pinned SRPM (lock.sh).
        run: bash forge/specs/azoth/lock.sh generate

      - name: Build the kernel builder image
        env:
          BUILDAH_ISOLATION: chroot
        run: podman build -t localhost/azoth-builder -f forge/specs/azoth/builder/Containerfile forge/specs/azoth

      - name: Manifests for the new pins
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/azoth"
          builder() {
            podman run --rm \
              -v "$GITHUB_WORKSPACE:/forge" \
              -v "$HOME/.cache/azoth:/var/cache/azoth" \
              -w /forge localhost/azoth-builder "$@"
          }
          builder bash forge/specs/azoth/build.sh --stage manifest --out /forge/manifest/kernel
          builder bash forge/specs/azoth/nvidia.sh manifest --out /forge/manifest/nvidia
          cp manifest/kernel/sources.sha256 forge/specs/azoth/SOURCES/sources.sha256
          cp manifest/nvidia/sources.sha256 forge/specs/azoth/nvidia/sources.sha256
          git diff --stat -- forge/specs/azoth

      - name: Prep (signatures, patches, config gate)
        # Green or red, the outcome and the derived options end up in the PR body: the PR
        # opens anyway and the Kernel Build gate keeps it red until a human decides.
        run: |
          set -euo pipefail
          mkdir -p out
          outcome=ok
          if ! podman run --rm \
                 -v "$GITHUB_WORKSPACE:/forge" \
                 -v "$HOME/.cache/azoth:/var/cache/azoth" \
                 -w /forge localhost/azoth-builder \
                 bash forge/specs/azoth/build.sh --stage prep --out /forge/out > prep.log 2>&1; then
            outcome=FAIL
            if grep -q '^build.sh: refresh needed: ' prep.log; then outcome=REFRESH; fi
          fi
          echo "$outcome" > prep-outcome
          {
            echo; echo "## prep: ${outcome}"; echo
            if [[ $outcome == REFRESH ]]; then
              # shellcheck disable=SC2016
              echo 'A CachyOS patch no longer applies without fuzz. On this branch run `build.sh --stage refresh --out DIR` in the builder, as in `forge/specs/azoth/KERNEL.md`, review the hunks GNU patch applied with fuzz, commit the copy under `forge/specs/azoth/patches/refreshed/` and merge by hand (doc_kernel_build.md, section 8). This PR does not merge by itself.'
              echo; echo '```'; grep '^build.sh: refresh needed: ' prep.log; echo '```'
            fi
            if [[ $outcome != ok ]]; then
              echo '```'; tail -n 40 prep.log; echo '```'
            fi
            if grep -q '^derived options: ' prep.log; then
              echo "<details><summary>$(grep '^derived options: ' prep.log) (listnewconfig with the CachyOS values)</summary>"
              echo; echo '```'
              sed -n '/^derived options: /,/^>>> /{/^derived options: /d;/^>>> /d;p}' prep.log
              echo '```'; echo "</details>"
            fi
          } > prep.md
          cat prep.md >> "$GITHUB_STEP_SUMMARY"
          echo "prep: ${outcome}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bump-prep
          path: |
            prep.md
            prep.log
            prep-outcome
            forge/specs/azoth/SOURCES/sources.sha256
            forge/specs/azoth/nvidia/sources.sha256
            forge/specs/azoth/builder/toolchain.lock
            forge/specs/azoth/boot/schbench.lock
            forge/specs/azoth/boot/toolchain.lock
            forge/specs/azoth/nvidia/toolchain.lock
          if-no-files-found: error

  pr:
    needs: [kernel, prep]
    if: ${{ needs.kernel.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # A PAT: PRs opened with the GITHUB_TOKEN do not trigger the checks.
      GH_TOKEN: ${{ secrets.KERNEL_BUMP_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.KERNEL_BUMP_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: bump-*
          merge-multiple: true

      - name: Branch, commit, PR (auto-merge only on a green prep that moves no NVIDIA lock)
        run: |
          set -euo pipefail
          git add forge/specs/azoth system/nvidia/locks
          keys=$(git diff --cached -U0 -- forge/specs/azoth/pins.env | sed -n 's/^+\([A-Z_]\+\)=.*/\1/p')
          git diff --cached --quiet -- 'forge/specs/azoth/*/Containerfile' || keys+=${keys:+$'\n'}"builder base image"
          git diff --cached --quiet -- 'forge/specs/azoth/*/*.lock' || keys+=${keys:+$'\n'}"kernel package locks"
          git diff --cached --quiet -- system/nvidia/locks || keys+=${keys:+$'\n'}"NVIDIA locks"
          # A new NVIDIA lock changes the packages of the image: a person merges
          # (doc_system_image.md, section 4).
          reviewed=false
          git diff --cached --quiet -- system/nvidia/locks || reviewed=true
          title="chore(kernel): bump $(paste -sd, - <<< "$keys" | sed 's/,/, /g')"
          outcome=$(cat prep-outcome)
          [[ $outcome != REFRESH ]] || title+=" (patch refresh needed)"
          branch="bump/kernel-$(date -u +%Y%m%d-%H%M)"
          git config user.name "athanor-bump"
          git config user.email "kernel@athanor.os"
          git checkout -b "$branch"
          git commit -q -m "$title" -m "Opened by the bump bot (kernel-bump.yml, spec section 8)."
          git push -u origin "$branch"
          cat body.md prep.md > pr.md
          if [[ $reviewed == true ]]; then
            printf '\n## Merge\n\nThis bump moves an NVIDIA pin and its lock. Kernel Build and a human review decide the merge. No auto-merge.\n' >> pr.md
          fi
          url=$(gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --label kernel-bump --title "$title" --body-file pr.md)
          if [[ $reviewed == true ]]; then
            echo "PR: ${url} (NVIDIA lock moved: no auto-merge, a human review decides)" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ $outcome == ok ]]; then
            gh pr merge --auto --squash "$url"
            echo "PR: ${url} (auto-merge once the required checks are green)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "PR: ${url} (prep ${outcome}: no auto-merge, a person merges after fixing it)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  system:
    runs-on: ubuntu-24.04
    # Regenerating both NVIDIA locks downloads about 650 MB of RPMs, and mirroring them as much.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KERNEL_REGISTRY: ${{ vars.KERNEL_REGISTRY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # A PAT: PRs opened with the GITHUB_TOKEN do not trigger the checks.
          token: ${{ secrets.KERNEL_BUMP_TOKEN }}

      - name: One open system bump PR at a time
        id: open
        run: |
          set -euo pipefail
          open=$(gh pr list --label system-bump --state open --json number --jq 'map("#\(.number)") | join(", ")')
          [[ -z $open ]] || echo "system bump PR ${open} is open: only the NVIDIA locks are verified until it is closed" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "open=${open}" >> "$GITHUB_OUTPUT"

      - name: Verify the NVIDIA locks while a system bump PR is open
        if: ${{ steps.open.outputs.open != '' }}
        env:
          OPEN_PR: ${{ steps.open.outputs.open }}
        run: |
          set -euo pipefail
          if ! python3 forge/specs/azoth/bump.py verify; then
            echo "::error::an NVIDIA lock must be regenerated and the bot opens no system PR while ${OPEN_PR} is open: merge or close ${OPEN_PR}"
            exit 1
          fi

      - name: Run bump.py apply --group system
        id: bump
        if: ${{ steps.open.outputs.open == '' }}
        run: |
          set -euo pipefail
          python3 forge/specs/azoth/bump.py apply --group system > body.md
          changed=false
          [[ -z $(git status --porcelain -- system/Containerfile system/nvidia/locks) ]] || changed=true
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          { echo "## system bump: $([[ $changed == true ]] && echo "new base or locks" || echo "unchanged")"; echo; cat body.md; } >> "$GITHUB_STEP_SUMMARY"
          git status --short -- system/Containerfile system/nvidia/locks

      - if: ${{ !cancelled() }}
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.1

      # Before the PR: System Image Check on it builds the images from the mirror.
      - name: Mirror the RPMs of the NVIDIA locks
        if: ${{ !cancelled() }}
        run: bash system/nvidia/mirror-locks.sh

      - name: Branch, commit, PR (merged by System Image Check when green)
        if: ${{ steps.bump.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.KERNEL_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          git add system/Containerfile system/nvidia/locks
          keys=''
          git diff --cached --quiet -- system/Containerfile || keys="system base image"
          git diff --cached --quiet -- system/nvidia/locks || keys+=${keys:+, }"NVIDIA locks"
          title="chore(system): bump ${keys}"
          branch="bump/system-$(date -u +%Y%m%d-%H%M)"
          git config user.name "athanor-bump"
          git config user.email "kernel@athanor.os"
          git checkout -b "$branch"
          git commit -q -m "$title" -m "Opened by the bump bot (kernel-bump.yml, system group)."
          git push -u origin "$branch"
          {
            cat body.md
            printf '\n## Merge\n\nThis bump changes the packages of the system image. System Image Check builds the three images against the published kernel; when they are green and the change has only the shape of this bot (new digests on existing FROM lines, new RPM lines in the locks), it merges this PR once the required checks pass (forge/scripts/bot_merge.py). The package difference is in its summary. Any other change waits for a person.\n'
          } > pr.md
          url=$(gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --label system-bump --title "$title" --body-file pr.md)
          echo "PR: ${url} (merged once System Image Check is green)" | tee -a "$GITHUB_STEP_SUMMARY"
