name: Kernel Bump

# The kernel bump bot (forge/specs/azoth/bump.py, spec section 8).
# check: on a GitHub runner, bump.py compares the pins with Bodhi, the CachyOS releases,
# the NVIDIA tags and the Fedora registry; it also moves the system base (quay.io base-atomic
# in system/Containerfile) and verifies each NVIDIA lock against its repository metadata,
# regenerating it when the packages changed; when nothing changed it stops here. prep: on
# the self-hosted runner, inside the builder, regenerates the hash manifests for the new
# pins and runs `build.sh --stage prep` (signatures, patches, config gate): the outcome
# goes into the PR, green or red. pr: opens the PR with the regenerated files and, only
# when prep is green, enables its auto-merge; the check required by the branch protection
# is "Kernel gate" of Kernel Build. A bump that moves system/Containerfile or an NVIDIA lock
# never auto-merges: System Image Check and a human review decide. One open bump PR at a time. `schedule` only works from
# the default branch; by hand on any branch; and on a push of this file: a change to the
# bot exercises it right away, and that is how GitHub registers the workflow outside the
# default branch, where workflow_dispatch alone does not make it runnable.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main, iso-v0]
    paths:
      - .github/workflows/kernel-bump.yml

concurrency:
  group: kernel-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # Regenerating both NVIDIA locks downloads about 650 MB of RPMs.
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: One open bump PR at a time
        id: open
        run: |
          set -euo pipefail
          open=$(gh pr list --label kernel-bump --state open --json number --jq 'length')
          [[ $open -eq 0 ]] || echo "a bump PR is already open: nothing to do until it is closed" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "open=${open}" >> "$GITHUB_OUTPUT"

      - name: Run bump.py apply
        id: bump
        if: ${{ steps.open.outputs.open == '0' }}
        run: |
          set -euo pipefail
          python3 forge/specs/azoth/bump.py apply > body.md
          changed=false
          [[ -z $(git status --porcelain -- forge/specs/azoth system/Containerfile system/nvidia/locks) ]] || changed=true
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          { echo "## bump: $([[ $changed == true ]] && echo "new pins" || echo "pins unchanged")"; echo; cat body.md; } >> "$GITHUB_STEP_SUMMARY"
          git status --short -- forge/specs/azoth system/Containerfile system/nvidia/locks

      - if: ${{ steps.bump.outputs.changed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bump-pins
          path: |
            body.md
            forge/specs/azoth/pins.env
            forge/specs/azoth/KERNEL.md
            forge/specs/azoth/builder/Containerfile
            forge/specs/azoth/boot/Containerfile
            forge/specs/azoth/nvidia/Containerfile
            system/Containerfile
            system/nvidia/locks/open.lock
            system/nvidia/locks/legacy.lock
          if-no-files-found: error

  prep:
    needs: check
    if: ${{ needs.check.outputs.changed == 'true' }}
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bump-pins

      - name: Build the kernel builder image
        env:
          BUILDAH_ISOLATION: chroot
        run: podman build -t localhost/azoth-builder forge/specs/azoth/builder

      - name: Manifests for the new pins
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/azoth"
          builder() {
            podman run --rm \
              -v "$GITHUB_WORKSPACE:/forge" \
              -v "$HOME/.cache/azoth:/var/cache/azoth" \
              -w /forge localhost/azoth-builder "$@"
          }
          builder bash forge/specs/azoth/build.sh --stage manifest --out /forge/manifest/kernel
          builder bash forge/specs/azoth/nvidia.sh manifest --out /forge/manifest/nvidia
          cp manifest/kernel/sources.sha256 forge/specs/azoth/SOURCES/sources.sha256
          cp manifest/nvidia/sources.sha256 forge/specs/azoth/nvidia/sources.sha256
          git diff --stat -- forge/specs/azoth

      - name: Prep (signatures, patches, config gate)
        # Green or red, the outcome and the derived options end up in the PR body: the PR
        # opens anyway and the Kernel Build gate keeps it red until a human decides.
        run: |
          set -euo pipefail
          mkdir -p out
          outcome=ok
          if ! podman run --rm \
                 -v "$GITHUB_WORKSPACE:/forge" \
                 -v "$HOME/.cache/azoth:/var/cache/azoth" \
                 -w /forge localhost/azoth-builder \
                 bash forge/specs/azoth/build.sh --stage prep --out /forge/out > prep.log 2>&1; then
            outcome=FAIL
            if grep -q '^build.sh: refresh needed: ' prep.log; then outcome=REFRESH; fi
          fi
          echo "$outcome" > prep-outcome
          {
            echo; echo "## prep: ${outcome}"; echo
            if [[ $outcome == REFRESH ]]; then
              # shellcheck disable=SC2016
              echo 'A CachyOS patch no longer applies without fuzz. On this branch run `build.sh --stage refresh --out DIR` in the builder, as in `forge/specs/azoth/KERNEL.md`, review the hunks GNU patch applied with fuzz, commit the copy under `forge/specs/azoth/patches/refreshed/` and merge by hand (doc_kernel_build.md, section 8). This PR does not merge by itself.'
              echo; echo '```'; grep '^build.sh: refresh needed: ' prep.log; echo '```'
            fi
            if [[ $outcome != ok ]]; then
              echo '```'; tail -n 40 prep.log; echo '```'
            fi
            if grep -q '^derived options: ' prep.log; then
              echo "<details><summary>$(grep '^derived options: ' prep.log) (listnewconfig with the CachyOS values)</summary>"
              echo; echo '```'
              sed -n '/^derived options: /,/^>>> /{/^derived options: /d;/^>>> /d;p}' prep.log
              echo '```'; echo "</details>"
            fi
          } > prep.md
          cat prep.md >> "$GITHUB_STEP_SUMMARY"
          echo "prep: ${outcome}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bump-prep
          path: |
            prep.md
            prep.log
            prep-outcome
            forge/specs/azoth/SOURCES/sources.sha256
            forge/specs/azoth/nvidia/sources.sha256
          if-no-files-found: error

  pr:
    needs: [check, prep]
    if: ${{ needs.check.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # A PAT: PRs opened with the GITHUB_TOKEN do not trigger the checks.
      GH_TOKEN: ${{ secrets.KERNEL_BUMP_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.KERNEL_BUMP_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: bump-*
          merge-multiple: true

      - name: Branch, commit, PR (auto-merge only on a green prep that leaves the system image alone)
        run: |
          set -euo pipefail
          git add forge/specs/azoth system/Containerfile system/nvidia/locks
          keys=$(git diff --cached -U0 -- forge/specs/azoth/pins.env | sed -n 's/^+\([A-Z_]\+\)=.*/\1/p')
          git diff --cached --quiet -- 'forge/specs/azoth/*/Containerfile' system/Containerfile || keys+=${keys:+$'\n'}"base image"
          git diff --cached --quiet -- system/nvidia/locks || keys+=${keys:+$'\n'}"NVIDIA locks"
          # A new system base or NVIDIA lock changes the packages of the image: System Image
          # Check reports the difference and a person merges (doc_system_image.md, section 4).
          reviewed=false
          git diff --cached --quiet -- system/Containerfile system/nvidia/locks || reviewed=true
          title="chore(kernel): bump $(paste -sd, - <<< "$keys" | sed 's/,/, /g')"
          outcome=$(cat prep-outcome)
          [[ $outcome != REFRESH ]] || title+=" (patch refresh needed)"
          branch="bump/kernel-$(date -u +%Y%m%d-%H%M)"
          git config user.name "athanor-bump"
          git config user.email "kernel@athanor.os"
          git checkout -b "$branch"
          git commit -q -m "$title" -m "Opened by the bump bot (kernel-bump.yml, spec section 8)."
          git push -u origin "$branch"
          cat body.md prep.md > pr.md
          if [[ $reviewed == true ]]; then
            printf '\n## Merge\n\nThis bump moves the system base image or an NVIDIA lock. System Image Check and a human review decide the merge: the package difference is in the summary of that check. No auto-merge.\n' >> pr.md
          fi
          url=$(gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --label kernel-bump --title "$title" --body-file pr.md)
          if [[ $reviewed == true ]]; then
            echo "PR: ${url} (system base or NVIDIA lock moved: no auto-merge, System Image Check and a human review decide)" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ $outcome == ok ]]; then
            gh pr merge --auto --squash "$url"
            echo "PR: ${url} (auto-merge once the Kernel gate check is green)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "PR: ${url} (prep ${outcome}: no auto-merge, a person merges after fixing it)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
