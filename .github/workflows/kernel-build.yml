name: Kernel Build

# The Athanor kernel (forge/specs/azoth, docs/architecture/doc_kernel_build.md).
# build: on the self-hosted runner, `prep` (sources, patches, config gate) in a few
# minutes or `build` (RPMs) in about an hour. boot: on a GitHub runner with KVM, the boot
# matrix (SeaBIOS and OVMF with Secure Boot, Nehalem and host CPUs) with the assertions
# of the spec. publish: on a GitHub runner, publishes the RPMs as four OCI images
# (kernel, devel, debuginfo, and the MicroVM guest kernel as the <nvr>-microvm tag of the
# kernel) signed with cosign keyless, with SBOM, SLSA provenance and the attestation of
# the pins; `:latest` moves only on the repository's default branch. kmod: the NVIDIA modules against the freshly
# built kernel-devel (nvidia-build.yml, reusable). gate: the single "Kernel gate" check
# that the branch protection requires on PRs, including those of the bump bot (phase
# K5): that is why the workflow runs on every PR, with no path filter. A PR builds and
# boots but does not publish. orchestrator: on pushes, downstream of publish, dispatches the
# Athanor Forge Orchestrator for this commit with force_image when a new kernel was published
# or system/kernel-artifacts.sh does not answer ready; the Orchestrator calls nvidia-kmod.yml
# (signing, boot with Secure Boot, publication of the modules) and builds the system images
# (docs/architecture/doc_build_ordering.md, O1). inputs:
# when the image with this NVR already carries the attestation of identical build
# inputs, build and publish do not run, and the boot matrix and kmod use the published
# images.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "prep: sources, patches and config gate. build: the RPMs and the publication as well."
        type: choice
        options: [prep, build]
        default: build
  pull_request:
  push:
    branches: [main, iso-v0]
    paths:
      - forge/specs/azoth/**
      - .github/workflows/kernel-build.yml
      - .github/workflows/nvidia-build.yml

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STAGE: ${{ inputs.stage || 'build' }}
  # The one knob system/kernel-artifacts.sh itself reads (default ghcr.io/<owner>,
  # lowercased there, never recomputed here): every job below that needs an image
  # reference asks the script for it (system/kernel-artifacts.sh registry), so a
  # repository variable override can never diverge between what this workflow pushes
  # to and what resolve() verifies against elsewhere in the chain (doc_build_ordering.md,
  # O9).
  KERNEL_REGISTRY: ${{ vars.KERNEL_REGISTRY }}

jobs:
  inputs:
    # A kernel already built from these identical inputs is not rebuilt: the `<nvr>`
    # image carries the attestation of the pins (build-inputs.py), verified with cosign;
    # when the predicate matches the one of this commit, the reuse is proven.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      nvr: ${{ steps.key.outputs.nvr }}
      reuse: ${{ steps.key.outputs.reuse }}
      kernel_digest: ${{ steps.artifacts.outputs.kernel_digest }}
      devel_digest: ${{ steps.artifacts.outputs.devel_digest }}
      registry: ${{ steps.artifacts.outputs.registry }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Registry (system/kernel-artifacts.sh)
        run: echo "IMAGE=$(bash system/kernel-artifacts.sh registry)/azoth" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - id: key
        run: |
          set -euo pipefail
          # The same NVR that rpmbuild produces with `%buildid .azoth` (build.sh);
          # publish checks that they match.
          nvr=$(bash forge/specs/azoth/nvr.sh)
          python3 forge/specs/azoth/build-inputs.py > inputs.json
          reuse=false
          if cosign verify-attestation --type custom \
               --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/" \
               --certificate-oidc-issuer https://token.actions.githubusercontent.com \
               "${IMAGE}:${nvr}" 2> /dev/null \
             | jq -cS '.payload | @base64d | fromjson | .predicate.Data | fromjson' \
             | grep -qxF "$(jq -cS . inputs.json)"; then
            # Identical inputs: reuse only when all four images are signed. publish may
            # have stopped after the push and before the signatures.
            reuse=true
            for ref in "${IMAGE}:${nvr}" "${IMAGE}:${nvr}-microvm" "${IMAGE}-devel:${nvr}" "${IMAGE}-debuginfo:${nvr}"; do
              cosign verify \
                --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" > /dev/null 2>&1 \
                || { echo "${ref} is not signed: build required"; reuse=false; }
            done
          fi
          echo "kernel ${nvr}: $([[ $reuse == true ]] && echo "image published from identical inputs, no build" || echo "build required")" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "nvr=${nvr}" >> "$GITHUB_OUTPUT"
          echo "reuse=${reuse}" >> "$GITHUB_OUTPUT"

      - name: Digest of the reused kernel and kernel-devel (system/kernel-artifacts.sh)
        # The kmod gate builds against the published azoth-devel by digest, never by tag;
        # the boot job below pulls the kernel-core the same way.
        id: artifacts
        if: ${{ steps.key.outputs.reuse == 'true' }}
        run: |
          set -euo pipefail
          bash system/kernel-artifacts.sh resolve
          grep -E '^(kernel_digest|devel_digest|registry)=' kernel-artifacts/kernel-artifacts.env >> "$GITHUB_OUTPUT"

  build:
    needs: inputs
    # The self-hosted runner executes only code of this repository: a pull request from a
    # fork never reaches it, so its gate stays red until the branch is pushed here.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && ((inputs.stage || 'build') == 'prep' || needs.inputs.outputs.reuse != 'true') }}
    runs-on: self-hosted
    # A full kernel with kCFI: about an hour on 16 cores.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build the kernel builder image
        # Rootless podman on the WSL runner has no systemd session: crun cannot create
        # the scope of the build container ("sd-bus call: Access denied"). The chroot
        # isolation of buildah is the one the other workflows already use.
        env:
          BUILDAH_ISOLATION: chroot
        run: podman build -t localhost/azoth-builder -f forge/specs/azoth/builder/Containerfile forge/specs/azoth

      - name: Run build.sh
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/azoth" out
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/forge" \
            -v "$HOME/.cache/azoth:/var/cache/azoth" \
            -w /forge localhost/azoth-builder \
            bash forge/specs/azoth/build.sh --stage "$STAGE" --out /forge/out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-${{ env.STAGE }}
          path: out/
          if-no-files-found: error

      - name: Artifact for the boot matrix
        # The boot job only needs vmlinuz (the kernel-core, 21 MB instead of 1.3 GB) and
        # the guest kernel package.
        if: ${{ env.STAGE == 'build' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-boot
          path: |
            out/kernel/kernel-core-*.rpm
            out/microvm/*.rpm
          if-no-files-found: error

      - name: Artifact for the NVIDIA modules
        # The kmod job only needs the kernel-devel.
        if: ${{ env.STAGE == 'build' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-devel
          path: out/devel/kernel-devel-[0-9]*.rpm
          if-no-files-found: error

  boot:
    needs: [inputs, build]
    # Also when build is skipped for reuse: the matrix always runs.
    if: ${{ !cancelled() && (inputs.stage || 'build') == 'build' && needs.inputs.result == 'success' && (needs.build.result == 'success' || needs.inputs.outputs.reuse == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ needs.inputs.outputs.reuse != 'true' }}
        with:
          name: kernel-boot
          path: out

      - name: Kernel-core and the guest kernel from the published images
        if: ${{ needs.inputs.outputs.reuse == 'true' }}
        env:
          NVR: ${{ needs.inputs.outputs.nvr }}
          KERNEL_DIGEST: ${{ needs.inputs.outputs.kernel_digest }}
        run: |
          set -euo pipefail
          IMAGE=$(bash system/kernel-artifacts.sh registry)/azoth
          mkdir -p out
          # The kernel-core is pulled by the digest the inputs job already resolved and
          # verified, so a republish of azoth:<nvr> between inputs and here cannot boot a
          # different kernel than the one whose reuse was proven. The MicroVM guest kernel
          # has no digest in kernel-artifacts.env (system/kernel-artifacts.sh resolves only
          # azoth and azoth-devel, not the -microvm tag), so it stays pulled by tag.
          for ref in "${IMAGE}@${KERNEL_DIGEST}" "${IMAGE}:${NVR}-microvm"; do
            ctr=$(podman create "${ref}" /kernel)
            podman cp "${ctr}:/." out/ && podman rm "$ctr" > /dev/null
          done
          ls out

      - uses: ./.github/actions/kvm

      - name: Build the boot-matrix image
        env:
          BUILDAH_ISOLATION: chroot
        run: podman build -t localhost/azoth-boot -f forge/specs/azoth/boot/Containerfile forge/specs/azoth

      - name: Run boot.sh
        # Four boots: {SeaBIOS, OVMF+Secure Boot via shim} x {Nehalem, host}, each one
        # must end with `K3 RESULT ok` on the serial console (assertions in boot/init).
        run: |
          set -euo pipefail
          mkdir -p boot-out
          podman run --rm --device /dev/kvm -v "$GITHUB_WORKSPACE:/forge" -w /forge localhost/azoth-boot bash forge/specs/azoth/boot.sh --rpms /forge/out --out /forge/boot-out

      - name: Run microvm/boot.sh
        # The guest kernel (spec, section 9): the vmlinux of the package boots in
        # Firecracker with a test rootfs and ends with `K6 RESULT ok` (assertions in
        # microvm/init).
        run: |
          set -euo pipefail
          podman run --rm --device /dev/kvm -v "$GITHUB_WORKSPACE:/forge" -w /forge localhost/azoth-boot bash forge/specs/azoth/microvm/boot.sh --rpms /forge/out --out /forge/boot-out/microvm

      - name: Summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          for f in boot-out/summary.md boot-out/microvm/summary.md; do
            if [[ -f $f ]]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        # Even when the matrix fails, but only if boot.sh wrote something.
        if: ${{ always() && hashFiles('boot-out/**') != '' }}
        with:
          name: kernel-boot-logs
          path: boot-out/
          if-no-files-found: error

  kmod:
    # The NVIDIA modules (spec, section 7, gate 4) against this kernel: the freshly
    # built kernel-devel artifact, or the published image when the kernel is reused.
    needs: [inputs, build]
    if: ${{ !cancelled() && (inputs.stage || 'build') == 'build' && needs.inputs.result == 'success' && (needs.build.result == 'success' || needs.inputs.outputs.reuse == 'true') }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/nvidia-build.yml
    with:
      devel-artifact: ${{ needs.inputs.outputs.reuse != 'true' && 'kernel-devel' || '' }}
      devel-digest: ${{ needs.inputs.outputs.devel_digest }}
      registry: ${{ needs.inputs.outputs.registry }}

  gate:
    # The single check required by the branch protection: green only when every gate is
    # green, or skipped because the kernel is reused (build). One name to wait for, for
    # the auto-merge of the bump bot.
    name: Kernel gate
    needs: [inputs, build, boot, kmod]
    if: ${{ always() && (inputs.stage || 'build') == 'build' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
      REUSE: ${{ needs.inputs.outputs.reuse }}
    steps:
      - run: |
          set -euo pipefail
          jq -r 'to_entries[] | "- \(.key): \(.value.result)"' <<< "$RESULTS" | tee -a "$GITHUB_STEP_SUMMARY"
          result() { jq -r --arg job "$1" '.[$job].result' <<< "$RESULTS"; }
          [[ $(result inputs) == success && $(result boot) == success && $(result kmod) == success ]]
          [[ $(result build) == success || ( $(result build) == skipped && $REUSE == true ) ]]

  publish:
    needs: [inputs, build, boot]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (inputs.stage || 'build') == 'build' && needs.build.result == 'success' && needs.boot.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Registry (system/kernel-artifacts.sh)
        run: echo "IMAGE=$(bash system/kernel-artifacts.sh registry)/azoth" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kernel-build
          path: out

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26

      - name: Publish the four OCI images
        id: publish
        # A scratch image holding only the RPMs of each group, digests in digests/; the
        # guest kernel is an <nvr>-microvm tag of the same package as the kernel. The OCI
        # labels bind the image to the commit and the NVR; the full pins go into the
        # attestation (next step).
        env:
          BUILDAH_ISOLATION: chroot
          NVR_EXPECTED: ${{ needs.inputs.outputs.nvr }}
          # `:latest` follows the default branch, whatever it is called (re-audit decision 11).
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          nvr=$(cat out/nvr)
          [[ $nvr == "$NVR_EXPECTED" ]] || { echo "NVR built ${nvr}, expected from the pins ${NVR_EXPECTED}"; exit 1; }
          echo "${GH_TOKEN}" | buildah login -u "${GITHUB_ACTOR}" --password-stdin "${IMAGE%%/*}"
          mkdir -p digests
          for group in kernel devel debuginfo microvm; do
            case $group in
              kernel) repo=$IMAGE tag=$nvr latest=latest ;;
              microvm) repo=$IMAGE tag="${nvr}-microvm" latest=latest-microvm ;;
              *) repo="${IMAGE}-${group}" tag=$nvr latest=latest ;;
            esac
            ctr=$(buildah from scratch)
            buildah copy "$ctr" "out/${group}/" /
            buildah config \
              --label org.opencontainers.image.title="azoth ${group}" \
              --label org.opencontainers.image.version="${nvr}" \
              --label org.opencontainers.image.revision="${GITHUB_SHA}" \
              --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              "$ctr"
            buildah commit --omit-timestamp "$ctr" "${repo}:${tag}"
            buildah push --digestfile "digests/${group}" "${repo}:${tag}"
            if [[ $GITHUB_REF == "refs/heads/${DEFAULT_BRANCH}" ]]; then
              buildah push "${repo}:${tag}" "docker://${repo}:${latest}"
            fi
            echo "${repo}@$(cat "digests/${group}")"
            echo "${group}=$(cat "digests/${group}")" >> "$GITHUB_OUTPUT"
          done

      - name: SBOM, sign, attest
        # cosign keyless with the OIDC identity of the workflow: signature, SPDX SBOM of
        # every image, and the pins as a custom predicate. The images contain .rpm files,
        # not an rpmdb: the RPM archive cataloger of syft is not among the defaults for
        # images, and without it the SBOM lists zero packages. cosign does not read the
        # auth.json of buildah: its own login uploads signatures and attestations to the
        # registry.
        run: |
          set -euo pipefail
          export SYFT_REGISTRY_AUTH_AUTHORITY="${IMAGE%%/*}"
          echo "${GH_TOKEN}" | cosign login "${IMAGE%%/*}" -u "${GITHUB_ACTOR}" --password-stdin
          mkdir -p sbom
          python3 forge/specs/azoth/build-inputs.py > pins.json
          # The RPM every image must contain: an SBOM that does not list it is empty
          # (without the RPM archive cataloger syft sees nothing).
          declare -A SBOM_PACKAGE=([kernel]=kernel-core [devel]=kernel-devel [debuginfo]=kernel-debuginfo [microvm]=azoth-microvm)
          for group in kernel devel debuginfo microvm; do
            repo=$IMAGE
            [[ $group == kernel || $group == microvm ]] || repo="${IMAGE}-${group}"
            ref="${repo}@$(cat "digests/${group}")"
            syft scan "registry:${ref}" --select-catalogers "+rpm-archive-cataloger" -o "spdx-json=sbom/${group}.spdx.json"
            jq -e --arg name "${SBOM_PACKAGE[$group]}" '[.packages[] | select(.name == $name)] | length > 0' "sbom/${group}.spdx.json" > /dev/null \
              || { echo "SBOM of ${group} lacks package ${SBOM_PACKAGE[$group]}"; exit 1; }
            cosign sign --yes "$ref"
            cosign attest --yes --type spdxjson --predicate "sbom/${group}.spdx.json" "$ref"
            cosign attest --yes --type custom --predicate pins.json "$ref"
          done
        env:
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Provenance SLSA (kernel)
        # In the GitHub attestation store, not in the registry: `gh attestation verify`
        # reads from there, and without untagged referrers the retention stays exact.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.kernel }}

      - name: Retention (retention.sh)
        # Before the gate: the verification proves what is left in the registry. The
        # releases stay (all of them for kernel and devel, two for the debuginfo) with
        # what is reachable from them: the `sha256-<hex>` referrers index and the cosign
        # bundles it lists.
        run: bash forge/specs/azoth/retention.sh

      - name: Verify (gate K2)
        run: |
          set -euo pipefail
          ref="${IMAGE}@$(cat digests/kernel)"
          cosign verify \
            --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" > /dev/null
          cosign verify-attestation --type spdxjson \
            --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" > /dev/null
          gh attestation verify "oci://${ref}" --repo "${GITHUB_REPOSITORY}"
          echo "verified: $ref"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-attestations
          path: |
            sbom/
            pins.json
            digests/
          if-no-files-found: error

  orchestrator:
    # The kernel is published or reused: the Orchestrator owns the chain from here (modules,
    # then images). A dispatch, because workflow_run only fires from the default branch. A
    # push that published nothing and leaves the artifacts ready (a document under the kernel
    # directory) costs no image cycle.
    needs: [inputs, boot, kmod, publish]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.boot.result == 'success' && needs.kmod.result == 'success' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.inputs.outputs.reuse == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Resolve the kernel artifacts (system/kernel-artifacts.sh)
        # Only when publish did not just succeed: its answer cannot change the dispatch
        # decision below in that case (publish succeeding already forces the dispatch), so
        # skipping it here means a transient registry or Rekor error does not cost the
        # freshly published kernel its dispatch. Skipped, steps.artifacts.outputs.state is
        # empty, and empty != 'ready' keeps the dispatch condition true.
        if: ${{ needs.publish.result != 'success' }}
        id: artifacts
        run: |
          set -euo pipefail
          bash system/kernel-artifacts.sh resolve
          grep -E '^state=' kernel-artifacts/kernel-artifacts.env >> "$GITHUB_OUTPUT"

      - name: Dispatch the Orchestrator
        if: ${{ needs.publish.result == 'success' || steps.artifacts.outputs.state != 'ready' }}
        run: gh workflow run athanor-forge-orchestrator.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f sha="$GITHUB_SHA" -f force_image=true
