name: Kernel Weekly

# Reproducibility and benchmark of the kernel (forge/specs/azoth; spec section 3 step
# 8 and section 7, gates 5 and 6; phase K7). repro: on the self-hosted runner, rebuilds
# the published pin with an empty cache and a freshly built builder and compares it with
# the published OCI (repro.py: config, System.map, vmlinux section by section, unsigned
# modules); a difference beyond the trace of the ephemeral signing key is a red job, a
# bug to open. variant: on request, the same build with a fragment from variants/ (o3:
# -O3 instead of -O2) for the A/B comparison. bench: on a GitHub runner with KVM, the
# published kernel and the variant, if any, in QEMU with hackbench, schbench, fio and
# netperf (bench.sh); the results accumulate across runs and bench-report.py turns them
# into tables and charts in the summary. Nothing is blocked by it: it is the number that
# decided -O2 (2026-09-05) and decides future options. `schedule` only works from the
# default branch; `push` on this very file registers the workflow on the branch (without
# it workflow_dispatch answers 404 outside the default branch) and exercises its bench
# job.

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:
    inputs:
      repro:
        description: "rebuild the pin and compare it with the published image"
        type: boolean
        default: true
      bench:
        description: "benchmark of the published kernel in QEMU/KVM"
        type: boolean
        default: true
      variant:
        description: "variant (variants/<name>) to build and compare in the benchmark"
        type: choice
        options: [none, o3]
        default: none
  push:
    branches: [main, iso-v0]
    paths:
      - .github/workflows/kernel-weekly.yml

concurrency:
  group: kernel-weekly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/azoth

jobs:
  repro:
    if: ${{ github.event_name == 'schedule' || inputs.repro }}
    runs-on: self-hosted
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build the kernel builder image
        env:
          BUILDAH_ISOLATION: chroot
        run: podman build -t localhost/azoth-builder -f forge/specs/azoth/builder/Containerfile forge/specs/azoth

      - name: Rebuild the pinned kernel with an empty cache (B)
        # Fresh cache: every source is downloaded and verified again, as on the first build.
        # Under RUNNER_TEMP, not /tmp: only the runner's work disk carries the SELinux label
        # (container_file_t) that lets the builder container write to a bind mount.
        run: |
          set -euo pipefail
          cache=$(mktemp -d -p "$RUNNER_TEMP")
          mkdir -p out-b
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/forge" \
            -v "$cache:/var/cache/azoth" \
            -w /forge localhost/azoth-builder \
            bash forge/specs/azoth/build.sh --stage build --out /forge/out-b

      - name: Published kernel (A)
        # Always from the registry: a local copy of the image could be an earlier build
        # with the same tag.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          nvr=$(bash forge/specs/azoth/nvr.sh)
          [[ $(cat out-b/nvr) == "$nvr" ]] || { echo "rebuilt NVR $(cat out-b/nvr), published ${nvr}"; exit 1; }
          echo "${GH_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          trap 'podman logout ghcr.io' EXIT
          podman pull "${IMAGE}:${nvr}"
          ctr=$(podman create "${IMAGE}:${nvr}" /kernel)
          mkdir -p out-a && podman cp "${ctr}:/." out-a/ && podman rm "$ctr" > /dev/null
          ls out-a

      - name: Compare (repro.py)
        run: |
          set -euo pipefail
          rc=0
          podman run --rm -v "$GITHUB_WORKSPACE:/forge" -w /forge localhost/azoth-builder \
            python3 forge/specs/azoth/repro.py --a /forge/out-a --b /forge/out-b --out /forge/repro-out || rc=$?
          cat repro-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && hashFiles('repro-out/**') != '' }}
        with:
          name: repro-report
          path: repro-out/
          if-no-files-found: error

      - name: Keep the rebuilt kernel-core and modules-core (B) for the diagnosis
        # Only when the comparison is red: A is in the registry, B would otherwise vanish
        # with the runner.
        if: ${{ failure() && hashFiles('out-b/kernel/kernel-core-*.rpm') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repro-b-rpms
          path: |
            out-b/kernel/kernel-core-*.rpm
            out-b/kernel/kernel-modules-core-*.rpm
          retention-days: 7
          if-no-files-found: error

  variant:
    if: ${{ inputs.variant != '' && inputs.variant != 'none' }}
    runs-on: self-hosted
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build the kernel builder image
        env:
          BUILDAH_ISOLATION: chroot
        run: podman build -t localhost/azoth-builder -f forge/specs/azoth/builder/Containerfile forge/specs/azoth

      - name: Run build.sh --variant
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/azoth" out-v
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/forge" \
            -v "$HOME/.cache/azoth:/var/cache/azoth" \
            -w /forge localhost/azoth-builder \
            bash forge/specs/azoth/build.sh --stage build --variant "$VARIANT" --out /forge/out-v
          cat out-v/nvr

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-variant
          path: out-v/kernel/kernel-core-*.rpm
          if-no-files-found: error

  bench:
    needs: variant
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.bench) && (needs.variant.result == 'success' || needs.variant.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: ./.github/actions/kvm

      - name: Build the boot-matrix image
        env:
          BUILDAH_ISOLATION: chroot
        run: podman build -t localhost/azoth-boot -f forge/specs/azoth/boot/Containerfile forge/specs/azoth

      - name: Published kernel
        run: |
          set -euo pipefail
          nvr=$(bash forge/specs/azoth/nvr.sh)
          podman pull "${IMAGE}:${nvr}"
          ctr=$(podman create "${IMAGE}:${nvr}" /kernel)
          mkdir -p out-a && podman cp "${ctr}:/." out-a/ && podman rm "$ctr" > /dev/null

      - if: ${{ needs.variant.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kernel-variant
          path: out-v

      - name: Run bench.sh
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          bench() { # bench RPMS OUT LABEL
            podman run --rm --device /dev/kvm -v "$GITHUB_WORKSPACE:/forge" -w /forge localhost/azoth-boot \
              bash forge/specs/azoth/bench.sh --rpms "/forge/$1" --out "/forge/bench-out/$2" --label "$3"
          }
          bench out-a published published
          if [[ -d out-v ]]; then bench out-v "variant-${VARIANT}" "$VARIANT"; fi

      - name: History and report
        # The results of the previous successful weekly runs on this branch, in run order,
        # plus this one: tables, A/B comparison and charts in the summary.
        run: |
          set -euo pipefail
          mkdir -p history
          for id in $(gh run list --workflow kernel-weekly.yml --status success --branch "$GITHUB_REF_NAME" --limit 30 --json databaseId --jq '.[].databaseId' | sort -n); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts" --jq '.artifacts[].name' | grep -qx bench-results; then
              gh run download "$id" -n bench-results -D "history/$id"
            fi
          done
          mkdir -p "history/$GITHUB_RUN_ID" && cp -r bench-out/. "history/$GITHUB_RUN_ID/"
          python3 forge/specs/azoth/bench-report.py history/* | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && hashFiles('bench-out/**') != '' }}
        with:
          name: bench-results
          path: bench-out/
          if-no-files-found: error
