name: Reusable DAG Compile Workflow

on:
  workflow_call:
    inputs:
      dag_packages:
        description: 'JSON array of the dirty custom packages, built in one matrix'
        type: string
        required: false
        default: '[]'
      builder_hash:
        description: 'Content hash of builder container'
        type: string
        required: false
        default: 'latest'

env:
  # The registry host is the REGISTRY_HOST repository variable (default ghcr.io), the owner
  # the repository's: the same knob forge-ghcr-cleanup.yml and promote-stable.yml read.
  REGISTRY: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
  BUILDER_IMAGE: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}/${{ github.repository_owner }}/athanor-builder:${{ inputs.builder_hash }}
  FEDORA_VERSION: 43
  SCCACHE_CACHE_SIZE: 10G

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # No lint job of its own: the Orchestrator, its only caller, runs call-lint.yml once and
  # calls this workflow only after it passed (docs/architecture/doc_pipeline.md, PL44).
  # One matrix over every dirty package: builds run with rpmbuild --nodeps and none reads
  # another's output, so levels only made packages wait (docs/architecture/doc_pipeline.md,
  # PL48).
  dag-build:
    if: inputs.dag_packages != '[]' && inputs.dag_packages != ''
    name: ⚡ Package Build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: forge
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        package: ${{ fromJson(inputs.dag_packages) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ❄️ Install Nix (Bedrock Cache)
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Check Idempotency (GHCR Cache)
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          PKG_NAME: ${{ matrix.package }}
        run: bash scripts/dag_package.sh check

      - name: Extreme Rust Cache (LLVM & Dependencies)
        if: steps.check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "sccache-${{ matrix.package }}"
          cache-on-failure: "true"

      - name: Cache sccache
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .sccache
          key: sccache-${{ matrix.package }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-${{ matrix.package }}-

      - name: Build Package (Custom Spec or Upstream SRPM)
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          PKG_NAME: ${{ matrix.package }}
          SCCACHE_CACHE_SIZE: 10G
        run: bash scripts/dag_package.sh build

      - name: Publish Micro-Container OCI
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          PKG_NAME: ${{ matrix.package }}
          CONTENT_HASH: ${{ steps.check.outputs.hash }}
        run: bash scripts/dag_package.sh publish

      - name: Generate SBOM (Syft)
        if: steps.check.outputs.skip != 'true'
        env:
          PKG_NAME: ${{ matrix.package }}
        run: bash scripts/dag_package.sh sbom

      - name: Sign & Attest Micro-Container
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ matrix.package }}
        run: |
          set -euo pipefail
          nix run nixpkgs#cosign -- login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          img_prefix="athanor-forge"
          if [ ! -d "specs/athanor-${PKG_NAME}" ] && [ ! -d "specs/${PKG_NAME}" ]; then
            img_prefix="athanor-forge-rolling"
          fi
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${img_prefix}-${PKG_NAME}" | tr '[:upper:]' '[:lower:]')@$(cat "$RUNNER_TEMP/image.digest")
          # Keyless signing talks to Fulcio, Rekor and the timestamp authority: the script
          # retries their transient failures, a persistent one still fails the job.
          nix shell nixpkgs#cosign -c bash scripts/sign_attest.sh "$IMAGE_LOWER" "sbom-${PKG_NAME}.spdx.json"

      - name: Publish the hash tag, last (the brain reads it as built, signed and attested)
        if: steps.check.outputs.skip != 'true'
        env:
          PKG_NAME: ${{ matrix.package }}
          CONTENT_HASH: ${{ steps.check.outputs.hash }}
        run: bash scripts/dag_package.sh tag

      - name: 🛟 Upload Crash Artifacts (Nix/SCCache)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-logs-${{ matrix.package }}
          path: |
            /tmp/nix-build*/
            RPMS/
            idemp.out

      - name: 🧹 Cleanup Workspace Permissions
        if: always()
        run: podman unshare chown -R "$USER:$USER" ${{ github.workspace }} || true

      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
