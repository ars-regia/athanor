        run: |
          set -euo pipefail
          export BUILDAH_ISOLATION=chroot
          img_prefix="athanor-forge"
          if [ ! -d "specs/athanor-${PKG_NAME}" ] && [ ! -d "specs/${PKG_NAME}" ]; then
            img_prefix="athanor-forge-rolling"
          fi
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${img_prefix}-${PKG_NAME}" | tr '[:upper:]' '[:lower:]')
          # A registry-side copy of the digest that was signed and attested, asserted to
