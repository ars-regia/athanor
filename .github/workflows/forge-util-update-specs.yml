name: ⚙️ Forge Auto-Update Specs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    working-directory: forge

jobs:
  update-specs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: bots
    steps:
      # A bots App installation token, not the GITHUB_TOKEN: it may not open pull requests,
      # and PRs it opened would start no checks. The action fails the job when the App id or the
      # key is missing or refused, so a missing credential is a red run, not one that pretends to work.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      # fetch_sources.sh --pin expands the Source URLs with rpmspec.
      - name: Install rpmspec
        run: sudo apt-get install -y --no-install-recommends rpm

      # The pull request this opens is built by Spec Build Check, which merges a bump that keeps
      # the leftmost non-zero version component (forge/scripts/bot_merge.py).
      - name: Update the watched specs (forge/scripts/zero_trust_updater.py)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/zero_trust_updater.py out/spec-updates.md

      - name: Create Pull Request
        if: hashFiles('forge/out/spec-updates.md') != ''
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(forge): update the watched specs to their latest upstream releases"
          title: "chore(forge): update the watched specs to their latest upstream releases"
          body-path: forge/out/spec-updates.md
          # The report stays out of the commit: the bot changes specs and their manifests only.
          add-paths: forge/specs/**
          branch: "chore/update-specs-zero-trust"
          base: ${{ github.ref_name }}
          delete-branch: true
