name: ⚙️ Forge Auto-Update Specs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    working-directory: forge

jobs:
  update-specs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # A PAT: the GITHUB_TOKEN may not open pull requests, and a silent fallback to it
      # is what made this workflow fail every night since September. Missing secret =
      # a red run with a message, not a run that pretends to work.
      - name: The token that opens the pull request
        # Before the checkout, so the job's working-directory (forge) does not exist yet.
        working-directory: ${{ github.workspace }}
        env:
          SPECS_UPDATE_TOKEN: ${{ secrets.SPECS_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n ${SPECS_UPDATE_TOKEN} ]] || {
            echo "SPECS_UPDATE_TOKEN is not set: this workflow opens a pull request and the" >&2
            echo "default token is not allowed to. Create a fine-grained token with contents" >&2
            echo "and pull-requests write on this repository and store it as that secret." >&2
            exit 1
          }

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.SPECS_UPDATE_TOKEN }}

      # fetch_sources.sh --pin expands the Source URLs with rpmspec.
      - name: Install rpmspec
        run: sudo apt-get install -y --no-install-recommends rpm

      # The pull request this opens is built by Spec Build Check, which arms auto-merge for a
      # bump that keeps the leftmost non-zero version component (forge/scripts/bot_automerge.sh).
      - name: Update the watched specs (forge/scripts/zero_trust_updater.py)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/zero_trust_updater.py out/spec-updates.md

      # GitHub keeps auto-merge armed across the bot's pushes: off before the new head lands,
      # Spec Build Check arms it again once that head is built.
      - name: Turn off auto-merge on the open update pull request
        if: hashFiles('forge/out/spec-updates.md') != ''
        env:
          GH_TOKEN: ${{ secrets.SPECS_UPDATE_TOKEN }}
        run: bash scripts/bot_automerge.sh disarm chore/update-specs-zero-trust

      - name: Create Pull Request
        if: hashFiles('forge/out/spec-updates.md') != ''
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.SPECS_UPDATE_TOKEN }}
          commit-message: "chore(forge): update the watched specs to their latest upstream releases"
          title: "chore(forge): update the watched specs to their latest upstream releases"
          body-path: forge/out/spec-updates.md
          # The report stays out of the commit: the bot changes specs and their manifests only.
          add-paths: forge/specs/**
          branch: "chore/update-specs-zero-trust"
          base: ${{ github.ref_name }}
          delete-branch: true
