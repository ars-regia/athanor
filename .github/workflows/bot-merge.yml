name: Bot Merge

# Merges the pull requests of the spec bot and of the system bump bot once their check ran
# green (forge/scripts/bot_merge.py). It is a workflow of its own, started by workflow_run,
# because GitHub runs a workflow_run workflow from the default branch's file: the private key of
# the `bots` environment is reachable only from a workflow file on iso-v0 or main, never from one
# a pull request edits. The merge is made with a bots App token, so that it triggers the push
# workflows and the Orchestrator publishes what merged.
#
# Spec Build Check and System Image Check each run on the pull request itself. The run of
# Spec Build Check that pr.yml calls is part of the run of pr.yml, not a run of its own, so it
# starts nothing here.

on:
  workflow_run:
    workflows: [Spec Build Check, System Image Check]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  merge:
    # The bot branch of each workflow only, whatever the check's outcome: bot_merge.py merges a
    # green pull request of the bot's shape at its head once the required checks pass, and
    # reports why it leaves any other. Fork runs get no secrets and are skipped here as well.
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && ((github.event.workflow_run.name == 'Spec Build Check'
      && github.event.workflow_run.head_branch == 'chore/update-specs-zero-trust')
      || (github.event.workflow_run.name == 'System Image Check'
      && startsWith(github.event.workflow_run.head_branch, 'bump/system-'))) }}
    runs-on: ubuntu-24.04
    environment: bots
    # It waits for the checks .github/settings/branch-protection.json requires before merging.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # A bots App installation token, not the GITHUB_TOKEN: a merge made with the
      # GITHUB_TOKEN triggers no push workflow, and the Orchestrator must publish what merged.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge a green pull request of the bot's shape (forge/scripts/bot_merge.py)
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ steps.app-token.outputs.token }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          kind=spec
          if [[ $WORKFLOW == "System Image Check" ]]; then kind=system; fi
          python3 forge/scripts/bot_merge.py "$kind" "$PR" "$SHA" "$BUILD"
