name: System Image Check

# Pull requests that change the system images build them on the self-hosted runner, with the
# UKI signed by a throwaway key and without pushing, and report the package delta of the
# default image against the published athanor-system (docs/architecture/doc_system_image.md,
# S2, S8, section 4). The gates of system/nvidia/gate.sh run inside the builds. Which images
# are built follows the kernel artifacts of the pull request's pins
# (docs/architecture/doc_build_ordering.md, O7): all three when they are ready; only the
# default image, with a warning, for a pure NVIDIA pin bump whose modules are not published
# yet; none, with a warning, for a pure kernel pin bump; any other pull request with missing
# artifacts fails. system/kernel-artifacts.sh decides on a GitHub runner, which has skopeo and
# cosign; the build job reads its file.

on:
  pull_request:
    paths:
      - system/**
      - forge/config/packages.json
      # The check installs the athanor-base-config RPM published in tier0:latest, not the spec
      # of the pull request.
      - forge/specs/athanor-base-config/**
      - forge/specs/athanor-secure-boot/SOURCES/**
      - forge/specs/azoth/pins.env
      - forge/specs/azoth/nvr.sh
      - forge/scripts/retry.sh
      - .containerignore
      - .github/workflows/system-image-check.yml

permissions:
  contents: read
  packages: read

concurrency:
  group: system-image-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kernel-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The same knob every other caller of system/kernel-artifacts.sh sets
      # (docs/architecture/doc_build_ordering.md, O9): a repository variable override must
      # reach this resolution too, or it would see kernel-missing forever.
      KERNEL_REGISTRY: ${{ vars.KERNEL_REGISTRY }}
    outputs:
      check_delta: ${{ steps.plan.outputs.check_delta }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The merge commit and its first parent, the base: check-plan reads the diff between them.
          fetch-depth: 2

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Kernel artifacts and the check plan (system/kernel-artifacts.sh)
        id: plan
        run: |
          set -euo pipefail
          bash system/kernel-artifacts.sh resolve
          bash system/kernel-artifacts.sh check-plan --base HEAD^1 --head HEAD
          grep -E '^check_delta=' kernel-artifacts/kernel-artifacts.env >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-artifacts
          path: kernel-artifacts/kernel-artifacts.env
          if-no-files-found: error

  build:
    needs: kernel-artifacts
    # The self-hosted runner executes only code of this repository: a pull request from a
    # fork never reaches it.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    # A KVM guest created per job, whose podman storage lives on the cache disk that persists
    # across jobs (scripts/runner/runner.env): builds pull with --pull=newer, and the last
    # step removes the images of this job.
    runs-on: self-hosted
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reclaim what earlier jobs left on the cache disk
        # The podman storage lives on the cache disk, which outlives this guest, so the
        # leftovers of earlier jobs pile up there: images, and the containers buildah
        # leaves behind, which podman calls external and which hold those images. They are
        # cleared here, before this job builds anything, because at this point nothing in
        # the storage belongs to a build in flight and a failure is a real problem.
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # The containers buildah leaves behind are external to podman: they hold images
          # and `system prune --external` walks away from the ones an interrupted build
          # left locked, so they are removed by name before the images are pruned.
          mapfile -t stale < <(podman ps --all --external --format '{{.ID}}')
          [[ ${#stale[@]} -eq 0 ]] || podman rm --force "${stale[@]}"
          podman system prune --force --all
          df -h /var/lib/runner/cache

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kernel-artifacts
          path: kernel-artifacts

      - name: Login to GHCR
        # system/Containerfile binds ghcr.io/<owner>/athanor-forge-tier{0..3}-repo:latest and
        # pulls the azoth-nvidia modules by digest: the build needs a registry session before it
        # starts, not only the delta step at the end.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build the planned images (throwaway UKI key)
        # The runner guest's system disk is small, and podman stages downloads and build copies
        # in TMPDIR (default /var/tmp); TMPDIR points to the job's temp directory on the scratch disk.
        # Which GPUs to build, none, one or all three, follows the kernel artifacts of this pull
        # request's pins (system/kernel-artifacts.sh check-plan, O7): an empty list is a pure
        # kernel pin bump, and the loop below then builds nothing.
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          gpus=$(bash system/kernel-artifacts.sh get check_gpus)
          for gpu in $gpus; do
            bash system/build-image.sh --gpu "$gpu" --registry localhost --tag check
          done

      - name: Package delta of the default image
        if: ${{ needs.kernel-artifacts.outputs.check_delta == 'true' }}
        env:
          OWNER: ${{ github.repository_owner }}
          TMPDIR: ${{ runner.temp }}
        # tee: the job summary cannot be read through the REST API, the log can (gh run view --log).
        run: |
          set -euo pipefail
          bash system/package-delta.sh "ghcr.io/${OWNER,,}/athanor-system:latest" localhost/athanor-system:check | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove the images of this job
        if: always()
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # Only what this job tagged: the storage keeps the rest until the next job prunes
          # it on the way in, because a build that is still running holds images no prune
          # can take, and this step must not end a green check with a housekeeping error.
          for name in athanor-system athanor-system-nvidia athanor-system-nvidia-legacy; do
            if podman image exists "localhost/$name:check"; then podman rmi --force "localhost/$name:check"; fi
          done

  merge:
    needs: build
    # The system bump bot's pull requests only, whatever the build's outcome: forge/scripts/bot_merge.py
    # merges a green one of the bot's shape at its head once the required checks pass, and
    # reports why it leaves any other. The script is the base branch's copy; the workflow
    # file, as for any same-repository pull_request, is the pull request's own, and forks get
    # no secrets.
    if: ${{ always() && startsWith(github.head_ref, 'bump/system-') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    # It waits for the required checks (Kernel gate) before merging.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.base_ref }}

      - name: Merge a green system bump of the bot's shape (forge/scripts/bot_merge.py)
        env:
          # A PAT: a merge made with the GITHUB_TOKEN triggers no push workflow, and the
          # Orchestrator must publish what merged.
          GH_TOKEN: ${{ secrets.KERNEL_BUMP_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BUILD: ${{ needs.build.result }}
        run: python3 forge/scripts/bot_merge.py system "$PR" "$SHA" "$BUILD"
