name: System Image Check

# Pull requests that change the system images build them on a GitHub runner, the same way the
# pipeline does (no key reaches a build, D43) but without pushing, and report the package delta of the
# default image against the published athanor-system (docs/architecture/doc_system_image.md,
# S2, S8, section 4). The gates of system/nvidia/gate.sh run inside the builds. Which images
# are built follows the kernel artifacts of the pull request's pins
# (docs/architecture/doc_build_ordering.md, O7): all three when they are ready; only the
# default image, with a warning, for a pure NVIDIA pin bump whose modules are not published
# yet; none, with a warning, for a pure kernel pin bump; any other pull request with missing
# artifacts fails. system/kernel-artifacts.sh decides on a GitHub runner, which has skopeo and
# cosign; the build job reads its file.

on:
  pull_request:
    paths:
      # What the image build reads from system/: the Containerfile and the trees it copies,
      # and the scripts this workflow runs. The crates under system/ reach the image as
      # RPMs built after the merge, so a change to their sources cannot change this check.
      - system/Containerfile
      - system/nvidia/**
      - system/scripts/**
      - system/keys/**
      - system/build-image.sh
      - system/rechunk-image.sh
      - system/kernel-artifacts.sh
      - system/tier-digests.sh
      - system/package-delta.sh
      - forge/config/packages.json
      # The check installs the athanor-base-config RPM of the published tier 0, not the spec
      # of the pull request. The same holds for every forge package: a Containerfile change
      # that needs a newer package lands after that package is published, in a second pull
      # request (.github/workflows/AGENTS.md).
      - forge/specs/athanor-base-config/**
      - forge/specs/azoth/pins.env
      - forge/specs/azoth/nvr.sh
      - forge/scripts/retry.sh
      - .containerignore
      - .github/workflows/system-image-check.yml

permissions:
  contents: read
  packages: read

concurrency:
  group: system-image-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kernel-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The same knob every other caller of system/kernel-artifacts.sh sets
      # (docs/architecture/doc_build_ordering.md, O9): a repository variable override must
      # reach this resolution too, or it would see kernel-missing forever.
      KERNEL_REGISTRY: ${{ vars.KERNEL_REGISTRY }}
    outputs:
      check_delta: ${{ steps.plan.outputs.check_delta }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The merge commit and its first parent, the base: check-plan reads the diff between them.
          fetch-depth: 2

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Kernel artifacts and the check plan (system/kernel-artifacts.sh)
        id: plan
        run: |
          set -euo pipefail
          bash system/kernel-artifacts.sh resolve
          bash system/kernel-artifacts.sh check-plan --base HEAD^1 --head HEAD
          grep -E '^check_delta=' kernel-artifacts/kernel-artifacts.env >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-artifacts
          path: kernel-artifacts/kernel-artifacts.env
          if-no-files-found: error

  build:
    needs: kernel-artifacts
    # On a GitHub runner: the single self-hosted runner is kept for compiling the kernel.
    # The three images build in turn in one job, as the Orchestrator's dag-system-image does.
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kernel-artifacts
          path: kernel-artifacts

      - name: Login to GHCR
        # system/Containerfile binds the athanor-forge-tier{0..3}-repo images of the project registry and
        # pulls the azoth-nvidia modules by digest: the build needs a registry session before it
        # starts, not only the delta step at the end.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Tier repositories by digest (system/tier-digests.sh)
        # The published tiers, read once: every image of this job installs the same ones (UD28).
        run: bash system/tier-digests.sh resolve

      - name: Build the planned images
        # Which GPUs to build, none, one or all three, follows the kernel artifacts of this pull
        # request's pins (system/kernel-artifacts.sh check-plan, O7): an empty list is a pure
        # kernel pin bump, which builds nothing. As in the pipeline, the system stage is built
        # once and rechunked (UD32), and every planned image is built FROM the rechunked one.
        run: |
          set -euo pipefail
          gpus=$(bash system/kernel-artifacts.sh get check_gpus)
          [[ -n $gpus ]] || exit 0
          bash system/build-image.sh --system --registry localhost --iidfile system-image.iid
          bash system/rechunk-image.sh system-image.iid
          for gpu in $gpus; do
            bash system/build-image.sh --gpu "$gpu" --registry localhost --tag check --system-image "$(<system-image.iid)"
          done

      - name: Package delta of the default image
        if: ${{ needs.kernel-artifacts.outputs.check_delta == 'true' }}
        env:
          OWNER: ${{ github.repository_owner }}
        # tee: the job summary cannot be read through the REST API, the log can (gh run view --log).
        run: |
          set -euo pipefail
          bash system/package-delta.sh "ghcr.io/${OWNER,,}/athanor-system:latest" localhost/athanor-system:check | tee -a "$GITHUB_STEP_SUMMARY"

  merge:
    needs: build
    # The system bump bot's pull requests only, whatever the build's outcome: forge/scripts/bot_merge.py
    # merges a green one of the bot's shape at its head once the required checks pass, and
    # reports why it leaves any other. The script is the base branch's copy; the workflow
    # file, as for any same-repository pull_request, is the pull request's own, and forks get
    # no secrets.
    if: ${{ always() && startsWith(github.head_ref, 'bump/system-') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    # The job's own token reads the pull request and the Kernel Build runs; the App token only merges.
    environment: bots
    permissions:
      actions: read
      contents: read
      pull-requests: read
    # It waits for the checks .github/settings/branch-protection.json requires before merging.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.base_ref }}

      # A bots App installation token, not the GITHUB_TOKEN: a merge made with the
      # GITHUB_TOKEN triggers no push workflow, and the Orchestrator must publish what merged.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge a green system bump of the bot's shape (forge/scripts/bot_merge.py)
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BUILD: ${{ needs.build.result }}
        run: python3 forge/scripts/bot_merge.py system "$PR" "$SHA" "$BUILD"
