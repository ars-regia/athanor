name: ISO Acceptance

# Installs a published Athanor ISO in a virtual machine, restarts into what was
# installed, logs in at the greeter that came up, and reports whether a desktop session
# followed. It answers the one question the build cannot: not whether an ISO was
# produced, but whether it installs a system that starts and can be logged into.
#
# The Orchestrator calls it after every system image build on the release branch, because
# its verdict is the acceptance evidence that system/promote.sh requires before :stable may
# move (docs/architecture/doc_update_trust.md, D1); it also runs weekly and on request. The
# evidence counts only as a keyless cosign attestation on each image digest, made by the
# attest job below, which runs only on the release branch (repository variable
# RELEASE_BRANCH, default iso-v0) for a push, a schedule or a dispatch, never for a pull
# request, and holds the only OIDC token of the workflow; the job that boots the system
# under test has none. promote.sh checks the same from the certificate and the predicate.
# The evidence says the images work, not where they came from: a dispatch may name any
# published ISO, a branch build's included. promote.sh takes the images' origin from
# GitHub's record of the build run instead (an Orchestrator run of a trusted branch of this
# repository, completed with success, at the commit the images carry).
#
# The run itself is short. On a runner with KVM the install takes about eight minutes and the
# job about twelve, because the console ends the run as soon as it has an answer rather
# than waiting out a clock. What it produces is meant to be looked at: the console log,
# the verdict, and a screenshot every thirty seconds of both the installer and the first
# boot, published as an artifact. The assertion says the session started; the pictures say
# whether it started looking the way it should, and that judgement is a person's.
#
# The published ISO is used exactly as it ships, with its attended installer intact. The
# answers a person would give are handed to it on a second disk (forge/test/iso), so
# nothing inside the artifact under test is rewritten.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      iso_tag:
        description: "tag of athanor-iso to install: a run id, `latest`, or `newest` to resolve the most recent published one"
        type: string
        default: newest
  workflow_call:
    inputs:
      iso_tag:
        description: "tag of athanor-iso to install: the run id of the build that published it"
        type: string
        required: true
      skip_lint:
        description: "the caller has already run the lint workflow on this commit"
        type: boolean
        default: false
  push:
    branches: [main, iso-v0]
    paths:
      - .github/workflows/iso-acceptance.yml
      - forge/test/iso/**

concurrency:
  group: iso-acceptance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    if: ${{ !inputs.skip_lint }}
    uses: ./.github/workflows/call-lint.yml

  install:
    needs: [lint]
    if: ${{ !cancelled() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
      ISO_IMAGE: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}/${{ github.repository_owner }}/athanor-iso
      ISO_TAG: ${{ inputs.iso_tag || 'newest' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/kvm

      - name: 🧰 Install QEMU and the tools the run needs
        run: |
          set -euo pipefail
          # Refresh only Ubuntu's own index, which is where every package below comes
          # from. The runner image also carries third-party sources (Google Chrome,
          # Microsoft, ...) that nothing here installs, and apt-get update fails as a
          # whole when any one of them does: run 34383930627 was lost to a "Hash Sum
          # mismatch" on dl.google.com while Google was regenerating its index. The
          # fetch itself is retried like every other network access in this repository.
          bash forge/scripts/retry.sh sudo apt-get update \
            -o Dir::Etc::SourceList=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::SourceParts=/nonexistent
          sudo apt-get install --no-install-recommends -y \
            qemu-system-x86 qemu-utils ovmf e2fsprogs

      - name: 💽 Fetch the published ISO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | podman login "${REGISTRY_HOST}" -u "${{ github.actor }}" --password-stdin

          # `latest` is published only from main, so on a working branch it names nothing
          # and the pull fails with "manifest unknown". `newest` asks the registry for
          # the most recently published tag instead, which is what someone running this
          # on a branch means by "test the ISO we just built".
          #
          # The tags are the run id that produced each ISO, so the highest is the most
          # recent. `users/` and not `orgs/`: this repository belongs to an account, and
          # the organisation endpoint answers 404 for it.
          if [[ $ISO_TAG == newest ]]; then
            ISO_TAG=$(gh api "users/${GITHUB_REPOSITORY_OWNER}/packages/container/athanor-iso/versions" \
              --jq 'map(.metadata.container.tags[]) | map(select(test("^[0-9]+$"))) | max')
            [[ -n $ISO_TAG && $ISO_TAG != null ]] || { echo "no published athanor-iso tag to test" >&2; exit 1; }
            echo "resolved newest published ISO: ${ISO_TAG}"
          fi

          # The ISO ships inside a scratch image with one file in it, so a container of
          # that image is the only thing to unpack.
          podman pull "${ISO_IMAGE}:${ISO_TAG}"
          # The run and the system image digests the ISO was built from, and the digest of the
          # ISO image itself, for the evidence: attest.sh checks the build signed that digest.
          podman image inspect --format '{{json .Labels}}' "${ISO_IMAGE}:${ISO_TAG}" > iso-labels.json
          podman image inspect --format '{{.Digest}}' "${ISO_IMAGE}:${ISO_TAG}" > iso-digest.txt
          ctr=$(podman create "${ISO_IMAGE}:${ISO_TAG}" /bin/true)
          mkdir -p iso
          podman cp "${ctr}:/." iso/
          podman rm "$ctr" > /dev/null
          iso=$(find iso -name '*.iso' -type f | head -n 1)
          [[ -n $iso ]] || { echo "the published image contains no .iso" >&2; exit 1; }
          echo "ISO_PATH=${iso}" >> "${GITHUB_ENV}"
          echo "installing $(basename "$iso"), $(du -h "$iso" | cut -f1)"

      - name: 🖥️ Install unattended and restart into the system
        env:
          TIMEOUT: "1500"
          VCPUS: "4"
          MEMORY_MIB: "6144"
        run: bash forge/test/iso/run_iso_test.sh "${ISO_PATH}" ./iso-test

      # These two run after a failure as well, because a run that broke halfway is
      # exactly when its screenshots and console are worth having. They are conditioned
      # on the directory rather than made unconditional: a job that failed before the VM
      # ever started has nothing to convert or report, and a second error about a missing
      # file only buries the first one.
      - name: 🖼️ Convert the screenshots
        if: always() && hashFiles('iso-test/*.ppm') != ''
        run: python3 forge/test/iso/screenshots.py ./iso-test

      - name: 📋 Report
        if: always() && hashFiles('iso-test/verdict.md') != ''
        run: cat ./iso-test/verdict.md >> "${GITHUB_STEP_SUMMARY}"

      # The acceptance evidence, pass or fail, kept as a record and handed to the attest job.
      # A failure here (an ISO without the labels) fails the job: no evidence, no promotion.
      - name: 🧾 Write the acceptance evidence
        if: always() && hashFiles('iso-labels.json') != ''
        run: python3 forge/test/iso/evidence.py ./iso-test iso-labels.json "$(< iso-digest.txt)" ./evidence

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('evidence/acceptance-*.json') != ''
        with:
          # A record for people and the input of the attest job; promotion never reads it. The
          # attempt keeps a rerun from colliding with the evidence of the first attempt.
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/acceptance-*.json
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso-acceptance-${{ github.run_id }}
          path: |
            iso-test/*.png
            iso-test/serial.log
            iso-test/phases.txt
            iso-test/verdict.md
            iso-test/memory.json
          # A job that failed before the VM started has nothing to upload, and the empty
          # upload should not be a second error on top of the real one.
          if-no-files-found: ignore
          retention-days: 30

  attest:
    name: Attest the acceptance evidence
    needs: [install]
    # Only a passing run (the install job fails otherwise) of the release branch, started by a
    # push, a schedule or a dispatch on it. A called run carries the caller's event and ref,
    # so the Orchestrator's runs qualify on the same terms.
    if: >-
      github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH || 'iso-v0')
      && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
      REGISTRY: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}/${{ github.repository_owner }}
      RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'iso-v0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      # The artifact of this run's install job, by its exact name: no other run's file.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Log in to the registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: cosign login "${REGISTRY_HOST}" -u "${GITHUB_ACTOR}" -p "${GITHUB_TOKEN}"
      - name: Attest (forge/test/iso/attest.sh)
        run: bash forge/test/iso/attest.sh evidence/acceptance-*.json
