name: ISO Acceptance

# Installs a published Athanor ISO in a virtual machine, restarts into what was
# installed, logs in at the greeter that came up, and reports whether a desktop session
# followed. It answers the one question the build cannot: not whether an ISO was
# produced, but whether it installs a system that starts and can be logged into.
#
# It is deliberately not part of every orchestrator run: the build already takes half an
# hour and this adds a full install on top of it, so it runs weekly and on request. The
# run itself is short. On a runner with KVM the install takes about eight minutes and the
# job about twelve, because the console ends the run as soon as it has an answer rather
# than waiting out a clock. What it produces is meant to be looked at: the console log,
# the verdict, and a screenshot every thirty seconds of both the installer and the first
# boot, published as an artifact. The assertion says the session started; the pictures say
# whether it started looking the way it should, and that judgement is a person's.
#
# The published ISO is used exactly as it ships, with its attended installer intact. The
# answers a person would give are handed to it on a second disk (forge/test/iso), so
# nothing inside the artifact under test is rewritten.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      iso_tag:
        description: "tag of athanor-iso to install: a run id, `latest`, or `newest` to resolve the most recent published one"
        type: string
        default: newest
  push:
    branches: [main, iso-v0]
    paths:
      - .github/workflows/iso-acceptance.yml
      - forge/test/iso/**

concurrency:
  group: iso-acceptance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/call-lint.yml

  install:
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # uefi: the runner's OVMF, Secure Boot off. secure-boot: Fedora's Secure Boot OVMF with
    # the Athanor certificate in MokList (forge/test/iso/secureboot-firmware.sh); the run
    # passes only if the installed system reports Secure Boot enabled, so shim accepted
    # the kernel the sign-kernel job signed.
    strategy:
      fail-fast: false
      matrix:
        firmware: [uefi, secure-boot]
    permissions:
      contents: read
      packages: read
    env:
      ISO_IMAGE: ghcr.io/${{ github.repository_owner }}/athanor-iso
      ISO_TAG: ${{ inputs.iso_tag || 'newest' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/kvm

      - name: 🧰 Install QEMU and the tools the run needs
        run: |
          set -euo pipefail
          # Refresh only Ubuntu's own index, which is where every package below comes
          # from. The runner image also carries third-party sources (Google Chrome,
          # Microsoft, ...) that nothing here installs, and apt-get update fails as a
          # whole when any one of them does: run 34383930627 was lost to a "Hash Sum
          # mismatch" on dl.google.com while Google was regenerating its index. The
          # fetch itself is retried like every other network access in this repository.
          bash forge/scripts/retry.sh sudo apt-get update \
            -o Dir::Etc::SourceList=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::SourceParts=/nonexistent
          sudo apt-get install --no-install-recommends -y \
            qemu-system-x86 qemu-utils ovmf e2fsprogs

      - name: 💽 Fetch the published ISO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

          # `latest` is published only from main, so on a working branch it names nothing
          # and the pull fails with "manifest unknown". `newest` asks the registry for
          # the most recently published tag instead, which is what someone running this
          # on a branch means by "test the ISO we just built".
          #
          # The tags are the run id that produced each ISO, so the highest is the most
          # recent. `users/` and not `orgs/`: this repository belongs to an account, and
          # the organisation endpoint answers 404 for it.
          if [[ $ISO_TAG == newest ]]; then
            ISO_TAG=$(gh api "users/${GITHUB_REPOSITORY_OWNER}/packages/container/athanor-iso/versions" \
              --jq 'map(.metadata.container.tags[]) | map(select(test("^[0-9]+$"))) | max')
            [[ -n $ISO_TAG && $ISO_TAG != null ]] || { echo "no published athanor-iso tag to test" >&2; exit 1; }
            echo "resolved newest published ISO: ${ISO_TAG}"
          fi

          # The ISO ships inside a scratch image with one file in it, so a container of
          # that image is the only thing to unpack.
          podman pull "${ISO_IMAGE}:${ISO_TAG}"
          ctr=$(podman create "${ISO_IMAGE}:${ISO_TAG}" /bin/true)
          mkdir -p iso
          podman cp "${ctr}:/." iso/
          podman rm "$ctr" > /dev/null
          iso=$(find iso -name '*.iso' -type f | head -n 1)
          [[ -n $iso ]] || { echo "the published image contains no .iso" >&2; exit 1; }
          echo "ISO_PATH=${iso}" >> "${GITHUB_ENV}"
          echo "installing $(basename "$iso"), $(du -h "$iso" | cut -f1)"

      - name: 🔐 Secure Boot firmware with the Athanor certificate enrolled
        if: matrix.firmware == 'secure-boot'
        env:
          BUILDAH_ISOLATION: chroot
        run: |
          set -euo pipefail
          bash forge/test/iso/secureboot-firmware.sh secureboot-firmware
          echo "SECURE_BOOT_FIRMWARE=${GITHUB_WORKSPACE}/secureboot-firmware" >> "${GITHUB_ENV}"

      - name: 🖥️ Install unattended and restart into the system
        env:
          TIMEOUT: "1500"
          VCPUS: "4"
          MEMORY_MIB: "6144"
        run: bash forge/test/iso/run_iso_test.sh "${ISO_PATH}" ./iso-test

      # These two run after a failure as well, because a run that broke halfway is
      # exactly when its screenshots and console are worth having. They are conditioned
      # on the directory rather than made unconditional: a job that failed before the VM
      # ever started has nothing to convert or report, and a second error about a missing
      # file only buries the first one.
      - name: 🖼️ Convert the screenshots
        if: always() && hashFiles('iso-test/*.ppm') != ''
        run: python3 forge/test/iso/screenshots.py ./iso-test

      - name: 📋 Report
        if: always() && hashFiles('iso-test/verdict.md') != ''
        run: cat ./iso-test/verdict.md >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso-acceptance-${{ matrix.firmware }}-${{ github.run_id }}
          path: |
            iso-test/*.png
            iso-test/serial.log
            iso-test/phases.txt
            iso-test/verdict.md
          # A job that failed before the VM started has nothing to upload, and the empty
          # upload should not be a second error on top of the real one.
          if-no-files-found: ignore
          retention-days: 30
