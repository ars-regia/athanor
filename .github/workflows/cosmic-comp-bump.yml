name: cosmic-comp Bump

# Tracks Fedora's stable F43 build of cosmic-comp (forge/specs/cosmic-comp, bump.py cosmic-comp).
# Independent of the kernel bump: its own workflow, branch and PR, so a held cosmic-comp PR
# never blocks a kernel bump (EOL ones included) and a lookup failure here never stops it.
# The PR is never auto-merged and has no prep job: the DAG build is the gate (%autosetup -p1
# fails when the patch no longer applies) and a reviewer checks whether upstream merged it.
# `schedule` only works from the default branch; by hand on any branch; and on a push of this
# file, which is also how GitHub registers the workflow outside the default branch.

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
  push:
    branches: [main, iso-v0]
    paths:
      - .github/workflows/cosmic-comp-bump.yml

concurrency:
  group: cosmic-comp-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # A PAT: PRs opened with the GITHUB_TOKEN do not trigger the checks.
      GH_TOKEN: ${{ secrets.KERNEL_BUMP_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.KERNEL_BUMP_TOKEN }}

      - name: One open cosmic-comp bump PR at a time
        id: open
        run: |
          set -euo pipefail
          open=$(gh pr list --label cosmic-comp-bump --state open --json number --jq 'map("#\(.number)") | join(", ")')
          [[ -z $open ]] || echo "cosmic-comp bump PR ${open} is open: nothing to do until it is closed" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "open=${open}" >> "$GITHUB_OUTPUT"

      - name: Run bump.py cosmic-comp apply
        id: bump
        if: ${{ steps.open.outputs.open == '' }}
        run: |
          set -euo pipefail
          python3 forge/specs/azoth/bump.py cosmic-comp apply > body.md
          changed=false
          [[ -z $(git status --porcelain -- forge/specs/cosmic-comp) ]] || changed=true
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          { echo "## cosmic-comp: $([[ $changed == true ]] && echo "new build" || echo "unchanged")"; echo; cat body.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Branch, commit, PR (never auto-merged)
        if: ${{ steps.bump.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          git add forge/specs/cosmic-comp
          spec=forge/specs/cosmic-comp/cosmic-comp.spec
          nvr="$(sed -n 's/^Version:[[:space:]]*//p' "$spec")-$(sed -n 's/^%global fedora_release //p' "$spec")"
          title="chore(cosmic-comp): bump to ${nvr}"
          branch="bump/cosmic-comp-$(date -u +%Y%m%d-%H%M)"
          git config user.name "athanor-bump"
          git config user.email "kernel@athanor.os"
          git checkout -b "$branch"
          git commit -q -m "$title" -m "Opened by the bump bot (cosmic-comp-bump.yml)."
          git push -u origin "$branch"
          gh label create cosmic-comp-bump --force --description "Fedora cosmic-comp tracking" > /dev/null
          url=$(gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --label cosmic-comp-bump --title "$title" --body-file body.md)
          echo "PR: ${url} (no auto-merge: the DAG build and a review decide)" | tee -a "$GITHUB_STEP_SUMMARY"
