name: NVIDIA kmod build

# The NVIDIA kernel modules (forge/specs/azoth/nvidia.sh, spec section 10) against a
# kernel-devel, on a GitHub runner with the kernel toolchain image. Reusable workflow:
# Kernel Build calls it for the gate on PRs and pushes (the kernel-devel of the freshly
# built artifact, or of the published image when the kernel is reused) and NVIDIA kmod
# calls it for the signing and publication chain. A published kernel-devel is pulled by
# the digest system/kernel-artifacts.sh verified, from the registry it was verified against
# (docs/architecture/doc_build_ordering.md, O5), never by tag and never from a registry
# guessed separately from github.repository_owner. Uploads the nvidia-<branch>-unsigned
# artifacts.

on:
  workflow_call:
    inputs:
      devel-artifact:
        description: "artifact holding kernel-devel-*.rpm; empty: the published azoth-devel image named by devel-digest"
        type: string
        default: ""
      devel-digest:
        description: "digest of the published azoth-devel:<nvr>, required when devel-artifact is empty"
        type: string
        default: ""
      registry:
        description: "registry system/kernel-artifacts.sh resolved devel-digest against (get registry), required when devel-artifact is empty"
        type: string
        default: ""
    outputs:
      # The sha256sum lines of the modules each branch built, paths relative to the artifact
      # root. A job output, which no other job of the run can write, unlike an artifact: the
      # sign job of nvidia-kmod.yml signs nothing that is not listed here with this hash.
      manifest-open:
        value: ${{ jobs.build.outputs.manifest-open }}
      manifest-legacy:
        value: ${{ jobs.build.outputs.manifest-legacy }}

permissions:
  contents: read

jobs:
  build:
    # A GitHub runner: the single self-hosted runner is kept for compiling the kernel.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        driver: [open, legacy]
    # One output name per branch: each leg sets only its own, and an output a leg leaves empty
    # does not overwrite the other leg's value.
    outputs:
      manifest-open: ${{ steps.manifest.outputs.manifest-open }}
      manifest-legacy: ${{ steps.manifest.outputs.manifest-legacy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build the nvidia image
        env:
          BUILDAH_ISOLATION: chroot
        run: podman build -t localhost/azoth-nvidia -f forge/specs/azoth/nvidia/Containerfile forge/specs/azoth

      - name: Kernel-devel from the artifact
        if: ${{ inputs.devel-artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.devel-artifact }}
          path: devel

      - name: Kernel-devel from the published image, by digest
        # The caller resolved the digest with system/kernel-artifacts.sh. Login with the job
        # token: the package is public, but ghcr answers 403 to the anonymous token. Logout
        # at the end of the step, so no credentials are left.
        if: ${{ inputs.devel-artifact == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVEL_DIGEST: ${{ inputs.devel-digest }}
          REGISTRY: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          [[ $DEVEL_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "devel-digest is required when devel-artifact is empty, got '${DEVEL_DIGEST}'" >&2; exit 1; }
          [[ -n $REGISTRY ]] || { echo "registry is required when devel-artifact is empty" >&2; exit 1; }
          host=${REGISTRY%%/*}
          echo "${GH_TOKEN}" | podman login "$host" -u "${GITHUB_ACTOR}" --password-stdin
          trap 'podman logout "$host"' EXIT
          ctr=$(podman create "${REGISTRY}/azoth-devel@${DEVEL_DIGEST}" /kernel-devel)
          mkdir -p devel && podman cp "${ctr}:/." devel/ && podman rm "$ctr" > /dev/null

      - name: Run nvidia.sh build
        run: |
          set -euo pipefail
          ls devel
          mkdir -p "$HOME/.cache/azoth" out
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/forge" \
            -v "$HOME/.cache/azoth:/var/cache/azoth" \
            -w /forge localhost/azoth-nvidia \
            bash forge/specs/azoth/nvidia.sh build --driver "${{ matrix.driver }}" --devel /forge/devel --out /forge/out

      - name: Manifest of the modules built
        id: manifest
        env:
          DRIVER: ${{ matrix.driver }}
        run: |
          set -euo pipefail
          manifest=$(cd out && find "$DRIVER" -name '*.ko' -type f | sort | xargs -r sha256sum)
          [[ -n $manifest ]] || { echo "no module under out/$DRIVER" >&2; exit 1; }
          printf 'manifest-%s<<MANIFEST\n%s\nMANIFEST\n' "$DRIVER" "$manifest" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nvidia-${{ matrix.driver }}-unsigned
          path: out/
          if-no-files-found: error
