name: nixpkgs Registry Bump

# Moves the nixpkgs pin of the system flake registry (forge/specs/athanor-nix-support/bump.py):
# the head of the pinned release branch, and every six months the next release branch, from
# the 15th of the month after its release. Its own workflow, branch and PR, like the
# cosmic-comp bump; the PR is never auto-merged. `schedule` only works from the default
# branch; by hand on any branch; and on a push of this file, which is also how GitHub
# registers the workflow outside the default branch.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main, iso-v0]
    paths:
      - .github/workflows/nix-registry-bump.yml

concurrency:
  group: nix-registry-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: bots
    steps:
      # The default token, read-only and not persisted: bump.py needs no secret, and a step
      # that runs a downloaded archive through Python must not see the App token, which is
      # minted after it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Run bump.py apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 forge/specs/athanor-nix-support/bump.py apply "$RUNNER_TEMP/bump"

      # A bots App installation token, not the GITHUB_TOKEN: PRs opened with the
      # GITHUB_TOKEN start no checks. Minted per job from the key of the `bots` environment.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Branch, commit, PR (never auto-merged)
        env:
          # Only this step has the token; gh auth setup-git makes git push use it.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git
          forge/specs/azoth/open_bump_pr.sh nix-registry-bump bump/nixpkgs forge/specs/athanor-nix-support "$RUNNER_TEMP/bump" "$GITHUB_REF_NAME"

      - name: Upload what the bump wrote
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nix-registry-bump
          path: ${{ runner.temp }}/bump
          if-no-files-found: ignore
