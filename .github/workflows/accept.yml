name: Acceptance

# Installs the ISO of one build run in a virtual machine, restarts into what was
# installed, logs in at the greeter that came up, and reports whether a desktop session
# followed. It answers the one question the build cannot: not whether an ISO was
# produced, but whether it installs a system that starts and can be logged into.
#
# It is dispatched with the id of the build run whose ISO it tests, by hand or by
# release.yml (PB13), and writes the iso-acceptance evidence of UD4 for that run's
# athanor-system digest, on a pass and on a fail. The ISO is installed twice, one VM at a
# time: on plain UEFI firmware, then with Secure Boot enforced. Each case is short. On a
# runner with KVM an install takes about eight minutes and the job about twelve per case,
# because the console ends the run as soon as it has an answer rather than waiting out a
# clock. What
# it produces is meant to be looked at: the console log, the verdict, and a screenshot
# every thirty seconds of both the installer and the first boot, published as an
# artifact. The assertion says the session started; the pictures say whether it started
# looking the way it should, and that judgement is a person's.
#
# The published ISO is used exactly as it ships, with its attended installer intact. The
# answers a person would give are handed to it on a second disk (forge/test/iso), so
# nothing inside the artifact under test is rewritten.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the build run whose ISO is accepted"
        required: true
        type: string

concurrency:
  group: accept-${{ inputs.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    # Setup and fetch ~10, normal case 25 (TIMEOUT 1500 s), Secure Boot case 25, report ~15 spare.
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
      actions: read
    env:
      REGISTRY: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}/${{ github.repository_owner }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/kvm

      - name: 🧰 Install QEMU and the tools the run needs
        run: |
          set -euo pipefail
          # Refresh only Ubuntu's own index, which is where every package below comes
          # from. The runner image also carries third-party sources (Google Chrome,
          # Microsoft, ...) that nothing here installs, and apt-get update fails as a
          # whole when any one of them does: run 34383930627 was lost to a "Hash Sum
          # mismatch" on dl.google.com while Google was regenerating its index. The
          # fetch itself is retried like every other network access in this repository.
          bash forge/scripts/retry.sh sudo apt-get update \
            -o Dir::Etc::SourceList=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::SourceParts=/nonexistent
          sudo apt-get install --no-install-recommends -y \
            qemu-system-x86 qemu-utils ovmf e2fsprogs

      - name: 🔑 Log in to the registry
        # Before the resolve step: skopeo reads podman's auth file, and a private package
        # answers 401 without it, which would be recorded as a fail verdict.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | podman login "${REGISTRY%%/*}" -u "${{ github.actor }}" --password-stdin

      - name: 🎯 Resolve the run
        run: bash system/accept-target.sh "${BUILD_RUN_ID}" target

      - name: 💽 Fetch the ISO
        run: |
          set -euo pipefail

          # The ISO ships inside a scratch image with one file in it, so a container of
          # that image is the only thing to unpack.
          podman pull "$(<target/iso-ref)"
          ctr=$(podman create "$(<target/iso-ref)" /bin/true)
          mkdir -p iso
          podman cp "${ctr}:/." iso/
          podman rm "$ctr" > /dev/null
          iso=$(find iso -name '*.iso' -type f | head -n 1)
          [[ -n $iso ]] || { echo "the published image contains no .iso" >&2; exit 1; }
          echo "ISO_PATH=${iso}" >> "${GITHUB_ENV}"
          echo "installing $(basename "$iso"), $(du -h "$iso" | cut -f1)"

      - name: 🖥️ Install unattended and restart into the system
        env:
          # The 30 GiB disk is not needed once the verdict is written, and the second case
          # needs the space.
          REMOVE_DISK: "1"
          TIMEOUT: "1500"
          VCPUS: "4"
          MEMORY_MIB: "6144"
        run: bash forge/test/iso/run_iso_test.sh "${ISO_PATH}" ./iso-test

      # The same ISO again on firmware with Secure Boot enforced (#252, #145): the Athanor
      # certificate reaches MokList through the installer's request and MokManager, and the
      # verdict passes only when the installed system reports Secure Boot enabled and
      # enforced. After the first case, never beside it: one VM at a time on this runner. It
      # runs after a failed first case too, so a red run says whether Secure Boot also failed.
      - name: 🔒 Install again with Secure Boot enforced
        if: ${{ !cancelled() && env.ISO_PATH != '' }}
        env:
          SECURE_BOOT: "1"
          TIMEOUT: "1500"
          VCPUS: "4"
          MEMORY_MIB: "6144"
        run: bash forge/test/iso/run_iso_test.sh "${ISO_PATH}" ./iso-test-sb

      # These run after a failure as well, because a run that broke halfway is
      # exactly when its screenshots and console are worth having. They are conditioned
      # on the directory rather than made unconditional: a job that failed before the VM
      # ever started has nothing to convert or report, and a second error about a missing
      # file only buries the first one.
      - name: 📋 Convert the screenshots and report
        if: always()
        run: bash forge/test/iso/report.sh iso-test iso-test-sb

      - name: 🧾 Write the iso-acceptance evidence (UD4)
        # Pass and fail both leave evidence: promote.sh refuses a fail, and a missing file
        # would say nothing about why. Skipped only when the run never resolved a digest.
        if: always() && hashFiles('target/default-digest') != ''
        run: >-
          python3 -B scripts/ci/evidence.py write --gate iso-acceptance --image athanor-system
          --digest "$(<target/default-digest)" --run-id "${BUILD_RUN_ID}" --verdict-json iso-test/verdict.json iso-test-sb/verdict.json
          --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --out evidence

      - name: 📎 Hand the evidence to the promotion
        if: always() && hashFiles('evidence/*.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ inputs.run_id }}-iso-acceptance
          path: evidence/
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: acceptance-${{ inputs.run_id }}-${{ github.run_id }}
          path: |
            iso-test/*.png
            iso-test/serial.log
            iso-test/phases.txt
            iso-test/verdict.md
            iso-test/memory.json
            iso-test-sb/*.png
            iso-test-sb/serial.log
            iso-test-sb/phases.txt
            iso-test-sb/verdict.md
            iso-test-sb/memory.json
          # A job that failed before the VM started has nothing to upload, and the empty
          # upload should not be a second error on top of the real one.
          if-no-files-found: ignore
          retention-days: 30
