name: Publish the shell rig build image

# Builds the build stage of the shell rig, pushes it to the registry, pulls it back by digest,
# checks that it can be pulled without a login and opens a pull request that commits the full
# reference as forge/test/shell/build-image.digest
# (rig.sh then pulls the stage instead of building it). By hand only: the maintainer runs it
# when the build stage changes, and makes the package public the first time, since the hosted
# gate pulls it without a login. The digest travels between the jobs as a file.
on:
  workflow_dispatch:

concurrency:
  group: publish-rig-build-image
  cancel-in-progress: false

permissions: {}

env:
  ATHANOR_REGISTRY: ${{ vars.KERNEL_REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}

jobs:
  publish:
    name: Build, push and pull back by digest
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Branches only
        run: '[ "$GITHUB_REF_TYPE" = branch ] || { echo "run this workflow from a branch, not a tag" >&2; exit 1; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Registry login
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "${GH_TOKEN}" | podman login "${ATHANOR_REGISTRY%%/*}" -u "${GITHUB_ACTOR}" --password-stdin
      - name: Build and push the build stage
        run: |
          export ATHANOR_RIG_OUT="$RUNNER_TEMP/rig-out"
          bash forge/test/shell/rig.sh publish-build-image
      - name: Pull it back by digest
        run: |
          podman rmi --all --force > /dev/null
          podman pull "$(cat "$RUNNER_TEMP/rig-out/build-image.ref")"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rig-build-image-ref
          path: ${{ runner.temp }}/rig-out/build-image.ref
          if-no-files-found: error

  pin:
    name: Open the pull request that commits the digest
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The default token, read-only and not persisted: the PAT is only in the last step.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: rig-build-image-ref
          path: ${{ runner.temp }}/ref
      # No registry login in this job, as in the gate: fails until the package is public.
      - name: Pull the reference anonymously
        run: bash forge/test/shell/check_public.sh "$RUNNER_TEMP/ref/build-image.ref"
      - name: Write the pin and the pull request text
        run: python3 forge/test/shell/pin_build_image.py "$RUNNER_TEMP/ref/build-image.ref" "$RUNNER_TEMP/pr"
      - name: Branch, commit, PR (never auto-merged)
        env:
          # A PAT: PRs opened with the GITHUB_TOKEN start no checks.
          GH_TOKEN: ${{ secrets.KERNEL_BUMP_TOKEN }}
        run: |
          gh auth setup-git
          forge/specs/azoth/open_bump_pr.sh rig-build-image rig-build-image forge/test/shell/build-image.digest "$RUNNER_TEMP/pr" "$GITHUB_REF_NAME"
