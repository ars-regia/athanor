version: 2
updates:
  # One pull request a week per ecosystem: the minor and patch moves of each go together, and a
  # major move, which may break the build, keeps a pull request of its own.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        update-types: ["minor", "patch"]
    ignore:
      # accesskit_unix 0.24.1 requires accesskit_atspi_common 0.21.1, past the patched copy under
      # system/athanor-sal/vendor/ (#638); it moves when that copy's PATCHES.md entry goes.
      - dependency-name: "accesskit_unix"
        versions: [">=0.24.1"]
