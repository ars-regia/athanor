# Athanor's own one-time writes into COSMIC's files (the launcher's and the control center's,
# ADR-0150 point 6): the defaults above in COSMIC's form, which the import does not import.
[cosmic]
system_actions = { launcher = "gdbus call --session --dest os.athanor.Launcher1 --object-path /os/athanor/Launcher1 --method os.athanor.Launcher1.Show" }

[[cosmic.binding]]
keys = "Super+c"
action = "spawn"
command = "busctl --user call os.athanor.ControlCenter1 /os/athanor/ControlCenter1 os.athanor.ControlCenter1 Toggle"
