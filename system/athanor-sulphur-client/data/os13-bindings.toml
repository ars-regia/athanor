# The default key bindings of the own compositor (doc_own_stack.md OS13), in the form of
# bindings.toml (decision 38): the one copy that the import compares a user's COSMIC bindings
# with, and that a test of athanor-sulphur compares with DEFAULTS of src/bindings.rs both ways.
# The terminal switches, Ctrl+Alt+F1 to F12, are read from the keymap and are no rows.
schema = 1
# The keys no binding of the user's takes: the defaults no inhibitor takes (decision 30),
# Super+Alt+A (AX14). The terminal switches, Ctrl+Alt with F1 to F12, are protected as well.
protected = [
    "Super+Escape",
    "Super+Alt+Escape",
    "Super+Alt+t",
    "Ctrl+Alt+Tab",
    "Super+Alt+s",
    "Super+equal",
    "Super+minus",
    "Super+Alt+a",
]

[[binding]]
keys = "Super+Escape"
action = "system"
system = "lock_screen"

