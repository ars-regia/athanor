[package]
name = "athanor-init-oracle"
version = "1.0.0"
license = "GPL-3.0-or-later"
edition = "2021"
description = "Athanor OS Autonomous AI Systemd Init Oracle Daemon"
authors = ["athanor-init-oracle-architect"]

[dependencies]
tokio = { workspace = true, features = ["full"] }
zbus = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
regex = "1.10"
athanor-bus-api = { path = "../athanor-bus-api" }



[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"
