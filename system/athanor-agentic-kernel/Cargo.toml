[package]
name = "athanor-agentic-kernel"
version = "1.0.0"
license = "GPL-3.0-or-later"
edition = "2021"
description = "Level 14 Autonomous Ring-0 Agentic OS Controller for Athanor OS"

[dependencies]
aya = { workspace = true }
tokio = { workspace = true, features = ["full", "signal", "time"] }
zbus = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
libc = { workspace = true }
athanor-bus-api = { path = "../athanor-bus-api" }


[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"
