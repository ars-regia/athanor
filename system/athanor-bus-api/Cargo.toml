[package]
name = "athanor-bus-api"
version = "1.0.0"
license = "GPL-3.0-or-later"
edition = "2021"
description = "Shared polkit client for the Athanor daemons"
authors = ["athanor-architect"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
zbus = { workspace = true }

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"
