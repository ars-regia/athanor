[package]
name = "athanor-bus-api"
version = "1.0.0"
license = "GPL-3.0-or-later"
edition = "2021"
description = "Shared Interface Crate and Common Types for Athanor OS Agentic Kernel and Mesh Bus"
authors = ["athanor-architect"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zbus = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
x25519-dalek = "2.0.1"
sha2 = { workspace = true }
hex = { workspace = true }
base64 = "0.21"
rand_core = "0.6"
rand = { workspace = true }
ring = "0.17"
zeroize = { workspace = true, features = ["zeroize_derive"] }
subtle = { workspace = true }


[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"
