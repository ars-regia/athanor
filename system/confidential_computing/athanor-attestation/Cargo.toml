[package]
name = "athanor-cvm-attestation"
version = "0.1.0"
edition = "2021"
description = "Athanor OS Confidential Computing Attestation Tool"
authors = ["azoth-developer"]

[dependencies]
anyhow = { workspace = true }
log = "0.4"
env_logger = { workspace = true }
nix = { workspace = true, features = ["fs", "ioctl"] }
ring = "0.17"
sha2 = { workspace = true }
p384 = { version = "0.14", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa"] }
zeroize = { workspace = true, features = ["zeroize_derive"] }
subtle = { workspace = true }
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
pqc_dilithium = { workspace = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { workspace = true, features = ["full"] }
zbus = { workspace = true }
tracing = { workspace = true }


[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"

