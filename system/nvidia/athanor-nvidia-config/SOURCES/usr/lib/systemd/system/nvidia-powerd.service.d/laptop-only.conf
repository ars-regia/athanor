[Unit]
# The udev rule of nvidia-driver-common starts this unit for every NVIDIA GPU, enabled or not,
# and the daemon refuses a desktop. These are the DMI chassis types of a portable, laptop,
# notebook, sub-notebook, convertible and detachable.
ConditionFirmware=|smbios-field(chassis_type = 8)
ConditionFirmware=|smbios-field(chassis_type = 9)
ConditionFirmware=|smbios-field(chassis_type = 10)
ConditionFirmware=|smbios-field(chassis_type = 14)
ConditionFirmware=|smbios-field(chassis_type = 31)
ConditionFirmware=|smbios-field(chassis_type = 32)
