[Service]
# The udev rule of nvidia-driver-common starts this unit for every NVIDIA GPU, enabled or not,
# and the daemon refuses a desktop. Its DMI chassis types: portable, laptop, notebook,
# sub-notebook, convertible and detachable.
ExecCondition=/usr/bin/grep -qxE '8|9|10|14|31|32' /sys/class/dmi/id/chassis_type
