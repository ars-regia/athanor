[package]
name = "athanor-portal"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The decisions of Athanor's desktop portal backend that tests reach without a display (doc_portal.md, PT2)"
authors = ["Athanor Forge <forge@athanor.os>"]

[dependencies]
athanor-unit = { path = "../athanor-unit", features = ["bus-caller"] }
tokio = { workspace = true }
tracing = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
nix = { workspace = true, features = ["user"] }
