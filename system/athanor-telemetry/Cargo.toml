[package]
name = "athanor-telemetry"
version = "1.0.0"
license = "GPL-3.0-or-later"
edition = "2021"
description = "Athanor OS AI Predictive Telemetry & Log-Aggregator Self-Healing Daemon"
authors = ["Predictive Telemetry Architect <telemetry@athanor.os>"]

[dependencies]
tokio = { workspace = true, features = ["full"] }
zbus = { workspace = true }
athanor-bus-api = { path = "../athanor-bus-api" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
aya = { workspace = true }
libc = { workspace = true }

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"
