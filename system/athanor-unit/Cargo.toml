[package]
name = "athanor-unit"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "What a user unit of the shell does at start: the crash-loop record, journal priorities, readiness, Landlock, the peer check of a socket, and making other processes' text safe to show"
authors = ["Athanor Forge <forge@athanor.os>"]

[dependencies]
landlock = { workspace = true }
# clock_gettime(CLOCK_BOOTTIME) for the crash-loop window; poll and getuid for the peer check.
nix = { workspace = true, features = ["time", "poll", "user"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
