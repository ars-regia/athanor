[package]
name = "athanor-unit"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "What a user unit of the shell does at start: the crash-loop record, journal priorities, readiness, Landlock, and making other processes' text safe to show"
authors = ["Athanor Forge <forge@athanor.os>"]

[dependencies]
landlock = { workspace = true }
# clock_gettime(CLOCK_BOOTTIME) for the crash-loop window.
nix = { workspace = true, features = ["time"] }
# O_NONBLOCK for picture files a peer names: a FIFO must not hang the reader.
libc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
