[package]
name = "athanor-unit"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "What a user unit of the shell does at start: the crash-loop record, journal priorities, readiness, Landlock, making other processes' text safe to show, and who a D-Bus caller is"
authors = ["Athanor Forge <forge@athanor.os>"]

[dependencies]
landlock = { workspace = true }
# clock_gettime(CLOCK_BOOTTIME) for the crash-loop window; open(2)'s flags for the checked
# directories of `dirs` and geteuid(2) for their owner.
nix = { workspace = true, features = ["fs", "time", "user"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# The `bus_caller` module: who a D-Bus caller is, asked of the bus and systemd (doc_session_daemons.md SD5).
zbus = { workspace = true, optional = true }

[features]
bus-caller = ["dep:zbus", "nix/poll", "nix/user"]
