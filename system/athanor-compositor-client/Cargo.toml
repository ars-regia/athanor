[package]
name = "athanor-compositor-client"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "The shell's client of the compositor: windows, workspaces, outputs, actions and application launch"
authors = ["Athanor Forge <forge@athanor.os>"]

[dependencies]
athanor-layout = { path = "../athanor-layout" }
athanor-style = { path = "../athanor-style" }
bitflags = { workspace = true }
futures-util = { workspace = true }
gdk4-wayland = { workspace = true }
gio-unix = { workspace = true }
gtk4 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# dlopen, not a build-time link: a direct NEEDED for libwayland-client.so.0 here would race
# gtk4-layer-shell for it in a consuming binary's DT_NEEDED order (doc_shell.md SH4), and
# only a load-time symbol lookup, not the link order, is ours to control from this crate.
wayland-client = { workspace = true, features = ["dlopen"] }
wayland-protocols = { workspace = true }
wayland-scanner = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
