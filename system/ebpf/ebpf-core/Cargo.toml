[package]
name = "ebpf-core"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2021"

[dependencies]
aya-ebpf = "0.2.1"
aya-log-ebpf = { version = "0.2.0", default-features = false }
network-types = "0.0.5"
num_enum = { version = "0.7.6", default-features = false }

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"
