[package]
name = "athanor-cluster-mesh"
version = "1.0.0"
license = "GPL-3.0-or-later"
edition = "2021"
description = "Athanor OS Multi-Node Zero-Conf P2P Swarm Computing Daemon for Distributed NPU Inference"
authors = ["athanor-swarm-cluster-architect"]

[dependencies]
tokio = { workspace = true, features = ["full"] }
zbus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
base64 = "0.21"
sha2 = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }
rand = { workspace = true }
thiserror = { workspace = true }
athanor-bus-api = { path = "../athanor-bus-api" }

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"
