[package]
name = "athanor-net-unikernel"
version = "1.0.0"
license = "GPL-3.0-or-later"
edition = "2021"
description = "Athanor OS Userspace Zero-Copy Isolated Rust TCP/IP Stack Daemon (smoltcp + TUN/TAP / virtio-net bypass)"
authors = ["athanor-network-architect"]

[dependencies]
smoltcp = { version = "0.11", default-features = false, features = [
    "std",
    "log",
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "proto-igmp",
    "socket-raw",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
    "phy-tuntap_interface",
    "async"
] }
tokio = { workspace = true, features = ["full"] }
nix = { workspace = true, features = ["net", "fs", "ioctl", "process"] }
libc = { workspace = true }
anyhow = { workspace = true }
log = "0.4"
env_logger = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
athanor-bus-api = { path = "../athanor-bus-api" }


[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"
