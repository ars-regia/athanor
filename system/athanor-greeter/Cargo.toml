[package]
name = "athanor-greeter"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2021"
description = "Athanor OS Zero-Trust Greeter and Key Release Manager replacing greetd"
authors = ["Greeter Security Architect <security@athanor.os>"]

[dependencies]
anyhow = { workspace = true }
log = "0.4"
env_logger = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
zbus = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true, features = ["zeroize_derive"] }
pam = "0.8"
tss-esapi = "7.2.0"



[features]
default = []

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"


