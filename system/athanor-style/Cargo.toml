[package]
name = "athanor-style"
version = "1.0.0"
license = "GPL-3.0-or-later"
edition = "2021"
description = "Centralized Glassmorphism, Accent Color Engine, and Appearance Layout System for Athanor OS"
authors = ["Athanor Architect <architect@athanor.os>"]

[dependencies]
gtk4 = { workspace = true }
gtk4-layer-shell = { workspace = true }
glib = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "0.8"
zbus = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
