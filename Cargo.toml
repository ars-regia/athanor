[workspace]
members = [
  "forge/specs/athanor-backup/athanor-backup-1.0.0",
  "forge/specs/athanor-doctor/athanor-doctor-1.0.0",
  "forge/specs/athanor-greeter-ui/athanor-greeter-ui-1.0.0",
  "forge/specs/athanor-layout-chooser/athanor-layout-chooser-1.0.0",
  "forge/specs/athanor-shelld/athanor-shelld-1.0.0",
  "forge/specs/athanor-bar/athanor-bar-1.0.0",
  "forge/specs/athanor-dock/athanor-dock-1.0.0",
  "forge/specs/athanor-launcher/athanor-launcher-1.0.0",
  "forge/specs/athanor-update/athanor-update-1.0.0",
  "forge/specs/athanor-update/athanor-update-notify-1.0.0",
  "forge/specs/athanor-xdg-desktop-portal-athanor/xdg-desktop-portal-athanor-1.0.0",
  "system/confidential_computing/athanor-attestation",
  "system/athanor-bus-api",
  "system/athanor-compositor-client",
  "system/athanor-apps",
  "system/athanor-i18n",
  "system/athanor-layout",
  "system/athanor-preview",
  "system/athanor-portal",
  "system/athanor-preview-render",
  "system/athanor-search",
  "system/athanor-unit",
  "system/athanor-trust-state",
]

# The recovery kiosk is out of this workspace since 2026-09-30: what athanor-recovery
# ships is a text console (doc_recovery.md), and the kiosk's source stays where it was, to be
# mined when a graphical recovery is built on the polkit agent of stage 4. tests/fuzz and the
# calmo theme tool are separate workspaces.
exclude = [
  "tests/fuzz",
  "forge/tools/calmo-cosmic-theme",
  "forge/specs/athanor-recovery/athanor-recovery-1.0.0",
]

resolver = "2"

[workspace.dependencies]
# Async Runtime & Core Utilities
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.91"
futures-util = "0.3.30"
libc = "0.2.189"

# D-Bus & Inter-Process Communication
zbus = { version = "5.18.0", features = ["tokio"] }
zvariant = "5.15.0"

# GUI, Display & Wayland Ecosystem
gtk4 = { version = "0.11.4", features = ["v4_18"] }
gtk4-layer-shell = "0.8.1"
glib = "0.22.9"
relm4 = "0.11.0"
bitflags = "2"
gdk4-wayland = { version = "0.11", features = ["wayland_crate"] }
gio = "0.22"
gio-unix = "0.22"
tracker-rs = { version = "0.8", features = ["v3_1"] }
nucleo-matcher = "0.3"
# The preview's decoder (doc_launcher.md, LA6, LA9): glycin runs image loaders in
# bubblewrap; poppler renders the first page of a PDF. Linked only by
# athanor-preview-render.
glycin = "4"
poppler-rs = "0.26"
cairo-rs = "0.22"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-scanner = "0.31"
# The PulseAudio protocol that pipewire-pulse serves, on a GLib main loop (athanor-bar).
libpulse-binding = "2.30"
libpulse-glib-binding = "2.29"

# Serialization & Error Handling
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8"
thiserror = "2.0.19"
anyhow = "1.0.99"

# Logging & Telemetry
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
env_logger = "0.11.11"

# Post-quantum signatures: only athanor-attestation uses them (#201, #206).
pqc_dilithium = "0.2.0"

# Hashing & Utilities
sha2 = "0.10.9"
hex = "0.4.3"
zeroize = "1.8.1"
subtle = "2.6.1"

# System Utilities & CLI
nix = "0.29.0"
clap = { version = "4.6.4", features = ["derive"] }
greetd_ipc = "0.10.3"
landlock = "0.4"
rand = "0.8.5"
chrono = "0.4.45"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
rpath = false
overflow-checks = true
