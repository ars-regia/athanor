[workspace]
members = [
  "forge/specs/athanor-backup/athanor-backup-1.0.0",
  "forge/specs/athanor-cloud-rs/athanor-cloud-rs-1.0.0",
  "forge/specs/athanor-doctor/athanor-doctor-1.0.0",
  "forge/specs/athanor-gatekeeper-rs/athanor-gatekeeper-rs-1.0.0",
  "forge/specs/athanor-greeter-ui/athanor-greeter-ui-1.0.0",
  "forge/specs/athanor-layout-translator/athanor-layout-translator-1.0.0",
  "forge/specs/athanor-layout-chooser/athanor-layout-chooser-1.0.0",
  "forge/specs/athanor-lvfs-rs/athanor-lvfs-rs-1.0.0",
  "forge/specs/athanor-mdm-rs/athanor-mdm-rs-1.0.0",
  "forge/specs/athanor-mesh-sync/athanor-mesh-sync-1.0.0",
  "forge/specs/athanor-recovery/athanor-recovery-1.0.0",
  "forge/specs/athanor-shelld/athanor-shelld-1.0.0",
  "forge/specs/athanor-sysmon-ebpf/athanor-sysmon-ebpf-1.0.0",
  "forge/specs/athanor-xdg-desktop-portal-athanor/xdg-desktop-portal-athanor-1.0.0",
  "forge/specs/athanor-niri-ipc",
  "system/confidential_computing/athanor-attestation",
  "system/ebpf/ebpf-core",
  "system/ebpf/ebpf-loader",
  "system/athanor-agentic-kernel",
  "system/athanor-bus-api",
  "system/athanor-cluster-mesh",
  "system/athanor-compositor",
  "system/athanor-compositor-client",
  "system/athanor-ebpf-sched",
  "system/athanor-greeter",
  "system/athanor-hypervisor-daemon",
  "system/athanor-i18n",
  "system/athanor-init-oracle",
  "system/athanor-layout",
  "system/athanor-unit",
  "system/athanor-mesh-bus",
  "system/athanor-net-unikernel",
  "system/athanor-store",
  "system/athanor-telemetry",
  "system/athanor-updater-rs",
]

# Out of this workspace since 2026-09-19 (doc_shell.md, SH4): gtk4-sys declares
# links = "gtk-4", so every GTK crate of one workspace moves together. The old shell and
# its dock are frozen at GTK 0.7 in forge/specs/athanor-shell-rs/, a workspace of their
# own; the other four ship nothing and are built by nothing until they are redesigned.
exclude = [
  "tests/fuzz",
  "forge/tools/calmo-cosmic-theme",
  "forge/specs/athanor-shell-rs",
  "forge/specs/athanor-dock/athanor-dock-1.0.0",
  "forge/specs/athanor-daemon-rs/athanor-daemon-rs-0.2.1",
  "forge/specs/athanor-settings-rs/athanor-settings-rs-1.0.0",
  "forge/specs/athanor-store-rs/athanor-store-rs-1.0.0",
  "system/athanor-oobe",
]

resolver = "2"

[workspace.dependencies]
# Async Runtime & Core Utilities
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.13", features = ["codec"] }
async-trait = "0.1.91"
futures-util = "0.3.30"
bytes = "1.10.1"
libc = "0.2.189"

# D-Bus & Inter-Process Communication
zbus = { version = "5.18.0", features = ["tokio"] }
zvariant = "5.15.0"
notify-rust = "4.11"

# HTTP & Network Clients
reqwest = { version = "0.13.4", features = ["stream", "rustls", "json"] }

# GUI, Display & Wayland Ecosystem
gtk4 = { version = "0.11.4", features = ["v4_18"] }
gtk4-layer-shell = "0.8.1"
glib = "0.22.9"
relm4 = "0.11.0"
smithay = { version = "0.3.0", default-features = false }
wayland-server = "0.31.0"
bitflags = "2"
gdk4-wayland = { version = "0.11", features = ["wayland_crate"] }
gio-unix = "0.22"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-scanner = "0.31"

# Serialization & Error Handling
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8"
thiserror = "2.0.19"
anyhow = "1.0.99"

# Logging & Telemetry
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
log = "0.4.29"
env_logger = "0.11.11"

# Post-Quantum & Security Cryptography
pqc_kyber = "0.7.1"

pqc_dilithium = "0.2.0"
sha2 = "0.10.9"
ml-kem = "0.3.2"
hex = "0.4.3"
zeroize = "1.8.1"
subtle = "2.6.1"

# eBPF / Kernel Instrumentation
aya = "0.13.1"

# System Utilities & CLI
glam = "0.29.0"
nix = "0.29.0"
clap = { version = "4.6.4", features = ["derive"] }
mimalloc = { version = "0.1.43", default-features = false }
greetd_ipc = "0.10.3"
landlock = "0.4"
rand = "0.8.5"
chrono = "0.4.45"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
rpath = false
overflow-checks = true
