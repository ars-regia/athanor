# Athanor component inventory: one [[component]] per top-level component, the
# machine-readable source of "what exists, where, and which specification owns it".
# `python3 scripts/verify.py coverage` checks this file against the tree.
#
# How to update it:
# - Adding a directory under system/, forge/, forge/specs/ or scripts/, or at the root,
#   needs an entry here in the same change, or the coverage check fails.
# - Removing or renaming a component removes or renames its entry.
# - Fields:
#   path     the directory or file, relative to the repository root.
#   kind     crate | rpm spec | script tool | config | image | tests | site.
#   area     kernel | build-ci | signing-update | security | shell | apps | platform | docs.
#   status   specified: `spec` names a file in docs/architecture and `item` the item id
#              or section that owns the component (its build, its behaviour or its retirement);
#            out-of-1.0: not in release 1.0, and `issue` names the GitHub issue that says so;
#            missing: no specification yet (reported as a warning).
#   branch   only while `spec` exists on another branch that is being merged; remove the
#            field once the file is on this branch.
#   purpose  one line.
# - Keep entries sorted by path.

