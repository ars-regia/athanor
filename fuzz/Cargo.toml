[package]
name = "athanor-fuzz"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace and lock file: libFuzzer needs a nightly compiler and must not enter the
# root workspace, whose `cargo test` runs on stable.
[workspace]

[features]
default = ["update", "shelld", "layout", "gtk", "sulphur"]
update = ["athanor-fuzz-entries/update"]
shelld = ["athanor-fuzz-entries/shelld"]
layout = ["athanor-fuzz-entries/layout"]
# The bar and the compositor client link GTK.
gtk = ["athanor-fuzz-entries/gtk"]
sulphur = ["athanor-fuzz-entries/sulphur"]

# The shipped profile checks overflow (the root Cargo.toml); fuzzing should too.
[profile.release]
overflow-checks = true
debug-assertions = true

[dependencies]
libfuzzer-sys = "0.4"
athanor-fuzz-entries = { path = "../system/athanor-fuzz-entries", default-features = false }

# A workspace of its own takes no [patch] of the root Cargo.toml: the fuzzed compositor must
# parse the wire as the shipped one does, with the wire parser that rejects a null its
# signature forbids (its PATCHES.md). The same directory as the root entry, not a copy.
[patch.crates-io]
wayland-backend = { path = "../forge/specs/athanor-sulphur/athanor-sulphur-1.0.0/vendor/wayland-backend" }

[[bin]]
name = "update_claims"
path = "fuzz_targets/update_claims.rs"
required-features = ["update"]
test = false
doc = false

