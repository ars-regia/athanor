[package]
name = "athanor-fuzz"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace and lock file: libFuzzer needs a nightly compiler and must not enter the
# root workspace, whose `cargo test` runs on stable.
[workspace]

[features]
default = ["update", "shelld", "layout", "gtk"]
update = ["athanor-fuzz-entries/update"]
shelld = ["athanor-fuzz-entries/shelld"]
layout = ["athanor-fuzz-entries/layout"]
# The bar and the compositor client link GTK.
gtk = ["athanor-fuzz-entries/gtk"]

# The shipped profile checks overflow (the root Cargo.toml); fuzzing should too.
[profile.release]
overflow-checks = true
debug-assertions = true

[dependencies]
libfuzzer-sys = "0.4"
athanor-fuzz-entries = { path = "../system/athanor-fuzz-entries", default-features = false }

[[bin]]
name = "update_claims"
path = "fuzz_targets/update_claims.rs"
required-features = ["update"]
test = false
doc = false

[[bin]]
name = "update_status"
path = "fuzz_targets/update_status.rs"
required-features = ["update"]
test = false
doc = false

[[bin]]
name = "update_local"
