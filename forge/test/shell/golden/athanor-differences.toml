# Each case of `rig.sh golden-report` whose capture under athanor-sulphur differs from
# cosmic-comp's golden by more than compare.py's tolerance. One entry per case and cause: the
# cause and the issue that tracks it. A case with several causes has several entries. The
# report fails on a difference without an entry and on an entry without a difference. The
# greeter is left out of the report (doc_session.md SN12). Causes seen on the images:
#
#   #737: cosmic-comp draws a shadow of its own around a window it clips; athanor-sulphur draws none, and the client's own shadow stays (maintainer decision, 2026-11-01)
#   #918: at scale 1.5 both compositors place a window at the same logical position and round it to physical pixels differently, so the window, its divider and the outline's inner edge land one physical pixel apart on one or more sides (accepted, maintainer decision, 2026-11-05)
#   #743: at scale 1.5 the launcher card's bottom edge row is the client's translucent pixel under athanor-sulphur; cosmic-comp 1.11 alters that row in the golden
#   #744: cosmic-comp 1.11 draws the pointer at the top left of the two-output captures, although the rig's grim -o asks for no cursor; athanor-sulphur draws the pointer in no capture yet and ignores paint_cursors (capture.rs, until the portal of task 7) (accepted, maintainer decision, 2026-11-05)
#
# Decision 28 of doc_own_stack.md hides controls under the own compositor until their replacement
# comes: one entry per case and hidden control, covering its absence and the move it causes, for
# each case that draws it under cosmic-comp (golden_report.py, HIDDEN and hidden(), checks both):
#
#   #835: the bar's workspaces module and the dock's workspaces button, until athanor-overview
#   #836: the bar's and the dock's application library buttons, until athanor-library

