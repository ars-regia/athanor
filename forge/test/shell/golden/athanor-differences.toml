# Each case of `rig.sh golden-report` whose capture under athanor-compositor differs from
# cosmic-comp's golden by more than compare.py's tolerance. One entry per case and cause: the
# cause and the issue that tracks it. A case with several causes has several entries. The
# report fails on a difference without an entry and on an entry without a difference. The
# greeter is left out of the report (doc_session.md SN12). Causes seen on the images:
#
#   #736: athanor-compositor clears to navy srgb(16,19,35) where cosmic-comp clears to grey srgb(39,41,42)
#   #737: cosmic-comp draws drop shadows around windows and layer surfaces; athanor-compositor draws none
#   #738: cosmic-comp places a client window at the top left with a focus outline; athanor-compositor centres it without the outline
#   #739: the bar lacks the controls that need cosmic protocols (workspaces, input source, tiling, accessibility compositor rows), which athanor-compositor does not serve
#   #742: the bar draws notification toasts over the open notification centre; the golden shows only the centre
#   #740: the launcher draws a text caret in its search entry that the cosmic-comp capture lacks

