# The layout chooser drawn with athanor-sal against the GTK chooser's goldens, by the item of
# docs/spikes/t1-own-toolkit.md task 4 (the toolkit's look, then GTK's): closed, or recorded with
# its reason. golden_report.py reads only the [[difference]] table above.

[[gtk-difference]]
surface = "chooser"
item = 1
what = "no compositor border or shadow around the window"
state = "recorded"
reason = "cosmic-comp draws the outline and clips the window, and athanor-sulphur draws no shadow (#737); the client draws neither, as the GTK chooser draws none of its own under cosmic-comp (maintainer decision, 2026-11-12)"

[[gtk-difference]]
surface = "chooser"
item = 2
what = "a white title bar with a regular title and round grey buttons"
state = "recorded"
reason = "closed but for the bar's colour: TitleBarStyle::Bare gives the bold title and the bare buttons of GTK's header bar; the bar takes VL10's bar token, where the GTK chooser drew GTK's built-in header bar colour, which no Calmo token names (doc_visual_language.md VL1, VL10): maintainer decision, 2026-11-13: on the port to Sal, the Calmo palette prevails over Adwaita's header-bar colour; this applies to every Sal window. Its height is GTK's through Theme::title_bar_height: 39 px at scale 1 from the top of the window to the bar's bottom border, as the GTK goldens draw it"

[[gtk-difference]]
surface = "chooser"
item = 3
what = "headings in regular weight and dark ink"
state = "closed"
reason = "the headings are Calmo's small size, 11.5 px, semi-bold, in ink2, as .layout-group-title"

[[gtk-difference]]
surface = "chooser"
item = 4
what = "toggles with a grey fill, no border, a radius of about 6 and a height of 30"
state = "closed"
reason = "the toggles take button.layout-choice's surf2 fill, 1 px line border, radius 8, minimum height 34 and 14 px padding"

[[gtk-difference]]
surface = "chooser"
item = 5
what = "the selected purple differs slightly"
state = "closed"
reason = "the accent is the appearance's, through athanor_style::sal::palette, the GTK chooser's 145, 65, 172"

[[gtk-difference]]
surface = "chooser"
item = 6
what = "an off-white background"
state = "recorded"
reason = "the window and its toggles take VL10's surf and surf2, which the generator retuned for the toolkit only: light surf is 254, 253, 254 where the GTK sheet keeps #fdfdfe, and dark surf is 42, 27, 47, tinted purple, where it keeps #1b1e2f; the GTK shell keeps its tables until it is removed (doc_visual_language.md VL1, VL10)"

[[gtk-difference]]
surface = "chooser"
item = 7
what = "the system sans"
state = "recorded"
