[package]
name = "athanor-control-center"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The Athanor control center: one resident layer-shell panel opened by the bar's button and Super+C (doc_control_center.md)"
authors = ["Athanor Forge <forge@athanor.os>"]

[dependencies]
athanor-compositor-client = { path = "../../../../system/athanor-compositor-client" }
athanor-controls = { path = "../../../../system/athanor-controls" }
athanor-i18n = { path = "../../../../system/athanor-i18n" }
athanor-layout = { path = "../../../../system/athanor-layout" }
athanor-services = { path = "../../../../system/athanor-services" }
athanor-style = { path = "../../../../system/athanor-style" }
athanor-unit = { path = "../../../../system/athanor-unit" }
gio-unix = { workspace = true }
glib = { workspace = true }
gtk4 = { workspace = true }
gtk4-layer-shell = { workspace = true }
# O_NONBLOCK for /dev/rfkill, which std does not name.
libc = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The channels of a `Services` built by hand, as athanor-controls' own page tests do.
tokio = { workspace = true }
