[package]
name = "athanor-backup"
version = "1.0.0"
edition = "2021"
authors = ["Athanor Forge <forge@athanor.os>"]
description = "Hourly read-only btrfs snapshots of /var/home, with retention and non-destructive restore"
license = "GPL-3.0-or-later"

[[bin]]
name = "athanor-backup"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
nix = { workspace = true, features = ["fs", "user"] }

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"
