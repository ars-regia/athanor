# Swap on zram with zstd (docs/architecture/doc_kernel_profile.md, section 6, D15):
# half of the memory, at most 8 GiB. Overrides zram-generator-defaults. Swap on zram is a
# locked setting of the base profile: athanor-profile-check reports drift without it. The
# empty /etc/systemd/zram-generator.conf that Fedora documents no longer disables it,
# because this drop-in still defines zram0; an administrator disables it with a
# later-sorting drop-in in /etc/systemd/zram-generator.conf.d/ that sets zram-size = 0.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
