# Swap on zram with zstd (docs/architecture/doc_kernel_profile.md, section 6, D15):
# half of the memory, at most 8 GiB. Overrides zram-generator-defaults; an administrator
# overrides this file with a later-sorting drop-in in /etc/systemd/zram-generator.conf.d/.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
