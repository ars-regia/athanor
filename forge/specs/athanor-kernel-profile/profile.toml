CONFIG_X86_IOPL_IOPERM = { value = "n", decision = "section 5", locked = true }
CONFIG_LSM = { value = '"lockdown,yama,selinux,bpf,landlock,ipe"', decision = "section 5", locked = true }
CONFIG_AUTOFDO_CLANG = { value = "y", decision = "section 5", locked = true }
CONFIG_PREEMPT = { value = "n", decision = "D13", locked = true }
CONFIG_SATA_AHCI = { value = "y", decision = "D17", locked = true }
CONFIG_VIRTIO_BLK = { value = "y", decision = "D17", locked = true }
CONFIG_USB_HID = { value = "y", decision = "D17", locked = true }
CONFIG_SERIO_I8042 = { value = "y", decision = "D17", locked = true }
CONFIG_PINCTRL_AMD = { value = "y", decision = "D17", locked = true }
CONFIG_I2C_DESIGNWARE_CORE = { value = "y", decision = "D17", locked = true }
CONFIG_I2C_DESIGNWARE_PLATFORM = { value = "y", decision = "D17", locked = true }
CONFIG_ATA_PIIX = { value = "y", decision = "D17", locked = true }
CONFIG_BLK_DEV_SD = { value = "y", decision = "D17", locked = true }
CONFIG_VIRTIO_PCI = { value = "y", decision = "D17", locked = true }
CONFIG_USB_XHCI_HCD = { value = "y", decision = "D17", locked = true }
CONFIG_USB_XHCI_PCI = { value = "y", decision = "D17", locked = true }
CONFIG_USB_EHCI_HCD = { value = "y", decision = "D17", locked = true }
CONFIG_USB_EHCI_PCI = { value = "y", decision = "D17", locked = true }
CONFIG_USB_OHCI_HCD = { value = "y", decision = "D17", locked = true }
CONFIG_USB_OHCI_HCD_PCI = { value = "y", decision = "D17", locked = true }
CONFIG_USB_UHCI_HCD = { value = "y", decision = "D17", locked = true }
CONFIG_HID_GENERIC = { value = "y", decision = "D17", locked = true }
CONFIG_KEYBOARD_ATKBD = { value = "y", decision = "D17", locked = true }
CONFIG_MFD_INTEL_LPSS_PCI = { value = "y", decision = "D17", locked = true }
CONFIG_MFD_INTEL_LPSS_ACPI = { value = "y", decision = "D17", locked = true }
CONFIG_SERIAL_8250_DW = { value = "y", decision = "D17", locked = true }
CONFIG_SERIAL_DEV_BUS = { value = "y", decision = "D17", locked = true }
CONFIG_TCG_TIS = { value = "y", decision = "D17", locked = true }
CONFIG_TCG_CRB = { value = "y", decision = "D17", locked = true }
CONFIG_DRM_SIMPLEDRM = { value = "y", decision = "D17", locked = true }

[base.sysctl]
"kernel.kptr_restrict" = { value = "2", decision = "D47", locked = true }
"kernel.dmesg_restrict" = { value = "1", decision = "D47", locked = true }
"kernel.yama.ptrace_scope" = { value = "1", decision = "D47", locked = true }
"dev.tty.ldisc_autoload" = { value = "0", decision = "D47", locked = true }
"fs.protected_fifos" = { value = "2", decision = "D47", locked = true }
"fs.protected_regular" = { value = "2", decision = "D47", locked = true }
"fs.suid_dumpable" = { value = "0", decision = "D47", locked = true }
"net.core.default_qdisc" = { value = "fq", decision = "section 6", locked = true }

[base.runtime]
# The lockdown level selected in /sys/kernel/security/lockdown.
lockdown = { value = "integrity", decision = "section 5", locked = true }
# LSMs that must be active; others (capability, ima, evm) may be present as well.
lsm = { value = ["lockdown", "yama", "selinux", "bpf", "landlock", "ipe"], decision = "section 5" }

# The base kernel command line (section 6). module.sig_enforce is not here because
# CONFIG_MODULE_SIG_FORCE already enforces it; lockdown, init_on_free, vsyscall and debugfs
# stay until block P2 builds them in; intel_iommu and efi until block P4b builds them in
# with the compatibility profile of D45; ima_policy until P4b replaces it with the policy
# of D46. Capability-specific parameters (mem_encrypt, kvm_amd.sev, kvm_intel.tdx) belong
# to roles (block P5), never to the base.
[base.cmdline]
"page_alloc.shuffle" = { value = "1", decision = "section 6", locked = true }
amd_pstate = { value = "active", decision = "section 6" }
lockdown = { value = "integrity", decision = "section 6", locked = true }
init_on_free = { value = "1", decision = "section 6", locked = true }
vsyscall = { value = "none", decision = "section 6", locked = true }
debugfs = { value = "off", decision = "section 6", locked = true }
intel_iommu = { value = "on", decision = "D16", locked = true }
efi = { value = "disable_early_pci_dma", decision = "section 6", locked = true }
ima_policy = { value = "tcb", decision = "D23", locked = true }

# Shared by desktop and laptop (D18); settings arrive with block P5.
[fragments.interactive]

[roles.desktop]
includes = ["interactive"]

[roles.laptop]
includes = ["interactive"]

[roles.mesh]

[rules]
# An interactive role together with the mesh role waits for the mesh specification
# (section 7, D27).
rejected = [["desktop", "mesh"], ["laptop", "mesh"]]
