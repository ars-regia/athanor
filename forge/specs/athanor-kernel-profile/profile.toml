# The kernel profile manifest of Athanor (docs/architecture/doc_kernel_profile.md,
# sections 3 and 7). Every setting carries its value and the decision or section that
# motivates it; `locked` (base only), `priority` and `ordering` ("max" or "min") follow
# the composition rules of section 7. kernel_profile.py composes every role combination
# and writes the effective profiles to SOURCES/usr/share/athanor/kernel-profile.
#
# Block P1 declares the settings of the profile that are already in force on the image;
# later blocks extend the manifest as they deliver the rest. The [base.cmdline] table is
# the only source of the base kernel command line: kernel_profile.py generates from it the
# kargs.d file of this package and forge/specs/azoth/cmdline, used by the boot matrix.
schema = 1

# One kernel binary for every role (D1): a build option is never a role setting, so
# every kconfig entry is locked.
[base.kconfig]
CONFIG_MODULE_SIG_FORCE = { value = "y", decision = "section 5", locked = true }
CONFIG_CFI = { value = "y", decision = "section 5", locked = true }
CONFIG_RUST = { value = "y", decision = "D4", locked = true }
CONFIG_SCHED_BORE = { value = "y", decision = "D5", locked = true }
CONFIG_X86_64_VERSION = { value = "1", decision = "D14", locked = true }
CONFIG_PREEMPT_DYNAMIC = { value = "y", decision = "D13", locked = true }
CONFIG_PREEMPT_LAZY = { value = "y", decision = "D13", locked = true }
CONFIG_HZ = { value = "1000", decision = "section 6", locked = true }
CONFIG_DEFAULT_TCP_CONG = { value = '"bbr3"', decision = "section 6", locked = true }
CONFIG_SECURITY_IPE = { value = "y", decision = "D8", locked = true }
CONFIG_SECURITY_LANDLOCK = { value = "y", decision = "section 10", locked = true }
CONFIG_BPF_LSM = { value = "y", decision = "section 5", locked = true }
CONFIG_IMA_ARCH_POLICY = { value = "y", decision = "section 5", locked = true }
CONFIG_INTEGRITY_CA_MACHINE_KEYRING_MAX = { value = "y", decision = "D40", locked = true }
CONFIG_IA32_EMULATION = { value = "y", decision = "section 5", locked = true }
CONFIG_MODIFY_LDT_SYSCALL = { value = "y", decision = "section 5", locked = true }
CONFIG_SHUFFLE_PAGE_ALLOCATOR = { value = "y", decision = "section 5", locked = true }
CONFIG_DRM_PANIC = { value = "y", decision = "section 11", locked = true }
CONFIG_BTRFS_FS = { value = "y", decision = "D17", locked = true }
CONFIG_EROFS_FS = { value = "y", decision = "section 5", locked = true }
# Defaults that make command line parameters redundant (section 6): slab_nomerge,
# randomize_kstack_offset=on, init_on_alloc=1, ima_hash=sha256 and mitigations=auto.
CONFIG_SLAB_MERGE_DEFAULT = { value = "n", decision = "section 6", locked = true }
CONFIG_RANDOMIZE_KSTACK_OFFSET_DEFAULT = { value = "y", decision = "section 6", locked = true }
CONFIG_INIT_ON_ALLOC_DEFAULT_ON = { value = "y", decision = "section 6", locked = true }
CONFIG_IMA_DEFAULT_HASH_SHA256 = { value = "y", decision = "section 6", locked = true }
CONFIG_CPU_MITIGATIONS = { value = "y", decision = "section 6", locked = true }
# Block P2 (section 5): the build profile, mirrored from the P2 block of kernel-local.
CONFIG_SECURITY_LOCKDOWN_LSM = { value = "y", decision = "section 5", locked = true }
CONFIG_SECURITY_LOCKDOWN_LSM_EARLY = { value = "y", decision = "section 5", locked = true }
CONFIG_LOCK_DOWN_KERNEL_FORCE_INTEGRITY = { value = "y", decision = "section 5", locked = true }
CONFIG_LOCK_DOWN_KERNEL_FORCE_NONE = { value = "n", decision = "section 5", locked = true }
CONFIG_LOCK_DOWN_KERNEL_FORCE_CONFIDENTIALITY = { value = "n", decision = "section 5", locked = true }
CONFIG_INIT_ON_FREE_DEFAULT_ON = { value = "y", decision = "section 5", locked = true }
CONFIG_LEGACY_VSYSCALL_NONE = { value = "y", decision = "section 5", locked = true }
CONFIG_LEGACY_VSYSCALL_XONLY = { value = "n", decision = "section 5", locked = true }
CONFIG_DEBUG_FS_ALLOW_NONE = { value = "y", decision = "section 5", locked = true }
CONFIG_DEBUG_FS_ALLOW_ALL = { value = "n", decision = "section 5", locked = true }
CONFIG_PANIC_TIMEOUT = { value = "10", decision = "D19", locked = true }
CONFIG_EFI_VARS_PSTORE = { value = "y", decision = "D19", locked = true }
CONFIG_EFI_VARS_PSTORE_DEFAULT_DISABLE = { value = "n", decision = "D19", locked = true }
CONFIG_KSTACK_ERASE = { value = "y", decision = "section 5", locked = true }
CONFIG_PAGE_TABLE_CHECK = { value = "y", decision = "section 5", locked = true }
CONFIG_PAGE_TABLE_CHECK_ENFORCED = { value = "y", decision = "section 5", locked = true }
CONFIG_DEBUG_VIRTUAL = { value = "y", decision = "section 5", locked = true }
CONFIG_DEBUG_SG = { value = "y", decision = "section 5", locked = true }
CONFIG_DEBUG_NOTIFIERS = { value = "y", decision = "section 5", locked = true }
CONFIG_ARCH_MMAP_RND_BITS = { value = "32", decision = "section 5", locked = true }
CONFIG_ARCH_MMAP_RND_COMPAT_BITS = { value = "16", decision = "section 5", locked = true }
CONFIG_PROC_MEM_FORCE_PTRACE = { value = "y", decision = "section 5", locked = true }
CONFIG_PROC_MEM_ALWAYS_FORCE = { value = "n", decision = "section 5", locked = true }
CONFIG_PROC_MEM_NO_FORCE = { value = "n", decision = "section 5", locked = true }
CONFIG_SECONDARY_TRUSTED_KEYRING = { value = "y", decision = "D40", locked = true }
