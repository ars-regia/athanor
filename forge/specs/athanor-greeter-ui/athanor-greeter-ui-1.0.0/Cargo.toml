[package]
name = "athanor-greeter-ui"
version = "1.0.0"
edition = "2021"
authors = ["Athanor Forge <forge@athanor.os>"]
license = "GPL-3.0-or-later"
description = "The Athanor greeter: one surface, one binary, the process that reads the password"

[dependencies]
athanor-i18n = { path = "../../../../system/athanor-i18n" }
athanor-style = { path = "../../../../system/athanor-style" }
gtk4 = { workspace = true }
gtk4-layer-shell = { workspace = true }
glib = { workspace = true }
zbus = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
greetd_ipc = { workspace = true }
landlock = { workspace = true }
# prctl(PR_SET_DUMPABLE) and setrlimit(RLIMIT_CORE): safe wrappers, no unsafe block here.
nix = { workspace = true, features = ["process", "resource"] }
serde_json = { workspace = true }
# Zeroizing<String> over every copy of the password this process owns.
zeroize = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
