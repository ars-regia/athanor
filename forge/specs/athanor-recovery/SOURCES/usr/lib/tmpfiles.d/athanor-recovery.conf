# The banner fragment agetty prints at the login on tty1. It links to the file that
# athanor-recovery-notice.service writes when the desktop did not start, so it dangles at every
# other boot, and agetty passes over a link that points at nothing.
d /etc/issue.d 0755 root root -
L /etc/issue.d/50-athanor-recovery.issue - - - - /run/athanor-recovery/recovery.issue
