[package]
name = "athanor-shelld"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "The shell's headless daemon: desktop notifications and the StatusNotifier watcher"
authors = ["Athanor Forge <forge@athanor.os>"]

[dependencies]
athanor-i18n = { path = "../../../../system/athanor-i18n" }
athanor-services = { path = "../../../../system/athanor-services" }
athanor-unit = { path = "../../../../system/athanor-unit" }
futures-util = { workspace = true }
nix = { workspace = true, features = ["fs", "inotify", "time"] }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zbus = { workspace = true }
zvariant = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
