# Athanor: the hostname stays off the network (NetworkManager)
# Location: /usr/lib/NetworkManager/conf.d/50-athanor-hostname.conf
#
# Outgoing: DHCP requests do not carry the machine's hostname.
# Incoming: hostname-mode=none stops NetworkManager from setting a transient
# hostname taken from DHCP or reverse DNS, which would name the machine after the
# network it is on. Without a static hostname systemd uses DEFAULT_HOSTNAME from
# os-release ("athanor") until the user names the device in Settings, About.
#
# Captive portals: NetworkManager's connectivity check (20-connectivity-fedora.conf)
# stays on. With systemd-resolved it resolves its host per link, through the DNS
# servers the network hands out, not through the global resolver. Those servers
# rarely offer DNS over TLS, so the link default below is opportunistic
# (connection.dns-over-tls=1): strict mode there would make the check fail and the
# portal go unnoticed. Only the check and the network's own search domains use that
# path, because "~." in 50-athanor-dns.conf sends everything else to the global
# servers. The portal login page is another matter: until
# the user signs in, most portals block port 853 and external resolvers, so the
# page cannot be opened by name. Open it by address (the portal's redirect shows
# it, or use the gateway address), or lower DNS protection temporarily with a
# drop-in /etc/systemd/resolved.conf.d/60-portal.conf holding "[Resolve]", then
# "DNSOverTLS=no", "DNS=" and "Domains=" (empty values reset the defaults), then "systemctl restart systemd-resolved", and delete it
# after signing in.

[main]
# Let systemd-resolved receive the DNS data of each link from NetworkManager,
# instead of NetworkManager writing /etc/resolv.conf: the global servers and the
# "~." routing domain in 50-athanor-dns.conf then take precedence over link DNS.
dns=systemd-resolved
hostname-mode=none

[connection]
connection.dns-over-tls=1
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
