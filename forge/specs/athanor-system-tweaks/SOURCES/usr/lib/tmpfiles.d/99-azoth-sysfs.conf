# Athanor OS: Kernel Sysfs Awakening
# Questo file si assicura che le capabilities avanzate del kernel vengano effettivamente
# accese durante il boot tramite il subsystem systemd-tmpfiles.

# KSM (Kernel Samepage Merging) is not enabled here: it stays off (kernel default) and only
# roles that host VMs turn it on (doc_kernel_profile.md, KSM).

# Ottimizzazione MGLRU (Multi-Gen LRU)
# Assicura che MGLRU sia abilitato (y) e che utilizzi le ottimizzazioni hardware (se supportate)
w /sys/kernel/mm/lru_gen/enabled - - - - y
