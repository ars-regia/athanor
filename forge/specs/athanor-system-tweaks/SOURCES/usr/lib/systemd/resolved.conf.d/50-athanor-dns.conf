# Athanor: opportunistic DNS over TLS with a chosen resolver (systemd-resolved)
# Location: /usr/lib/systemd/resolved.conf.d/50-athanor-dns.conf
#
# Override: put a drop-in in /etc/systemd/resolved.conf.d/ whose name sorts after
# "50-athanor-dns.conf" (for example 60-local.conf) and run
# "systemctl restart systemd-resolved". An empty assignment ("DNS=") clears the
# value set here; see resolved.conf.d(5). Example, to use another resolver:
#
#   [Resolve]
#   DNS=
#   DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com
#
# Mode: opportunistic until the captive-portal probe ships, then strict
# (ADR-0103 D11, amending ADR-0079 item 1). Opportunistic tries DNS over TLS and
# falls back to plain DNS when port 853 is blocked, so a captive portal can be
# reached and a wrong clock does not stop name resolution. Once the probe ships
# this becomes "DNSOverTLS=yes" and name resolution fails closed. Behind a
# captive portal, see the note in the NetworkManager drop-in 50-athanor-hostname.conf.
#
# "~." and other DNS servers: link and VPN DNS servers, whether handed out by DHCP
# or set by the user in a connection, serve only the domains of that link. To get
# internal names from a VPN's DNS server, give the connection a route-only search
# domain ("nmcli connection modify <vpn> ipv4.dns-search '~corp.example'"), or a
# negative ipv4.dns-priority, which makes NetworkManager add "~." to that link.
# Once DNS over TLS is strict (see Mode) the recipe needs one more thing: either the
# internal DNS server offers DNS over TLS with a certificate valid for its name, or
# the VPN profile sets connection.dns-over-tls to opportunistic (1) or no (0), which
# weakens DNS protection for that VPN's domains only. This VPN recipe has not been
# tested on a real VPN.

[Resolve]
# Opportunistic DNS over TLS (ADR-0103 D11, ADR-0079): falls back to plain DNS when
# port 853 is blocked. The name after '#' is the TLS server name once the mode is strict.
DNSOverTLS=opportunistic

# Quad9 (default resolver), IPv4 then IPv6, each with its TLS server name.
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net

# Routing domain for every name: queries go to the servers above. A link still
# receives queries for the search and routing domains it carries, and a network can
# hand out search domains over DHCP; once DNS over TLS is strict those queries fail
# rather than fall back to plain DNS.
Domains=~.

# Validate answers with DNSSEC, but accept an unsigned answer when the resolver or
# a middlebox cannot validate, so a broken router does not cut off name resolution.
# Together with opportunistic DNS over TLS this leaves no protection against an
# on-path attacker (who can block port 853 and strip signatures) until the mode is
# strict; ADR-0103 D11 accepts this.
DNSSEC=allow-downgrade

# Local resolution. Multicast DNS is off in resolved, on every connection: .local names resolve
# through avahi and nss-mdns (mdns4_minimal in nsswitch.conf, IPv4). The machine never announces
# itself (avahi's disable-publishing, system/Containerfile), and the firewall's public zone, the
# default, lets no mDNS in; the home zone does (athanor-base-config, zones/public.xml).
Cache=yes
MulticastDNS=no
LLMNR=no
