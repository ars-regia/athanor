# Athanor: strict DNS over TLS with a chosen resolver (systemd-resolved)
# Location: /usr/lib/systemd/resolved.conf.d/50-athanor-dns.conf
#
# Override: put a drop-in in /etc/systemd/resolved.conf.d/ whose name sorts after
# "50-athanor-dns.conf" (for example 60-local.conf) and run
# "systemctl restart systemd-resolved". An empty assignment ("DNS=") clears the
# value set here; see resolved.conf.d(5). Example, to use another resolver:
#
#   [Resolve]
#   DNS=
#   DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com
#
# Name resolution fails closed: when port 853 is blocked no name resolves, by
# design. Behind a captive portal, see the note in the NetworkManager drop-in
# 50-athanor-hostname.conf.

[Resolve]
# Strict DNS over TLS: the server certificate must match the name after '#'.
DNSOverTLS=yes

# Quad9 (default resolver), IPv4 then IPv6, each with its TLS server name.
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net

# Routing domain for every name: queries go to the servers above, never to the DNS
# servers a network hands out over DHCP or router advertisements. Such a link still
# receives queries for its own search domains (intranet names).
Domains=~.

# Validate answers with DNSSEC, but accept an unsigned answer when the resolver or
# a middlebox cannot validate, so a broken router does not cut off name resolution.
DNSSEC=allow-downgrade

# Local resolution.
Cache=yes
MulticastDNS=resolve
LLMNR=no
