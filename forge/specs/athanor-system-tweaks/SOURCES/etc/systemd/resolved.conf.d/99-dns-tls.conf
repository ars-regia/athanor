# Athanor: DNS-over-TLS and name resolution hardening (systemd-resolved)
# Location: /etc/systemd/resolved.conf.d/99-dns-tls.conf

[Resolve]
# DNS-over-TLS when the server offers it, plain DNS when port 853 is blocked.
# Strict mode (yes) left the installed system unable to resolve any name on networks
# that block port 853.
DNSOverTLS=opportunistic

# Primary resolvers, with the TLS server name after '#'.
DNS=1.1.1.1#cloudflare-dns.com 9.9.9.9#dns.quad9.net 2606:4700:4700::1111#cloudflare-dns.com 2620:fe::fe#dns.quad9.net

# Fallback resolvers.
FallbackDNS=1.0.0.1#cloudflare-dns.com 149.112.112.112#dns.quad9.net 2606:4700:4700::1001#cloudflare-dns.com 2620:fe::9#dns.quad9.net

# Validate answers with DNSSEC.
DNSSEC=yes

# Local resolution.
Cache=yes
MulticastDNS=resolve
LLMNR=no
