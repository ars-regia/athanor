# Every filesystem udisks mounts is mounted noexec (ADR-0025; doc_disks.md DK20 B; the udisks
# exception of doc_kernel_profile.md D23). udisks adds nodev and nosuid to every mount itself
# (src/udiskslinuxfilesystem.c, "uhelper=udisks2,nodev,nosuid"), so they are not repeated here.
#
# Only the global `defaults` key is set. The per-filesystem keys of udisks's built-in
# configuration (vfat_defaults, exfat_defaults and the rest: uid=, gid=, charset) are kept, and
# the global defaults are appended to them (src/udiskslinuxmountoptions.c, append_fs_mount_options).
# A caller that passes `exec` for one mount still gets it, because its options follow these.
# udisksd reads only /etc/udisks2/mount_options.conf (no vendor path under /usr in 2.11).
[defaults]
defaults=noexec
