# Athanor: MAC address randomisation (NetworkManager)
# Location: /etc/NetworkManager/conf.d/99-mac-randomization.conf

[device]
# Use a random MAC address in Wi-Fi scan probe requests.
wifi.scan-rand-mac-address=yes

[connection]
# Wi-Fi uses a new random MAC address on every connection.
wifi.cloned-mac-address=random
# Ethernet keeps the NetworkManager default (the hardware address). A random or
# per-network address on a wired link breaks hypervisors that filter spoofed source
# addresses (Hyper-V by default), DHCP reservations and 802.1X port authentication,
# for little privacy gain on a cable the user chose to plug in.
