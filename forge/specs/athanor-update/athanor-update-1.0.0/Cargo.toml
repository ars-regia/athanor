[package]
name = "athanor-update"
version = "1.0.0"
edition = "2021"
authors = ["Athanor Forge <forge@athanor.os>"]
description = "Checks, downloads and applies Athanor system image updates, and publishes the trust state"
license = "GPL-3.0-or-later"

[dependencies]
athanor-trust-state = { path = "../../../../system/athanor-trust-state" }
athanor-bus-api = { path = "../../../../system/athanor-bus-api" }
# The panic hook (`athanor_unit::panic`).
athanor-unit = { path = "../../../../system/athanor-unit" }
zbus = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
p256 = { version = "0.14", features = ["ecdsa", "pem"] }
base64 = "0.23"
jiff = { workspace = true }
