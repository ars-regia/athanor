<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="os.athanor.Update1"/>
  </policy>
  <!-- Four acting methods, one read method and introspection, nothing else: no Properties,
       no Peer. Polkit decides who may call Apply, GoBack, Postpone and
       SetAutomaticSecurityUpdates (doc_update_trust.md, UT6, UT13); State returns the
       published trust state, which is not secret, to anyone. -->
  <policy context="default">
    <allow send_destination="os.athanor.Update1" send_interface="os.athanor.Update1" send_member="Apply"/>
    <allow send_destination="os.athanor.Update1" send_interface="os.athanor.Update1" send_member="GoBack"/>
    <allow send_destination="os.athanor.Update1" send_interface="os.athanor.Update1" send_member="Postpone"/>
    <allow send_destination="os.athanor.Update1" send_interface="os.athanor.Update1" send_member="SetAutomaticSecurityUpdates"/>
    <allow send_destination="os.athanor.Update1" send_interface="os.athanor.Update1" send_member="State"/>
    <allow send_destination="os.athanor.Update1" send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
  </policy>
</busconfig>
