# The socket unit creates %t/pulse, and systemd makes a parent directory 0755 unless told
# otherwise. libpulse insists on 0700 and chmods the directory before it connects; the bar
# sees %t read-only (ProtectHome=read-only), so its chmod fails with EROFS and the bar never
# finds the sound server until another client has started pipewire-pulse and fixed the mode.
[Socket]
DirectoryMode=0700
