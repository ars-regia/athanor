[package]
name = "athanor-bar"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "The Athanor bar: one layer-shell surface per output with the modules of doc_bar.md"
authors = ["Athanor Forge <forge@athanor.os>"]

[dependencies]
athanor-apps = { path = "../../../../system/athanor-apps" }
athanor-compositor-client = { path = "../../../../system/athanor-compositor-client" }
athanor-i18n = { path = "../../../../system/athanor-i18n" }
athanor-layout = { path = "../../../../system/athanor-layout" }
athanor-services = { path = "../../../../system/athanor-services" }
athanor-style = { path = "../../../../system/athanor-style" }
athanor-trust-state = { path = "../../../../system/athanor-trust-state" }
athanor-unit = { path = "../../../../system/athanor-unit" }
gio-unix = { workspace = true }
# TimeZone::from_identifier, which reports an unknown zone instead of silently giving UTC.
glib = { workspace = true, features = ["v2_68"] }
gtk4 = { workspace = true }
gtk4-layer-shell = { workspace = true }
# O_NONBLOCK for picture files a peer names: a FIFO must not hang the bar.
libc = { workspace = true }
# The channels the models of athanor-services publish on, awaited from the GLib main loop.
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
