[package]
name = "athanor-cloud-rs"
version = "1.0.0"
license = "GPL-3.0-or-later"
edition = "2021"
description = "Athanor OS Continuity & Local P2P Sync Daemon"

[dependencies]
tokio = { workspace = true, features = ["full"] }
zbus = { workspace = true }
athanor-bus-api = { path = "../../../../system/athanor-bus-api" }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
pqc_dilithium = { workspace = true }
pqc_kyber = { workspace = true }
sha2 = { workspace = true }
rand_core = "0.6"
base64 = "0.21"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true }
zeroize = { workspace = true, features = ["zeroize_derive"] }
subtle = { workspace = true }



[target.'cfg(not(target_os = "hermit"))'.dependencies]


[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"


