[package]
name = "athanor-layout-chooser"
version = "1.0.0"
edition = "2021"
authors = ["Athanor Forge <forge@athanor.os>"]
license = "GPL-3.0-or-later"
description = "The Athanor layout chooser: three presets and two knobs, written to the user's layout document"

[dependencies]
athanor-i18n = { path = "../../../../system/athanor-i18n" }
athanor-layout = { path = "../../../../system/athanor-layout" }
athanor-sal = { path = "../../../../system/athanor-sal" }
athanor-style = { path = "../../../../system/athanor-style", default-features = false }
landlock = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# The zbus the toolkit's AT-SPI bridge, accesskit_unix, already runs on its own executor, with
# the blocking API: the workspace's zbus would bring a tokio runtime to this binary.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
