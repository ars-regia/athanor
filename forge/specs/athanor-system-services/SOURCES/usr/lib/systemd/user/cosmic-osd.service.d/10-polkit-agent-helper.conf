# INTERIM, see https://github.com/hr-mes/athanor/issues/144.
#
# cosmic-osd hosts the session's polkit authentication agent. The agent runs the setuid
# polkit-agent-helper-1 (polkit 126 in the base image) to check the password, and a
# setuid binary cannot raise privileges under NoNewPrivileges=true or
# RestrictSUIDSGID=true, so every password prompt of the session failed.
#
# In a user manager every option that installs a seccomp filter implies
# NoNewPrivileges=yes unless it is set to no (systemd.exec(5)). Switching the two
# settings off is therefore not enough: the filters below are cleared with them. Nothing
# else of the unit is touched; the mount and namespace sandbox stays.
#
# Exit condition: remove this drop-in when polkit >= 127 with polkit-agent-helper.socket
# (a socket-activated helper that needs no setuid) is in the base image.
[Service]
NoNewPrivileges=no
RestrictSUIDSGID=no
SystemCallFilter=
LockPersonality=no
RestrictRealtime=no
ProtectKernelModules=no
ProtectKernelLogs=no
