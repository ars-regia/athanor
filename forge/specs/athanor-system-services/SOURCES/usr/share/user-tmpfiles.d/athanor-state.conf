# The user's state directories that share their name with a configuration directory.
# systemd 254 and later links a unit's missing StateDirectory= to an existing
# ConfigurationDirectory= of the same name, and the state then lives in ~/.config (#1238).
# systemd-tmpfiles --user runs before basic.target, so these exist before any unit starts.
# A link already in place is left alone: the tmpfiles line only warns about it.
d %S/athanor - - - -
d %S/cosmic - - - -
