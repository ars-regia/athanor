[package]
name = "athanor-dock"
version = "1.0.0"
license = "GPL-3.0-or-later"
edition = "2021"
authors = ["Athanor Forge <forge@athanor.os>"]
description = "Visual Dock and taskbar application logic for Athanor OS"
workspace = ".."

[dependencies]
gtk4 = { workspace = true }
gtk4-layer-shell = { workspace = true }
glib = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
notify = "6.1.1"
athanor-style = { path = "../athanor-style-0.7" }
athanor-niri-ipc = { path = "../../athanor-niri-ipc" }
anyhow = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"
