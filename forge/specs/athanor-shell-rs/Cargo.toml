# The frozen workspace of the old shell (doc_shell.md, SH4; decision of 2026-09-19).
# athanor-shell-rs is not ported to GTK 0.11: it stays here at GTK 0.7 with its own lock
# file and is mined for the code worth keeping until it is empty, then deleted.
# The dependency table is the root's as of the freeze. Do not bump it.
[workspace]
members = [
    "athanor-shell-rs-1.0.0",
    "athanor-style-0.7",
    "athanor-dock-0.7"
]
resolver = "2"

[workspace.dependencies]
# Async Runtime & Core Utilities
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.13", features = ["codec"] }
async-trait = "0.1.91"
futures-util = "0.3.30"
bytes = "1.10.1"
libc = "0.2.189"

# D-Bus & Inter-Process Communication
zbus = { version = "5.18.0", features = ["tokio"] }
notify-rust = "4.11"

# HTTP & Network Clients
reqwest = { version = "0.13.4", features = ["stream", "rustls", "json"] }

# GUI, Display & Wayland Ecosystem
gtk4 = "0.7.3"
gtk4-layer-shell = "0.2.0"
glib = "0.18.5"
relm4 = "0.7.1"
smithay = { version = "0.3.0", default-features = false }
wayland-server = "0.31.0"

# Serialization & Error Handling
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
anyhow = "1.0.99"

# Logging & Telemetry
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
log = "0.4.29"
env_logger = "0.11.11"

# Post-Quantum & Security Cryptography
pqc_kyber = "0.7.1"

pqc_dilithium = "0.2.0"
sha2 = "0.10.9"
ml-kem = "0.3.2"
hex = "0.4.3"
zeroize = "1.8.1"
subtle = "2.6.1"

# eBPF / Kernel Instrumentation
aya = "0.13.1"

# System Utilities & CLI
glam = "0.29.0"
nix = "0.29.0"
clap = { version = "4.6.4", features = ["derive"] }
mimalloc = { version = "0.1.43", default-features = false }
rand = "0.8.5"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
rpath = false
overflow-checks = true




