# Frozen copy of system/athanor-style as of 2026-09-19, at GTK 0.7, for the old shell
# and dock only (doc_shell.md, SH4). The live crate moves to GTK 0.11, and one dependency
# graph links one gtk4-sys. Do not develop here: this directory is deleted with the shell.
[package]
name = "athanor-style"
version = "1.0.0"
license = "GPL-3.0-or-later"
edition = "2021"
description = "Centralized Glassmorphism, Accent Color Engine, and Appearance Layout System for Athanor OS"
authors = ["Athanor Architect <architect@athanor.os>"]

[dependencies]
gtk4 = { workspace = true }
gtk4-layer-shell = { workspace = true }
glib = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "0.8"
zbus = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"
