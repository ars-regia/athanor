# Athanor's greenboot configuration (docs/architecture/doc_recovery.md, R5). Installed as
# /usr/share/athanor-system-config/greenboot.conf and linked to /etc/greenboot/greenboot.conf
# by tmpfiles.d, because greenboot owns the /etc file.

## Generic
# Not used while GREENBOOT_AUTO_REBOOT is false; kept at greenboot's default.
GREENBOOT_MAX_BOOT_ATTEMPTS=3

# Never reboot the machine (A2-8, A2-26). A required check that fails after an update marks
# the new deployment bad: the previous one becomes the default, and the next restart, which
# the user starts, boots it.
GREENBOOT_AUTO_REBOOT=false

# Checks of greenboot-default-health-checks that do not apply to Athanor. Updates come from
# the OCI registry through bootc and its signature policy (doc_update_trust.md, UT3), not from
# OSTree remotes or rpm-ostree platforms: 01_repository_dns_check.sh resolves the hosts of the
# OSTree remotes, which a machine started offline cannot do, so a good update would be marked
# bad, and 01_update_platforms_check.sh reports no platform on every boot.
DISABLED_HEALTHCHECKS=("01_repository_dns_check.sh" "01_update_platforms_check.sh")
