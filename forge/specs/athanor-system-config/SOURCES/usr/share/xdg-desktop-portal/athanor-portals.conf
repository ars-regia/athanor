# Portal backends of the Athanor session (XDG_CURRENT_DESKTOP=Athanor:COSMIC).
# Every interface is routed by name: no backend is chosen by UseIn matching.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
# Screen capture has no backend until Athanor's own portal ships (doc_portal.md).
# A request is refused instead of answered by a backend that does not capture.
org.freedesktop.impl.portal.ScreenCast=none
org.freedesktop.impl.portal.Screenshot=none
org.freedesktop.impl.portal.RemoteDesktop=none
