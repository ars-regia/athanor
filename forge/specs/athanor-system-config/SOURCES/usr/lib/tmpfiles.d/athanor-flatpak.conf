# The system Flatpak installation. The flatpak package ships /var/lib/flatpak, but bootc
# seeds /var from the image on the first deployment only, so a machine installed before the
# package arrived has none. athanor-flatpak-triggers.service writes only the exports.
d /var/lib/flatpak 0755 root root -
d /var/lib/flatpak/exports 0755 root root -
