# The desktop's name, read by the systemd user manager before it starts any unit.
# xdg-desktop-portal reads it once, when it starts, to choose athanor-portals.conf; a
# portal activated before athanor-desktop imports the session environment would
# otherwise run with no desktop name and route every interface to its fallbacks for
# the rest of the session. athanor-session exports the same value for the compositor
# and its children, which are not units; keep the two equal.
XDG_CURRENT_DESKTOP=Athanor:COSMIC

# GTK 4.20's wayland input-method module, which GTK 4 picks whenever the compositor
# offers text-input-v3, composes nothing by itself: with no input method running,
# dead keys and Compose sequences are dropped (US-International loses every accent).
# The simple module composes them. doc_languages.md LN11: set while no input-method
# engine is enabled, unset when athanor-ime.service runs, since IBus composes then.
# Applications D-Bus activates (Ptyxis, Text Editor) start from the user manager, not
# from athanor-session; keep the two equal.
GTK_IM_MODULE=simple
