# Overrides the nix-daemon package's /usr/lib/tmpfiles.d/nix-daemon.conf: a file of the
# same name in /etc replaces it entirely.
#
# The Fedora rules create /nix/var/nix/daemon-socket and /nix/var/nix/builds. On this
# image /nix is the read-only ostree directory until nix.mount bind-mounts /var/nix onto
# it, and nix.mount is ordered after systemd-tmpfiles-setup, so those rules can only fail.
# The same directories are created in the backing store instead, where the bind mount
# exposes them at the paths the daemon expects, with the same modes and ages.
d /var/nix/var/nix/daemon-socket 0755 root root -  -
d /var/nix/var/nix/builds        0755 root root 7d -
# The directory of the collector's socket for temporary roots. Nix creates it on demand, as
# nix_daemon_t, and it would inherit nix_var_t from its parent; systemd-tmpfiles labels it
# from the file contexts (nix_socket_t, the type the daemon may create the socket in), on a
# fresh /var/nix and on a store that already has it.
d /var/nix/var/nix/gc-socket     0755 root root -  -
