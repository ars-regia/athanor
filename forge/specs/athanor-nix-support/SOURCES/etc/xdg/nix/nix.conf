# Nix client configuration for every user on Athanor (doc_software.md, SW9; #154,
# decision A2-13). The nix command reads it after /etc/nix/nix.conf and before
# ~/.config/nix/nix.conf. Store settings belong in the daemon's configuration
# (/usr/share/athanor/nix/daemon/nix.conf and /etc/nix/nix.conf), not here: the daemon
# ignores them from users who are not trusted.

# The registry and the flake commands need these two features, and nothing else does.
experimental-features = nix-command flakes

# nixpkgs resolves to the revision Athanor pins, offline and the same for every user,
# instead of the network registry at channels.nixos.org.
flake-registry = /usr/share/athanor/nix/registry.json
