# Athanor's settings for Fedora's nix-daemon.service (doc_software.md, SW9; #154,
# decision A2-13).
#
# Hardening kept to what was tested: a sandboxed Nix build (user namespace, fresh /proc,
# sethostname, loopback up) succeeded in a unit carrying each option below, and with all
# of them together. The daemon's builders inherit its seccomp filters and mount
# namespace, so an option that breaks one build breaks all of them. Left out:
# - ProtectKernelTunables=, ProtectKernelLogs= (tested, break builds): both over-mount
#   parts of /proc, the kernel then refuses the sandbox's fresh /proc, and every build
#   fails with "this system does not support the kernel namespaces that are required
#   for sandboxing".
# - ProtectHostname= (tested, breaks builds): its filter refuses the sandbox's
#   sethostname ("cannot set host name: Operation not permitted").
# - ProtectControlGroups=, SystemCallArchitectures=native, LockPersonality=,
#   MemoryDenyWriteExecute=: the probe build passed, but it does not exercise what they
#   would break, so they are not shipped untested: the use-cgroups support of builds
#   writes /sys/fs/cgroup under Fedora's Delegate=yes, i686 builds run 32-bit code with
#   the 32-bit personality, and builds run JIT compilers (GHC, LuaJIT, Java).
# - NoNewPrivileges=: stays off on purpose. The unit enters nix_daemon_t through a domain
#   transition from init_t on /usr/bin/nix, and with no_new_privs set that transition needs
#   nnp_transition from init_t, a permission granted for no other service domain. The
#   capability bounding set below and nix_daemon_t carry the confinement instead; the daemon
#   never executes setuid programs itself, and its builders get no_new_privs from the sandbox.
# - ProtectSystem=, ProtectHome=, PrivateTmp=: not tested. The daemon is root and manages
#   the store, GC roots in users' homes and its build directories; the Nix sandbox confines
#   builds and SELinux confines the daemon (nix_daemon_t).

[Service]
Environment=NIX_CONF_DIR=/usr/share/athanor/nix/daemon
# The narinfo cache, out of root's home.
Environment=NIX_CACHE_HOME=/var/cache/nix
CacheDirectory=nix

# A build must not take the desktop down: memory pressure above three quarters of RAM
# throttles the daemon and its builds, and they get half the CPU and I/O weight of the
# session. Fedora's unit sets TasksMax=1048576.
MemoryHigh=75%
CPUWeight=50
IOWeight=50
TasksMax=16384

ProtectKernelModules=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK

# The daemon keeps only the capabilities it uses, derived from the Nix 2.31 sources
# (src/libstore/unix/build/derivation-builder.cc and linux-derivation-builder.cc, src/libstore/
# posix-fs-canonicalise.cc, gc.cc and src/libutil/unix/processes.cc of the 2.31-maintenance
# branch):
# - CAP_SETUID, CAP_SETGID: setgroups, setgid and setuid to the build user (derivation-builder.cc
#   1308-1315), setuid to the sandbox uid (linux-derivation-builder.cc 757-760), killUser
#   (processes.cc 128).
# - CAP_CHOWN: build directory, pty and sockets handed to the build user (derivation-builder.cc
#   810, 1178, 1186), output paths taken back to root (posix-fs-canonicalise.cc 124-126).
# - CAP_FOWNER: chmod of paths owned by the build user (posix-fs-canonicalise.cc 27;
#   derivation-builder.cc 2032-2033).
# - CAP_DAC_OVERRIDE: the daemon walks, canonicalises and deletes build directories and outputs
#   that belong to the build user and may carry mode 0000 or 0700.
# - CAP_KILL: signals to the builder's process group, which runs as the build user
#   (processes.cc 71).
# - CAP_SYS_ADMIN: the sandbox's mounts, bind mounts, pivot_root, unshare of the mount, PID,
#   IPC, UTS, network (and cgroup) namespaces, setns and sethostname
#   (linux-derivation-builder.cc 211, 440-444, 551, 565-587, 665-743, 794-797).
# - CAP_SYS_CHROOT: chroot into the sandbox (linux-derivation-builder.cc 740).
# - CAP_NET_ADMIN: bringing up the loopback interface of the sandbox's network namespace
#   (SIOCSIFFLAGS, linux-derivation-builder.cc 545).
# - CAP_SYS_PTRACE, CAP_DAC_READ_SEARCH: the garbage collector reads /proc/<pid>/{exe,cwd,fd,
#   maps,environ} of every process to find runtime roots (gc.cc 357-398); without them a root
#   of another user is invisible and what it holds is deleted.
# Left out, which the SELinux policy also does not need to grant the daemon: CAP_SETPCAP,
# CAP_FSETID, CAP_SYS_RESOURCE, CAP_MKNOD (devices are bound in, never created).
# UNVERIFIED: written from the source, never run under the root system daemon (no such daemon
# on the machine that prepared it). The acceptance VM must run a sandboxed build and a
# fixed-output fetch through the system daemon (nix-base-report.md, section 4); a missing
# capability shows up as EPERM in the daemon's journal.
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_CHOWN CAP_FOWNER CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH CAP_KILL CAP_SYS_ADMIN CAP_SYS_CHROOT CAP_NET_ADMIN CAP_SYS_PTRACE

[Unit]
# A failed relabel of the store (athanor-nix-relabel.service) must keep the daemon down,
# instead of serving a store labelled with types nix_daemon_t cannot use. Requires= makes the
# daemon fail with "dependency" and After= orders it behind the relabel. A relabel that does
# not run (no SELinux, or already done) is a skipped condition, which Requires= treats as met.
Requires=athanor-nix-relabel.service
After=athanor-nix-relabel.service
