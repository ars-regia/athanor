# Programs and desktop entries from Nix profiles, for every session (doc_software.md,
# SW10; #154). The user's profile comes before the system's paths, as with Nix's own
# shell profile; the system-wide default profile follows it. Data directories are
# appended, so a desktop entry from Nix never shadows one from the image.
PATH=${HOME}/.nix-profile/bin:/nix/var/nix/profiles/default/bin:${PATH}
XDG_DATA_DIRS=${XDG_DATA_DIRS:-/usr/local/share:/usr/share}:${HOME}/.nix-profile/share:/nix/var/nix/profiles/default/share
