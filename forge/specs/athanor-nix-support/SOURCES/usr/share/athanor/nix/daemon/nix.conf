# nix-daemon's configuration on Athanor (doc_software.md, SW9; #154, decision A2-13).
#
# The daemon reads this file instead of /etc/nix/nix.conf: its drop-in sets NIX_CONF_DIR to
# this directory. /etc/nix/nix.conf belongs to Fedora's nix-core package, and two packages
# never own the same path, so Athanor's settings live here and the administrator's file is
# included in the middle, and the later setting wins:
# - above the include, the defaults an administrator may change (resource limits, store
#   housekeeping, the files NIX_CONF_DIR moves): /etc/nix/nix.conf overrides them;
# - below the include, the security settings: nothing in /etc/nix/nix.conf, whether Fedora's
#   or the administrator's, can weaken them. Their values are then the only ones in force.

# When free space in the store falls below min-free during a build, the daemon collects
# garbage until max-free is free.
min-free = 2G
max-free = 8G

# NIX_CONF_DIR also moves the defaults of these two; keep them in /etc/nix.
netrc-file = /etc/nix/netrc
builders = @/etc/nix/machines

!include /etc/nix/nix.conf

# Only root may change restricted settings or import unsigned paths; every user may
# connect. Users are not trusted: their store settings are ignored by the daemon.
trusted-users = root
allowed-users = *

# Builds run in the sandbox or not at all, as the build users of nixbld.
sandbox = true
sandbox-fallback = false
build-users-group = nixbld
