# Which backend serves each portal interface in the Athanor session (doc_portal.md, PT1).
# The session announces XDG_CURRENT_DESKTOP=Athanor:COSMIC, so xdg-desktop-portal reads this
# file and no other. `default=none`: an interface not listed here is not offered, and no
# backend is chosen by its `UseIn` key or as a last resort.
#
# Interim table of construction step 1 (PT18): FileChooser, Access and Inhibit stay on gtk
# until the athanor backend implements them (steps 2 and 3), ScreenCast is off until step 5.
# Screenshot and Background name athanor, whose portal file does not list them yet: until it
# does, neither is offered.
[preferred]
default=none
org.freedesktop.impl.portal.Settings=athanor
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Access=gtk
org.freedesktop.impl.portal.Inhibit=gtk
org.freedesktop.impl.portal.Screenshot=athanor
org.freedesktop.impl.portal.ScreenCast=none
org.freedesktop.impl.portal.Background=athanor
org.freedesktop.impl.portal.AppChooser=gtk
org.freedesktop.impl.portal.Print=gtk
org.freedesktop.impl.portal.Account=gtk
org.freedesktop.impl.portal.Email=gtk
org.freedesktop.impl.portal.DynamicLauncher=gtk
org.freedesktop.impl.portal.Notification=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.Wallpaper=none
org.freedesktop.impl.portal.GlobalShortcuts=none
org.freedesktop.impl.portal.RemoteDesktop=none
org.freedesktop.impl.portal.InputCapture=none
org.freedesktop.impl.portal.Clipboard=none
org.freedesktop.impl.portal.Usb=none
org.freedesktop.impl.portal.Lockdown=none
