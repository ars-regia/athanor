[package]
name = "xdg-desktop-portal-athanor"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Athanor's backend for xdg-desktop-portal (doc_portal.md)"
authors = ["Athanor Forge <forge@athanor.os>"]

[dependencies]
athanor-portal = { path = "../../../../system/athanor-portal" }
# The outputs' pictures for a screenshot (doc_portal.md, PT8), without GTK.
athanor-sulphur-client = { path = "../../../../system/athanor-sulphur-client", default-features = false, features = ["capture"] }
athanor-unit = { path = "../../../../system/athanor-unit", features = ["watchdog"] }
gio = { workspace = true }
glib = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
wayland-client = { workspace = true }
zbus = { workspace = true }

[lints]
workspace = true
