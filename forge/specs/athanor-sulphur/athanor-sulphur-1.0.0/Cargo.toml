[package]
name = "athanor-sulphur"
version = "1.0.0"
edition = "2021"
authors = ["Athanor Forge <forge@athanor.os>"]
license = "GPL-3.0-or-later"
description = "Athanor's Wayland compositor on Smithay (doc_own_stack.md, milestone C1)"

[dependencies]
# Readiness for the `Type=notify` unit of the preview session (`ready.rs`).
athanor-unit = { path = "../../../../system/athanor-unit" }
# A monitor's make, model and serial from the EDID blob of its connector (`udev.rs`); the same
# parser names the monitor to athanor-osd (doc_osd.md OD4).
athanor-edid = { path = "../../../../system/athanor-edid" }
# The generated code of Athanor's own protocols (`toplevel_state.rs`), and the fixture's
# client bindings of them: the bitfield enums need bitflags.
bitflags = { workspace = true }
wayland-scanner = { workspace = true }
# The revision and its date are in README.md; deny.toml admits this URL and no other git source.
smithay = { git = "https://github.com/Smithay/smithay", rev = "62ec78dbe742cc59e7a1cb4ce2b52b4292b531d9", default-features = false, features = ["backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev", "backend_winit", "desktop", "renderer_multi", "renderer_pixman", "wayland_frontend"] }
# The DRM backend's connector scan, from the same repository and revision; without
# libdisplay-info, so an output is named by its connector only.
smithay-drm-extras = { git = "https://github.com/Smithay/smithay", rev = "62ec78dbe742cc59e7a1cb4ce2b52b4292b531d9", default-features = false }
libc = { workspace = true }
# The signalfd source that ends the event loop on SIGTERM and SIGINT (`shutdown.rs`); it is
# Smithay's calloop, and nix is already a dependency.
calloop = { workspace = true, features = ["signals"] }
# The watch of `xkb_config` (`xkb_config.rs`).
nix = { workspace = true, features = ["inotify"] }
# The lock request to logind (`lock.rs`), a blocking call on its own thread, and
# WAYLAND_DISPLAY to the user manager (`ready.rs`), each in a `zbus::block_on` call: the
# multi-threaded runtime keeps serving the keyboard monitor's connection between those calls.
zbus = { workspace = true, features = ["tokio-multithread"] }
# The keyboard monitor's reader of name changes (`keyboard_monitor.rs`).
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# The pointer's themed cursor (`cursor.rs`); already in the build through wayland-cursor.
xcursor = { workspace = true }

[dev-dependencies]
# Its Wayland side is tested on the fixture (doc_session_daemons.md, SD22, I3).
athanor-idle = { path = "../../../../system/athanor-idle" }
wayland-client = { workspace = true }
# The fixture binds the unstable protocols: tablet, pointer gestures, decoration, foreign.
wayland-protocols = { workspace = true, features = ["unstable"] }
wayland-protocols-wlr = { workspace = true }
