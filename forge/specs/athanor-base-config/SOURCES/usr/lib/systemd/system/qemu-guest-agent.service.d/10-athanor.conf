# Once a person turns the agent on (ADR-0144), the host may ask only for what a hypervisor
# needs: the guest's addresses, name, system and time, a consistent snapshot (freeze and
# thaw), trim and shutdown. Running commands, reading or writing files, setting passwords
# and SSH keys, suspend and changing CPUs or memory are refused. A QEMU_GA_ARGS line in
# /etc/sysconfig/qemu-ga, read after this, replaces the list: that is the person's choice.
# NoNewPrivileges=yes keeps Fedora's confined domain, virt_qemu_ga_t, only because
# athanor-selinux's athanor_qemu_ga.cil grants init_t its nnp_transition; without that rule
# the agent would run in init_t.
[Service]
Environment=QEMU_GA_ARGS=--allow-rpcs=guest-sync-delimited,guest-sync,guest-ping,guest-info,guest-get-osinfo,guest-get-host-name,guest-get-timezone,guest-get-time,guest-set-time,guest-network-get-interfaces,guest-get-fsinfo,guest-fsfreeze-status,guest-fsfreeze-freeze,guest-fsfreeze-freeze-list,guest-fsfreeze-thaw,guest-fstrim,guest-shutdown
NoNewPrivileges=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
