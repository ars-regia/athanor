# Athanor: the helper authenticates through system-auth, whose pam_faillock records and
# reads each user's tally in /run/faillock. ProtectSystem=strict in the upstream unit makes
# that directory read-only, so once a user has a tally file every polkit prompt fails
# (issue #144). The helper may write there and nowhere else; pam's tmpfiles.d creates it.
[Service]
ReadWritePaths=/run/faillock
