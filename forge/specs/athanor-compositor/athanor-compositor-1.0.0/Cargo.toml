[package]
name = "athanor-compositor"
version = "1.0.0"
edition = "2021"
authors = ["Athanor Forge <forge@athanor.os>"]
license = "GPL-3.0-or-later"
description = "Athanor's Wayland compositor on Smithay (doc_own_stack.md, milestone C1)"

[dependencies]
# The revision and its date are in README.md; deny.toml admits this URL and no other git source.
smithay = { git = "https://github.com/Smithay/smithay", rev = "023b78b1c5a05ca512767cacc07efca55fae8be4", default-features = false, features = ["backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev", "backend_winit", "desktop", "renderer_multi", "renderer_pixman", "wayland_frontend"] }
# The DRM backend's connector scan, from the same repository and revision; without
# libdisplay-info, so an output is named by its connector only.
smithay-drm-extras = { git = "https://github.com/Smithay/smithay", rev = "023b78b1c5a05ca512767cacc07efca55fae8be4", default-features = false }
libc = { workspace = true }
# The lock request to logind (`lock.rs`), a blocking call on its own thread.
zbus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }
wayland-protocols-wlr = { workspace = true }
